<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="theme-color" content="#07090f" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Warp Core — a live intermix diagnostic bay. Click to fill the screen and keep the machine awake." />
  <title>Warp Core</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; }

    html, body {
      margin: 0;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090f;
      color: #d7e6f2;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas id="view" aria-hidden="true"></canvas>
  <p class="sr" id="live">Warp Core is running. Click to fill the screen and keep the machine awake. Click again to release.</p>
  <script>
(() => {
  "use strict";

  const MONO = 'ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace';
  const COILS = 8;
  const BINS = 64;
  const SROWS = 36;
  const SCOPE_N = 160;

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d", { alpha: false });
  const live = document.getElementById("live");

  const reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  let reduceMotion = reduceQuery.matches;
  reduceQuery.addEventListener("change", () => {
    reduceMotion = reduceQuery.matches;
  });

  const sim = {
    t: 0,
    pulse: 0,
    hot: 3,
    kick: 1,
    trim: 0,
    nextPulse: 2600,
    nextLog: 1200,
    logTick: 0,
    logNow: false,
  };

  const show = {
    matter: 2.4,
    anti: 2.4,
    ratio: 1,
    trim: 0,
    slip: 4.2,
    q: 1.82,
    beta: 1.48,
    bt: 4.62,
    bp: 0.84,
    ne: 8.15,
    ti: 12.4,
    te: 9.8,
    tau: 1.92,
    lattice: 99.15,
    shear: 0.011,
    vac: 2.08,
    eps: 36,
    port: 58,
    stbd: 58,
    braid: 41,
  };

  const coilI = new Float32Array(COILS);
  const coilT = new Float32Array(COILS);
  for (let i = 0; i < COILS; i++) {
    coilI[i] = 18;
    coilT[i] = 86;
  }

  const spec = new Float32Array(BINS * SROWS);
  const scopes = {
    slip: new Float32Array(SCOPE_N),
    shear: new Float32Array(SCOPE_N),
    mix: new Float32Array(SCOPE_N),
    coil: new Float32Array(SCOPE_N),
  };
  const trail = new Float32Array(96);
  let scopeHead = 0;
  let trailHead = 0;

  const logs = [];
  const shocks = [];
  const parts = [];
  for (let i = 0; i < 250; i++) {
    const kind = i < 86 ? "m" : i < 164 ? "a" : i < 214 ? "c" : "s";
    parts.push({
      kind,
      p: Math.random(),
      speed: kind === "s" ? 0.55 + Math.random() * 0.7 : 0.16 + Math.random() * 0.5,
      lane: Math.random(),
      side: i % 2 === 0 ? -1 : 1,
    });
  }

  let wantWake = false;
  let wakeLock = null;
  let wakeBusy = false;
  let wakeDenied = false;
  let fsFailed = false;
  let viewW = 0;
  let viewH = 0;
  let U = 1;
  let specAcc = 0;
  let scopeAcc = 0;
  const peaks = { f0: 0.22, f2: 0.46, fs: 0.74 };

  function font(px, weight) {
    return (weight || 500) + " " + Math.max(8, px) + "px " + MONO;
  }

  function fmt(n, d) {
    return Number.isFinite(n) ? n.toFixed(d) : "—";
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function signed(n, d) {
    const v = fmt(n, d);
    return (n >= 0 ? "+" : "") + v;
  }

  function ease(cur, target, dt, tau) {
    if (dt <= 0) return cur;
    return cur + (target - cur) * (1 - Math.exp(-dt / tau));
  }

  function clamp01(n) {
    return Math.max(0, Math.min(1, n));
  }

  function hex4(n) {
    return (n >>> 0 & 0xffff).toString(16).toUpperCase().padStart(4, "0");
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function clipped(b, fn) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x, b.y, b.w, b.h);
    ctx.clip();
    fn();
    ctx.restore();
  }

  function pushLog(text, warn) {
    const sec = Math.floor(sim.t / 1000);
    logs.push({
      stamp: pad(Math.floor(sec / 60) % 100) + ":" + pad(sec % 60),
      text,
      warn: !!warn,
    });
    if (logs.length > 18) logs.shift();
  }

  function gauss(x, c, w) {
    const d = x - c;
    return Math.exp(-(d * d) / w);
  }

  function pushSpec() {
    spec.copyWithin(0, BINS);
    const base = (SROWS - 1) * BINS;
    const t = sim.t;
    peaks.f0 = 0.2 + 0.045 * Math.sin(t * 0.00017);
    peaks.f2 = Math.min(0.9, peaks.f0 * 2.05 + 0.01 * Math.sin(t * 0.00023));
    peaks.fs = 0.68 + 0.06 * Math.sin(t * 0.00029) + sim.pulse * 0.08;
    const chirp = (t * 0.000031) % 1;
    for (let i = 0; i < BINS; i++) {
      const x = i / (BINS - 1);
      let v = 0.035 + Math.random() * 0.05;
      v += gauss(x, peaks.f0, 0.0011) * (0.78 + sim.pulse * 0.4);
      v += gauss(x, peaks.f0 - 0.045, 0.0008) * 0.16;
      v += gauss(x, peaks.f0 + 0.045, 0.0008) * (0.12 + sim.pulse * 0.35);
      v += gauss(x, peaks.f2, 0.0016) * 0.52;
      v += gauss(x, Math.min(0.96, peaks.f0 * 3.02), 0.0014) * 0.28;
      v += gauss(x, peaks.fs, 0.0022) * (0.2 + sim.pulse * 0.9);
      v += gauss(x, chirp, 0.0007) * 0.42;
      v += gauss(x, 0.08, 0.003) * 0.2;
      spec[base + i] = Math.max(0, Math.min(1, v));
    }
  }

  function pushScopes() {
    const err = show.ratio - 1;
    const hotI = coilI[sim.hot] || 18;
    scopes.slip[scopeHead] = clamp01(0.42 + (show.slip - 4.2) * 3.4);
    scopes.shear[scopeHead] = clamp01(0.12 + show.shear * 8.5);
    scopes.mix[scopeHead] = clamp01(0.5 + err * 16 + sim.trim * 4);
    scopes.coil[scopeHead] = clamp01(0.28 + (hotI - 18.4) / 12);
    const nx = (show.bp - 0.84) / 0.12;
    const ny = (show.bt - 4.62) / 0.22;
    trail[trailHead] = nx;
    trail[trailHead + 1] = ny;
    trailHead = (trailHead + 2) % trail.length;
    scopeHead = (scopeHead + 1) % SCOPE_N;
  }

  function step(dt) {
    sim.t += dt;
    if (!reduceMotion && sim.pulse < 0.04 && sim.t > sim.nextPulse) {
      sim.pulse = 1;
      sim.hot = Math.floor(Math.random() * COILS);
      sim.kick = Math.random() < 0.5 ? -1 : 1;
      sim.nextPulse = sim.t + 8000 + Math.random() * 7000;
      shocks.push({ r: 0.12, a: 1 });
      if (shocks.length > 5) shocks.shift();
      sim.logNow = true;
    }
    sim.pulse *= Math.exp(-dt / (reduceMotion ? 1 : 980));
    for (let i = shocks.length - 1; i >= 0; i--) {
      shocks[i].r += dt * (reduceMotion ? 0 : 0.00055);
      shocks[i].a -= dt * (reduceMotion ? 0.004 : 0.00055);
      if (shocks[i].a <= 0) shocks.splice(i, 1);
    }

    const cruise = 1 + 0.018 * Math.sin(sim.t * 0.00033) + 0.01 * Math.sin(sim.t * 0.00115);
    const kick = sim.pulse;
    const mixKick = kick * sim.kick * 0.075;
    const matterT = 2.4 * cruise * (1 + sim.trim);
    const antiT = 2.4 * cruise * (1 + mixKick) * (1 - sim.trim);
    show.matter = ease(show.matter, matterT, dt, 160);
    show.anti = ease(show.anti, antiT, dt, 160);
    show.ratio = show.anti > 0.001 ? show.matter / show.anti : 1;
    const err = show.ratio - 1;
    sim.trim = ease(sim.trim, Math.max(-0.06, Math.min(0.06, -err * 0.9)), dt, 420);
    show.trim = sim.trim;

    show.slip = ease(show.slip, 4.2 * cruise * (1 + kick * 0.11) * (0.9 + show.lattice / 1000), dt, 220);
    show.q = ease(show.q, 1.84 + (show.lattice - 99.1) * 0.06 - kick * 0.28, dt, 260);
    show.beta = ease(show.beta, 1.46 * cruise + kick * 0.42, dt, 240);
    show.bt = ease(show.bt, 4.62 + 0.16 * Math.sin(sim.t * 0.00072) + kick * 0.62, dt, 180);
    show.bp = ease(show.bp, 0.84 + 0.07 * Math.sin(sim.t * 0.00125 + 0.8) + kick * 0.16, dt, 180);
    show.ne = ease(show.ne, 8.15 * cruise + kick * 1.55, dt, 220);
    show.ti = ease(show.ti, 12.4 + 1.4 * Math.sin(sim.t * 0.00042) + kick * 5.2, dt, 240);
    show.te = ease(show.te, 9.8 + 0.7 * Math.sin(sim.t * 0.00053 + 0.4) + kick * 2.4, dt, 240);
    show.tau = ease(show.tau, 1.94 - kick * 0.52 + 0.04 * Math.sin(sim.t * 0.0006), dt, 280);
    show.lattice = ease(show.lattice, 99.15 - kick * 3.1 + 0.1 * Math.sin(sim.t * 0.0008), dt, 320);
    show.shear = ease(show.shear, 0.012 + 0.005 * Math.sin(sim.t * 0.0021) + kick * 0.098, dt, 140);
    show.vac = ease(show.vac, 2.06 + 0.08 * Math.sin(sim.t * 0.001) + kick * 1.7, dt, 280);
    show.eps = ease(show.eps, 36 + 5 * Math.sin(sim.t * 0.00047) + kick * 20, dt, 260);
    show.port = ease(show.port, 58.4 * cruise * (1 + kick * 0.16), dt, 200);
    show.stbd = ease(show.stbd, 58.4 * cruise * (1 - kick * 0.04 * sim.kick), dt, 200);
    const braidT = show.matter * show.anti * 7.15 * (show.lattice / 99.15) * (1 + kick * 0.85);
    show.braid = ease(show.braid, braidT, dt, 180);

    for (let i = 0; i < COILS; i++) {
      const wave = 18.4 + 3.2 * Math.sin(sim.t * 0.0017 - i * 0.7);
      const near = Math.exp(-((i - sim.hot) ** 2) / 1.25);
      const amps = wave + kick * near * 9.5;
      coilI[i] = ease(coilI[i], amps, dt, 150);
      coilT[i] = ease(coilT[i], 84 + (amps - 18) * 1.35 + kick * near * 11, dt, 320);
    }

    const motion = reduceMotion ? 0 : dt / 1000;
    const flow = 0.65 + show.matter / 5;
    for (let i = 0; i < parts.length; i++) {
      parts[i].p = (parts[i].p + parts[i].speed * motion * flow) % 1;
    }

    if (sim.logNow) {
      sim.logNow = false;
      pushLog(
        "SHEAR " + fmt(show.shear, 3)
        + "  C" + (sim.hot + 1) + " " + fmt(coilI[sim.hot], 1) + " kA"
        + "  TRIM " + signed(show.trim * 100, 2) + "%",
        true
      );
    } else if (sim.t > sim.nextLog) {
      const routine = [
        "MIX LOCK  Δ " + signed((show.ratio - 1) * 100, 3) + "%",
        "FIELD Bt " + fmt(show.bt, 2) + " T   Bp " + fmt(show.bp, 2),
        "LATTICE " + fmt(show.lattice, 2) + "%  Q " + fmt(show.q, 2),
        "CONDUIT Δ " + signed(show.port - show.stbd, 2) + " MW",
        "BRAID " + fmt(show.braid, 1) + " MW   m/n " + (sim.pulse > 0.45 ? "3/2" : "2/1"),
        "JACKET " + fmt(show.vac, 2) + " µPa  EPS " + fmt(show.eps, 1) + "%",
        "τE " + fmt(show.tau, 2) + " s   Ti " + fmt(show.ti, 1) + " keV",
        "COIL SET " + fmt(coilI[0], 1) + "–" + fmt(coilI[7], 1) + " kA",
      ];
      pushLog(routine[sim.logTick % routine.length], false);
      sim.logTick += 1;
      sim.nextLog = sim.t + (reduceMotion ? 4800 : 2200);
    }

    specAcc += dt;
    const specStep = reduceMotion ? 260 : 64;
    while (specAcc >= specStep) {
      specAcc -= specStep;
      pushSpec();
    }
    scopeAcc += dt;
    const scopeStep = reduceMotion ? 220 : 32;
    while (scopeAcc >= scopeStep) {
      scopeAcc -= scopeStep;
      pushScopes();
    }
  }

  function layout(w, h) {
    const pad = Math.max(10, Math.round(Math.min(w, h) * 0.014));
    const gap = 8;
    const header = Math.round(52 * Math.max(0.9, U));
    const footer = Math.round(26 * U);
    const scopeH = Math.round(Math.max(86, Math.min(118, h * 0.145)));
    const top = pad + header + gap;
    const scopeY = h - pad - footer - gap - scopeH;
    const bodyH = Math.max(0, scopeY - gap - top);
    const wide = w >= 1080 && bodyH > 220;
    const mid = !wide && w >= 860 && bodyH > 200;
    let leftW = 0;
    let rightW = 0;
    if (wide) {
      leftW = Math.round(Math.min(340, w * 0.24));
      rightW = Math.round(Math.min(330, w * 0.23));
    } else if (mid) {
      leftW = Math.round(w * 0.28);
      rightW = Math.round(w * 0.27);
    }
    const headerB = { x: pad, y: pad, w: w - pad * 2, h: header };
    const footerB = { x: pad, y: h - pad - footer, w: w - pad * 2, h: footer };
    const scopeB = { x: pad, y: scopeY, w: w - pad * 2, h: scopeH };
    if (!leftW) {
      const chamberH = Math.max(200, Math.round(bodyH * 0.62));
      const lowerY = top + chamberH + gap;
      const lowerH = Math.max(0, scopeY - gap - lowerY);
      const half = Math.floor((w - pad * 2 - gap) / 2);
      return {
        header: headerB,
        footer: footerB,
        scope: scopeB,
        chamber: { x: pad, y: top, w: w - pad * 2, h: chamberH },
        left: { x: pad, y: lowerY, w: half, h: lowerH },
        right: { x: pad + half + gap, y: lowerY, w: w - pad * 2 - half - gap, h: lowerH },
      };
    }
    const midX = pad + leftW + gap;
    const midW = w - pad * 2 - leftW - rightW - gap * 2;
    return {
      header: headerB,
      footer: footerB,
      scope: scopeB,
      left: { x: pad, y: top, w: leftW, h: bodyH },
      chamber: { x: midX, y: top, w: midW, h: bodyH },
      right: { x: w - pad - rightW, y: top, w: rightW, h: bodyH },
    };
  }

  function panel(b, title) {
    ctx.fillStyle = "rgba(7, 11, 18, 0.82)";
    ctx.strokeStyle = "rgba(150, 186, 214, 0.32)";
    ctx.lineWidth = 1;
    roundRect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "rgba(201, 166, 255, 0.95)";
    ctx.lineWidth = 1.5;
    const c = 12;
    ctx.beginPath();
    ctx.moveTo(b.x + 1, b.y + c); ctx.lineTo(b.x + 1, b.y + 1); ctx.lineTo(b.x + c, b.y + 1);
    ctx.moveTo(b.x + b.w - c, b.y + 1); ctx.lineTo(b.x + b.w - 1, b.y + 1); ctx.lineTo(b.x + b.w - 1, b.y + c);
    ctx.moveTo(b.x + 1, b.y + b.h - c); ctx.lineTo(b.x + 1, b.y + b.h - 1); ctx.lineTo(b.x + c, b.y + b.h - 1);
    ctx.moveTo(b.x + b.w - c, b.y + b.h - 1); ctx.lineTo(b.x + b.w - 1, b.y + b.h - 1); ctx.lineTo(b.x + b.w - 1, b.y + b.h - c);
    ctx.stroke();
    ctx.font = font(10 * U, 700);
    ctx.fillStyle = "#c9a6ff";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText(title, b.x + 14, b.y + 7);
    ctx.strokeStyle = "rgba(201, 166, 255, 0.28)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.x + 14, b.y + 22);
    ctx.lineTo(b.x + b.w - 12, b.y + 22);
    ctx.stroke();
    return { x: b.x + 12, y: b.y + 28, w: b.w - 24, h: Math.max(0, b.h - 40) };
  }

  function columnPath(cx, top, bot, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(cx - rx, top + ry);
    ctx.lineTo(cx - rx, bot - ry);
    ctx.ellipse(cx, bot - ry, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rx, top + ry);
    ctx.ellipse(cx, top + ry, rx, ry, 0, 0, Math.PI, true);
    ctx.closePath();
  }

  function drawBackground(w, h) {
    ctx.fillStyle = "#06080e";
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w * 0.5, h * 0.46, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
    g.addColorStop(0, "#14182a");
    g.addColorStop(0.5, "#0a0e18");
    g.addColorStop(1, "#06080e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(120, 160, 200, 0.045)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0.5; x < w; x += 32) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
    }
    for (let y = 0.5; y < h; y += 32) {
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
    }
    ctx.stroke();
    ctx.strokeStyle = "rgba(150, 190, 220, 0.08)";
    ctx.beginPath();
    for (let x = 0.5; x < w; x += 160) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
    }
    for (let y = 0.5; y < h; y += 160) {
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
    }
    ctx.stroke();
    ctx.save();
    ctx.translate(w * 0.5, h * 0.46);
    ctx.strokeStyle = "rgba(170, 150, 230, 0.07)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const vault = Math.min(w, h) * 0.46;
    for (let i = 1; i <= 6; i++) ctx.arc(0, 0, vault * (i / 6), 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = "rgba(120, 190, 220, 0.05)";
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      ctx.moveTo(Math.cos(a) * vault * 0.12, Math.sin(a) * vault * 0.12);
      ctx.lineTo(Math.cos(a) * vault, Math.sin(a) * vault);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawHeader(b) {
    const transient = sim.pulse > 0.18;
    const y = b.y + 16;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = font(15 * U, 750);
    ctx.fillStyle = "#f4f8ff";
    ctx.fillText("WARP CORE", b.x, y);
    const tw = ctx.measureText("WARP CORE").width;
    ctx.font = font(10 * U, 650);
    ctx.fillStyle = "rgba(201, 166, 255, 0.92)";
    ctx.fillText("INTERMIX BAY", b.x + tw + 12, y);

    const mode = transient ? "TRANSIENT" : "CRUISE";
    ctx.font = font(10 * U, 700);
    const mw = ctx.measureText(mode).width;
    const mx = b.x + tw + 12 + ctx.measureText("INTERMIX BAY").width + 16;
    ctx.fillStyle = transient ? "rgba(255, 177, 90, 0.16)" : "rgba(142, 240, 200, 0.1)";
    roundRect(mx - 6, y - 9, mw + 12, 18, 3);
    ctx.fill();
    ctx.fillStyle = transient ? "#ffb15a" : "#8ef0c8";
    ctx.fillText(mode, mx, y);

    const now = new Date();
    const clock = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    const cycle = Math.floor(sim.t / 80).toString(16).toUpperCase().padStart(6, "0");
    ctx.textAlign = "right";
    ctx.font = font(13 * U, 700);
    ctx.fillStyle = "#e9f3fb";
    ctx.fillText(clock, b.x + b.w, y);
    const cw = ctx.measureText(clock).width;
    ctx.font = font(10 * U, 600);
    ctx.fillStyle = "rgba(170, 198, 216, 0.72)";
    ctx.fillText("CYCLE " + cycle, b.x + b.w - cw - 14, y);

    const stats = [
      ["SLIP", fmt(show.slip, 3), show.slip > 4.55],
      ["Q", fmt(show.q, 2), show.q < 1.62],
      ["βN", fmt(show.beta, 2), show.beta > 1.8],
      ["Bt", fmt(show.bt, 2) + " T", show.bt > 5.05],
      ["ne", fmt(show.ne, 2), show.ne > 9.2],
      ["BRAID", fmt(show.braid, 0) + " MW", sim.pulse > 0.35],
      ["ΔMIX", signed((show.ratio - 1) * 100, 2) + "%", Math.abs(show.ratio - 1) > 0.012],
    ];
    if (b.w > 880) {
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      const y2 = b.y + b.h - 14;
      let x = b.x;
      const limit = b.x + b.w;
      for (let i = 0; i < stats.length; i++) {
        ctx.font = font(9 * U, 650);
        const lw = ctx.measureText(stats[i][0]).width;
        ctx.font = font(12 * U, 700);
        const vw = ctx.measureText(stats[i][1]).width;
        const need = lw + vw + 22;
        if (x + need - 16 > limit) break;
        ctx.font = font(9 * U, 650);
        ctx.fillStyle = "rgba(160, 190, 210, 0.62)";
        ctx.fillText(stats[i][0], x, y2);
        ctx.font = font(12 * U, 700);
        ctx.fillStyle = stats[i][2] ? "#ffb15a" : "#f3fbff";
        ctx.fillText(stats[i][1], x + lw + 6, y2);
        x += need;
      }
    }
    ctx.strokeStyle = "rgba(201, 166, 255, 0.35)";
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.h - 1);
    ctx.lineTo(b.x + b.w, b.y + b.h - 1);
    ctx.stroke();
  }

  function fieldRows() {
    const mixHot = Math.abs(show.ratio - 1) > 0.012;
    return [
      ["M-FLOW", fmt(show.matter, 3), "g/s", false],
      ["AM-FLOW", fmt(show.anti, 3), "g/s", mixHot],
      ["RATIO", fmt(show.ratio, 4), "", mixHot],
      ["TRIM", signed(show.trim * 100, 2), "%", Math.abs(show.trim) > 0.012],
      ["SLIP", fmt(show.slip, 3), "", show.slip > 4.55],
      ["Q", fmt(show.q, 2), "", show.q < 1.62],
      ["βN", fmt(show.beta, 2), "", show.beta > 1.8],
      ["τE", fmt(show.tau, 2), "s", show.tau < 1.6],
      ["Bt", fmt(show.bt, 2), "T", show.bt > 5.05],
      ["Bp", fmt(show.bp, 3), "T", false],
      ["ne", fmt(show.ne, 2), "e19", show.ne > 9.2],
      ["Ti", fmt(show.ti, 1), "keV", show.ti > 16],
      ["Te", fmt(show.te, 1), "keV", false],
      ["LATT", fmt(show.lattice, 2), "%", show.lattice < 97.4],
      ["SHEAR", fmt(show.shear, 3), "", show.shear > 0.04],
      ["VAC", fmt(show.vac, 2), "µPa", show.vac > 3.1],
      ["BRAID", fmt(show.braid, 1), "MW", sim.pulse > 0.35],
    ];
  }

  function drawRows(x, y, w, h, rows) {
    const rowH = Math.min(20, Math.max(11, h / Math.max(1, rows.length)));
    const count = Math.max(1, Math.floor(h / rowH));
    const small = rowH < 15 || w < 170;
    const unitW = small ? 32 : 42;
    ctx.textBaseline = "middle";
    for (let i = 0; i < rows.length && i < count; i++) {
      const yy = y + rowH * (i + 0.5);
      const item = rows[i];
      ctx.beginPath();
      ctx.fillStyle = item[3] ? "#ffb15a" : "rgba(142, 240, 200, 0.85)";
      ctx.arc(x + 3, yy, 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.textAlign = "left";
      ctx.font = font(small ? 8 : 10, 650);
      ctx.fillStyle = "rgba(168, 198, 216, 0.72)";
      ctx.fillText(item[0], x + 9, yy);
      ctx.textAlign = "right";
      ctx.font = font(small ? 9 : 11, 700);
      ctx.fillStyle = item[3] ? "#ffb15a" : "#f5fbff";
      ctx.fillText(item[1], x + w - unitW, yy);
      if (item[2]) {
        ctx.textAlign = "left";
        ctx.font = font(small ? 8 : 9, 600);
        ctx.fillStyle = "rgba(168, 198, 216, 0.5)";
        ctx.fillText(item[2], x + w - unitW + 5, yy);
      }
    }
    return rowH * Math.min(rows.length, count);
  }

  function specColor(v) {
    if (v < 0.2) return null;
    if (v < 0.42) {
      const k = (v - 0.2) / 0.22;
      return "rgba(" + (36 + 50 * k | 0) + "," + (70 + 50 * k | 0) + "," + (130 + 70 * k | 0) + ",0.92)";
    }
    if (v < 0.7) {
      const k = (v - 0.42) / 0.28;
      return "rgba(" + (90 + 110 * k | 0) + "," + (80 + 30 * k | 0) + ",210,0.96)";
    }
    const k = (v - 0.7) / 0.3;
    return "rgba(235," + (190 + 50 * k | 0) + "," + (120 + 80 * k | 0) + ",0.98)";
  }

  function drawSpec(x, y, w, h) {
    ctx.font = font(8, 700);
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(168, 198, 216, 0.7)";
    ctx.fillText("CHAMBER HARMONICS", x, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(201, 166, 255, 0.8)";
    ctx.fillText("f0 " + Math.round(peaks.f0 * 480) + " kHz", x + w, y);
    const plotY = y + 12;
    const plotH = h - 26;
    if (plotH < 16 || w < 20) return;
    const cw = w / BINS;
    const rh = plotH / SROWS;
    for (let row = 0; row < SROWS; row++) {
      for (let col = 0; col < BINS; col++) {
        const color = specColor(spec[row * BINS + col]);
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(x + col * cw, plotY + row * rh, Math.max(1, cw + 0.2), Math.max(1, rh + 0.2));
      }
    }
    ctx.strokeStyle = "rgba(160, 190, 220, 0.28)";
    ctx.strokeRect(x + 0.5, plotY + 0.5, w - 1, plotH - 1);
    const scanY = plotY + plotH - Math.max(2, plotH / SROWS);
    ctx.strokeStyle = "rgba(240, 220, 170, 0.55)";
    ctx.beginPath();
    ctx.moveTo(x, scanY);
    ctx.lineTo(x + w, scanY);
    ctx.stroke();
    const marks = [
      [peaks.f0, "f0", "#9edfff"],
      [peaks.f2, "2f", "#c9a6ff"],
      [peaks.fs, "σ", sim.pulse > 0.2 ? "#ffb15a" : "#d7e6f2"],
    ];
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.font = font(8, 700);
    for (let i = 0; i < marks.length; i++) {
      const mx = x + marks[i][0] * w;
      ctx.strokeStyle = marks[i][2];
      ctx.beginPath();
      ctx.moveTo(mx, plotY);
      ctx.lineTo(mx, plotY + 7);
      ctx.stroke();
      ctx.fillStyle = marks[i][2];
      ctx.fillText(marks[i][1], mx, plotY + plotH + 2);
    }
    ctx.fillStyle = "rgba(160, 190, 210, 0.45)";
    ctx.font = font(7, 600);
    ctx.textAlign = "left";
    ctx.fillText("0", x, plotY + plotH + 2);
    ctx.textAlign = "right";
    ctx.fillText("480", x + w, plotY + plotH + 2);
  }

  function drawLog(x, y, w, h) {
    ctx.font = font(8, 700);
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(168, 198, 216, 0.66)";
    ctx.fillText("EVENT", x, y);
    const lineH = 12;
    const maxLines = Math.max(1, Math.floor((h - 12) / lineH));
    const start = Math.max(0, logs.length - maxLines);
    ctx.font = font(9, 550);
    for (let i = start; i < logs.length; i++) {
      const row = logs[i];
      const yy = y + 13 + (i - start) * lineH;
      ctx.fillStyle = "rgba(140, 168, 188, 0.55)";
      ctx.fillText(row.stamp, x, yy);
      ctx.fillStyle = row.warn ? "#ffb15a" : "rgba(220, 234, 244, 0.82)";
      ctx.fillText(row.text, x + 36, yy);
    }
  }

  function drawLeft(b) {
    if (b.w < 40 || b.h < 30) return;
    clipped(b, () => {
      const inner = panel(b, "PLANT STATE");
      if (inner.h < 20) return;
      const rows = fieldRows();
      const two = inner.w >= 308;
      const per = two ? Math.ceil(rows.length / 2) : rows.length;
      const tableH = Math.min(inner.h * (two ? 0.48 : 0.62), per * 20);
      if (two) {
        const colW = (inner.w - 14) / 2;
        const half = Math.ceil(rows.length / 2);
        drawRows(inner.x, inner.y, colW, tableH, rows.slice(0, half));
        drawRows(inner.x + colW + 14, inner.y, colW, tableH, rows.slice(half));
        ctx.strokeStyle = "rgba(160, 190, 220, 0.16)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(inner.x + colW + 7, inner.y + 2);
        ctx.lineTo(inner.x + colW + 7, inner.y + tableH - 2);
        ctx.stroke();
      } else {
        drawRows(inner.x, inner.y, inner.w, tableH, rows);
      }
      let y = inner.y + tableH + 6;
      const remain = inner.y + inner.h - y;
      const specH = Math.min(150, Math.max(0, remain - (remain > 120 ? 78 : 0)));
      if (specH > 48) {
        drawSpec(inner.x, y, inner.w, specH);
        y += specH + 4;
      }
      const logH = inner.y + inner.h - y;
      if (logH > 28) drawLog(inner.x, y, inner.w, logH);
    });
  }

  function dial(x, y, r, deg, hot, frac) {
    ctx.beginPath();
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = 1;
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.strokeStyle = hot ? "#ffb15a" : "rgba(201, 166, 255, 0.95)";
    ctx.lineWidth = 1.7;
    const a0 = Math.PI * 0.75;
    ctx.arc(x, y, r, a0, a0 + Math.max(0.15, frac) * Math.PI * 1.5);
    ctx.stroke();
    const a = (deg - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.lineWidth = 1;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * (r - 1.4), y + Math.sin(a) * (r - 1.4));
    ctx.stroke();
  }

  function drawBus(x, y, w, h) {
    ctx.font = font(8, 700);
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(168, 198, 216, 0.7)";
    ctx.fillText("COIL BUS", x, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(201, 166, 255, 0.75)";
    ctx.fillText("FRAME", x + w, y);
    const lines = 4;
    const lineH = Math.min(14, (h - 14) / lines);
    ctx.font = font(10, 600);
    ctx.textAlign = "left";
    for (let row = 0; row < lines; row++) {
      const i0 = row * 2;
      const a = coilI[i0] * 100 + coilT[i0];
      const b = coilI[i0 + 1] * 100 + coilT[i0 + 1];
      const c = (show.bt * 1000 + sim.t / 40 + row * 97) % 65536;
      const d = (show.ne * 500 + show.shear * 8000 + row * 13) % 65536;
      const text = "C" + (i0 + 1) + " " + hex4(a) + "  " + hex4(b) + "  " + hex4(c) + "  " + hex4(d);
      ctx.fillStyle = row === sim.hot >> 1 && sim.pulse > 0.2 ? "#ffb15a" : "rgba(214, 230, 242, 0.78)";
      ctx.fillText(text, x, y + 14 + row * lineH);
    }
  }

  function drawVector(x, y, w, h) {
    ctx.font = font(8, 700);
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(168, 198, 216, 0.7)";
    ctx.fillText("FIELD VECTOR", x, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(201, 166, 255, 0.8)";
    ctx.fillText("Bp ±0.12   Bt ±0.22", x + w, y);
    const plot = { x: x, y: y + 14, w: w, h: h - 28 };
    if (plot.w < 40 || plot.h < 40) return;
    const cx = plot.x + plot.w / 2;
    const cy = plot.y + plot.h / 2;
    const r = Math.min(plot.w, plot.h) * 0.4;
    ctx.strokeStyle = "rgba(160, 190, 220, 0.28)";
    ctx.strokeRect(plot.x + 0.5, plot.y + 0.5, plot.w - 1, plot.h - 1);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.moveTo(cx - r, cy);
    ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx, cy + r);
    ctx.stroke();
    ctx.font = font(7, 600);
    ctx.fillStyle = "rgba(160, 190, 210, 0.45)";
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("Bp", cx + r + 3, cy - 2);
    ctx.textAlign = "center";
    ctx.fillText("Bt", cx, cy - r - 2);
    const n = trail.length / 2;
    const span = r * 0.92;
    ctx.beginPath();
    ctx.strokeStyle = "rgba(126, 231, 255, 0.9)";
    ctx.lineWidth = 1.35;
    for (let i = 0; i < n; i++) {
      const idx = ((trailHead / 2) + i) % n;
      const px = cx + Math.max(-1.15, Math.min(1.15, trail[idx * 2])) * span;
      const py = cy - Math.max(-1.15, Math.min(1.15, trail[idx * 2 + 1])) * span;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    const last = (trailHead / 2 + n - 1) % n;
    const hx = cx + Math.max(-1.15, Math.min(1.15, trail[last * 2])) * span;
    const hy = cy - Math.max(-1.15, Math.min(1.15, trail[last * 2 + 1])) * span;
    ctx.fillStyle = sim.pulse > 0.2 ? "#ffb15a" : "#f0c86a";
    ctx.beginPath();
    ctx.arc(hx, hy, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = font(8, 650);
    ctx.fillStyle = "rgba(214, 230, 242, 0.8)";
    ctx.fillText("Bp " + fmt(show.bp, 3) + " T    Bt " + fmt(show.bt, 2) + " T", x, y + h - 12);
  }

  function drawRight(b) {
    if (b.w < 40 || b.h < 30) return;
    clipped(b, () => {
      const inner = panel(b, "COIL BANK");
      if (inner.h < 20) return;
      ctx.textAlign = "right";
      ctx.textBaseline = "top";
      ctx.font = font(8, 650);
      ctx.fillStyle = "rgba(168, 198, 216, 0.5)";
      ctx.fillText("kA", inner.x + inner.w - 36, inner.y - 2);
      ctx.fillText("K", inner.x + inner.w, inner.y - 2);
      const rowTop = inner.y + 12;
      const rowH = Math.min(24, Math.max(14, (inner.h * 0.46) / COILS));
      ctx.textBaseline = "middle";
      for (let i = 0; i < COILS; i++) {
        const y = rowTop + rowH * (i + 0.5);
        const hot = sim.pulse > 0.2 && i === sim.hot;
        const phase = reduceMotion ? i * 45 : (sim.t * 0.045 + i * 45) % 360;
        const frac = clamp01((coilI[i] - 12) / 18);
        const nom = clamp01((18.4 - 12) / 18);
        ctx.textAlign = "left";
        ctx.font = font(rowH < 17 ? 8 : 10, 700);
        ctx.fillStyle = hot ? "#ffb15a" : "rgba(186, 214, 230, 0.86)";
        ctx.fillText("C" + (i + 1), inner.x, y);
        dial(inner.x + 28, y, rowH < 17 ? 5.5 : 7, phase, hot, frac);
        const barX = inner.x + 42;
        const barW = Math.max(16, inner.w - 132);
        ctx.fillStyle = "rgba(255,255,255,0.06)";
        ctx.fillRect(barX, y - 2.5, barW, 5);
        ctx.fillStyle = hot ? "#ffb15a" : "#c9a6ff";
        ctx.fillRect(barX, y - 2.5, barW * frac, 5);
        ctx.fillStyle = "rgba(240, 248, 255, 0.8)";
        ctx.fillRect(barX + barW * nom, y - 5, 1.4, 10);
        ctx.textAlign = "right";
        ctx.font = font(rowH < 17 ? 8 : 10, 700);
        ctx.fillStyle = hot ? "#ffb15a" : "#f4fbff";
        ctx.fillText(fmt(coilI[i], 1), inner.x + inner.w - 36, y);
        ctx.font = font(8, 600);
        ctx.fillStyle = coilT[i] > 104 ? "#ffb15a" : "rgba(168, 198, 216, 0.75)";
        ctx.fillText(fmt(coilT[i], 0), inner.x + inner.w, y);
      }
      let y = rowTop + rowH * COILS + 8;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.font = font(8, 650);
      ctx.fillStyle = "rgba(168, 198, 216, 0.65)";
      ctx.fillText("PORT " + fmt(show.port, 1) + " MW", inner.x, y);
      ctx.textAlign = "right";
      const sync = show.port - show.stbd;
      ctx.fillStyle = Math.abs(sync) > 3 ? "#ffb15a" : "rgba(214, 230, 242, 0.84)";
      ctx.fillText("STBD " + fmt(show.stbd, 1) + "   Δ " + signed(sync, 2), inner.x + inner.w, y);
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(168, 198, 216, 0.7)";
      ctx.fillText("EPS " + fmt(show.eps, 1) + " %", inner.x, y + 12);
      y += 10;
      y += 16;
      const busH = 72;
      if (y + busH < inner.y + inner.h - 40) {
        drawBus(inner.x, y, inner.w, busH);
        y += busH + 6;
      }
      const rest = inner.y + inner.h - y;
      if (rest > 70) drawVector(inner.x, y, inner.w, rest);
    });
  }

  function drawChamber(b) {
    if (b.w < 48 || b.h < 48) return;
    clipped(b, () => {
      const inner = panel(b, "SLIP HORIZON");
      if (inner.h < 40 || inner.w < 40) return;
      const cx = inner.x + inner.w * 0.5;
      const top = inner.y + Math.max(34, inner.h * 0.08);
      const bot = inner.y + inner.h - Math.max(20, inner.h * 0.055);
      const mid = (top + bot) * 0.5;
      const half = (bot - top) * 0.5;
      const span = bot - top - 2;
      const rx = Math.max(28, Math.min(inner.w * 0.2, 108, Math.max(54, half * 0.46)));
      const ry = Math.max(7, rx * 0.2);
      const jacket = rx + 18;
      const wingL = cx - jacket - inner.x;
      const wingR = inner.x + inner.w - (cx + jacket);
      const leftCol = wingL > 196 ? Math.min(176, wingL - 92) : 0;
      const rightCol = wingR > 186 ? Math.min(180, wingR - 88) : 0;
      const spin = reduceMotion ? 0.7 : sim.t * 0.0015;
      const modeMN = sim.pulse > 0.5 ? "3/2" : "2/1";

      const glow = ctx.createRadialGradient(cx, mid, 8, cx, mid, jacket * 2.8);
      glow.addColorStop(0, "rgba(255, 236, 196, " + (0.28 + sim.pulse * 0.45) + ")");
      glow.addColorStop(0.35, "rgba(150, 120, 210, 0.12)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(inner.x, inner.y, inner.w, inner.h);

      const pipeL = inner.x + leftCol + 26;
      const pipeR = inner.x + inner.w - rightCol - 26;

      function duct(x0, x1) {
        const left = Math.min(x0, x1);
        const w = Math.abs(x1 - x0);
        if (w < 8) return;
        ctx.fillStyle = "rgba(12, 20, 32, 0.92)";
        ctx.strokeStyle = "rgba(176, 206, 226, 0.62)";
        ctx.lineWidth = 1;
        ctx.fillRect(left, mid - 8, w, 16);
        ctx.strokeRect(left + 0.5, mid - 7.5, w - 1, 15);
        ctx.strokeStyle = "rgba(126, 231, 255, 0.35)";
        ctx.beginPath();
        ctx.moveTo(left + 3, mid);
        ctx.lineTo(left + w - 3, mid);
        ctx.stroke();
        ctx.strokeStyle = "rgba(210, 186, 255, 0.28)";
        ctx.beginPath();
        ctx.moveTo(left + 3, mid - 3);
        ctx.lineTo(left + w - 3, mid - 3);
        ctx.moveTo(left + 3, mid + 3);
        ctx.lineTo(left + w - 3, mid + 3);
        ctx.stroke();
        for (let i = 1; i <= 3; i++) {
          const x = left + w * (i / 4);
          ctx.strokeStyle = "rgba(198, 224, 238, 0.55)";
          ctx.strokeRect(x - 1.5, mid - 11, 3, 22);
        }
      }
      duct(pipeL, cx - jacket);
      duct(cx + jacket, pipeR);

      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        if (p.kind !== "c") continue;
        const x0 = cx + p.side * (jacket - 4);
        const x1 = p.side < 0 ? pipeL + 6 : pipeR - 6;
        const x = x0 + (x1 - x0) * p.p;
        const a = Math.sin(p.p * Math.PI);
        ctx.fillStyle = "rgba(255, 214, 140, " + (0.2 + a * 0.8) + ")";
        ctx.fillRect(x, mid - 1.2, 8, 2.4);
      }

      function bell(x, dir) {
        ctx.save();
        ctx.translate(x, mid);
        ctx.fillStyle = "rgba(150, 205, 255, 0.14)";
        ctx.strokeStyle = "rgba(214, 236, 255, 0.9)";
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(dir * 16, -8);
        ctx.lineTo(dir * 22, -3);
        ctx.lineTo(dir * 22, 3);
        ctx.lineTo(dir * 16, 8);
        ctx.lineTo(0, 14);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      bell(pipeL - 2, -1);
      bell(pipeR + 2, 1);

      ctx.fillStyle = "rgba(8, 14, 24, 0.55)";
      ctx.strokeStyle = "rgba(186, 214, 230, 0.45)";
      ctx.lineWidth = 1.2;
      columnPath(cx, top - 6, bot + 6, jacket, ry + 5);
      ctx.fill();
      ctx.stroke();
      for (let i = 0; i < COILS; i++) {
        const y = top + span * ((i + 0.5) / COILS);
        ctx.strokeStyle = "rgba(170, 198, 216, 0.22)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(cx, y, jacket - 4, ry * 0.72, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      for (let s = 0; s < 7; s++) {
        const ang = Math.PI * (0.08 + s / 6 * 0.84);
        const x = cx + Math.cos(ang) * (jacket - 8);
        const front = Math.sin(ang);
        ctx.strokeStyle = "rgba(186, 210, 226, " + (0.08 + front * 0.16) + ")";
        ctx.beginPath();
        ctx.moveTo(x, top + ry);
        ctx.lineTo(x, bot - ry);
        ctx.stroke();
      }

      for (let i = 0; i < COILS; i++) {
        const y = top + span * ((i + 0.5) / COILS);
        const amp = clamp01((coilI[i] - 12) / 16);
        const hot = sim.pulse > 0.15 && i === sim.hot;
        ctx.strokeStyle = hot
          ? "rgba(255, 177, 90, 0.35)"
          : "rgba(176, 150, 220, " + (0.18 + amp * 0.2) + ")";
        ctx.lineWidth = 5 + amp * 3;
        ctx.beginPath();
        ctx.ellipse(cx, y, rx + 7, ry * 1.15, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.lineCap = "round";
      for (let rib = 0; rib < 8; rib++) {
        ctx.beginPath();
        ctx.lineWidth = 1.15;
        const steps = 36;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const y = top + t * (bot - top);
          const ang = spin * 0.55 + rib * (Math.PI * 2 / 8) + t * Math.PI * 2;
          const facing = Math.cos(ang);
          if (i === 0) ctx.strokeStyle = "rgba(186, 220, 255, " + (0.08 + Math.max(0, facing) * 0.28) + ")";
          const x = cx + facing * (jacket + 8);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.lineCap = "butt";

      const bore = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
      bore.addColorStop(0, "rgba(8, 12, 22, 0.2)");
      bore.addColorStop(0.5, "rgba(40, 56, 84, 0.35)");
      bore.addColorStop(1, "rgba(8, 12, 22, 0.2)");
      ctx.fillStyle = bore;
      ctx.strokeStyle = "rgba(226, 240, 250, 0.88)";
      ctx.lineWidth = 1.4;
      columnPath(cx, top, bot, rx, ry);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      columnPath(cx, top + ry * 0.2, bot - ry * 0.2, rx - 1.5, Math.max(3, ry - 1));
      ctx.clip();

      const plasma = ctx.createRadialGradient(cx, mid, 2, cx, mid, rx * 1.15);
      plasma.addColorStop(0, "rgba(255, 250, 236, " + (0.85 + sim.pulse * 0.15) + ")");
      plasma.addColorStop(0.12, "rgba(255, 214, 130, " + (0.55 + sim.pulse * 0.35) + ")");
      plasma.addColorStop(0.32, "rgba(190, 140, 255, 0.22)");
      plasma.addColorStop(0.7, "rgba(40, 70, 120, 0.08)");
      plasma.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = plasma;
      ctx.fillRect(cx - rx, top, rx * 2, span + ry * 2);

      for (let i = 0; i < 16; i++) {
        const u = (i + 0.5) / 16;
        const z = Math.sign(u - 0.5) * Math.pow(Math.abs(u - 0.5) * 2, 0.45);
        const y = mid + z * (half - ry) * 0.96;
        const bunch = 1 - Math.abs(z);
        ctx.strokeStyle = "rgba(190, 230, 255, " + (0.06 + bunch * 0.42 + sim.pulse * 0.15) + ")";
        ctx.lineWidth = bunch > 0.72 ? 1.6 : 1;
        ctx.beginPath();
        ctx.ellipse(cx, y, rx * (0.42 + bunch * 0.5), Math.max(2.5, ry * (0.45 + bunch * 0.7)), 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      const gap = 22;
      const shift = reduceMotion ? 0 : (sim.t * 0.015) % gap;
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(190, 170, 255, " + (0.055 + sim.pulse * 0.05) + ")";
      for (let y = top - rx; y < bot + rx; y += gap) {
        ctx.beginPath();
        ctx.moveTo(cx - rx, y + shift);
        ctx.lineTo(cx + rx, y + shift + rx * 0.65);
        ctx.moveTo(cx + rx, y + shift);
        ctx.lineTo(cx - rx, y + shift + rx * 0.65);
        ctx.stroke();
      }

      function ribbon(dir, turns, phase, radius, color, width) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        const steps = 96;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const y = top + ry + t * (bot - top - ry * 2);
          const ang = dir * (t * Math.PI * 2 * turns + phase);
          const x = cx + Math.cos(ang) * rx * radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ribbon(1, 3, spin + 0.12, 0.76, "rgba(255, 70, 130, 0.35)", 1.2);
      ribbon(1, 3, spin, 0.72, "rgba(126, 231, 255, 0.18)", 7);
      ribbon(1, 3, spin - 0.06, 0.7, "rgba(170, 236, 255, 0.95)", 1.7);
      ribbon(-1, 3, spin + 0.48, 0.54, "rgba(80, 210, 255, 0.32)", 1.2);
      ribbon(-1, 3, spin + 0.6, 0.5, "rgba(210, 170, 255, 0.16)", 7);
      ribbon(-1, 3, spin + 0.7, 0.48, "rgba(236, 206, 255, 0.92)", 1.7);
      ribbon(1, 5, -spin * 1.4, 0.28, "rgba(240, 206, 120, 0.55)", 1.15);

      ctx.lineCap = "butt";
      ctx.setLineDash([2, 5]);
      ctx.lineDashOffset = reduceMotion ? 0 : -sim.t * 0.04;
      ctx.strokeStyle = "rgba(255, 236, 200, 0.45)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, top + ry);
      ctx.lineTo(cx, bot - ry);
      ctx.stroke();
      ctx.setLineDash([]);

      if (sim.pulse > 0.06) {
        ctx.save();
        ctx.globalAlpha = Math.min(0.85, sim.pulse);
        for (let i = -4; i <= 4; i++) {
          ctx.strokeStyle = i === 0 ? "#ffd7a4" : "rgba(255, 190, 120, 0.55)";
          ctx.lineWidth = i === 0 ? 1.6 : 1;
          ctx.beginPath();
          const y = mid + i * Math.max(3, ry * 0.85);
          const reach = rx * (0.9 - Math.abs(i) * 0.08);
          ctx.moveTo(cx - reach, y);
          ctx.lineTo(cx + reach, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        if (p.kind !== "m" && p.kind !== "a") continue;
        const dir = p.kind === "m" ? 1 : -1;
        const along = p.p;
        const y = p.kind === "m"
          ? (top + ry) + along * (mid - top - ry)
          : (bot - ry) - along * (bot - ry - mid);
        const yn = (y - top) / Math.max(1, bot - top);
        const ang = dir * (yn * Math.PI * 6 + spin) + p.lane * 4.2;
        const rad = rx * (p.kind === "m" ? 0.62 : 0.42) * (0.75 + 0.25 * p.lane);
        const x = cx + Math.cos(ang) * rad;
        const back = (along - 0.04 + 1) % 1;
        const y2 = p.kind === "m"
          ? (top + ry) + back * (mid - top - ry)
          : (bot - ry) - back * (bot - ry - mid);
        const yn2 = (y2 - top) / Math.max(1, bot - top);
        const ang2 = dir * (yn2 * Math.PI * 6 + spin) + p.lane * 4.2;
        const x2 = cx + Math.cos(ang2) * rad;
        const bright = 0.35 + Math.sin(along * Math.PI) * 0.65;
        ctx.strokeStyle = p.kind === "m"
          ? "rgba(126, 231, 255, " + bright + ")"
          : "rgba(214, 176, 255, " + bright + ")";
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.fillStyle = ctx.strokeStyle;
        ctx.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
      }
      ctx.restore();

      const busX = cx + rx + 14;
      const busLimit = rightCol ? inner.x + inner.w - rightCol - 8 : inner.x + inner.w - 8;
      const drawBusRail = busX + 18 < busLimit;
      if (drawBusRail) {
        ctx.strokeStyle = "rgba(186, 208, 222, 0.55)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(busX, top + 4);
        ctx.lineTo(busX, bot - 4);
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      for (let i = 0; i < COILS; i++) {
        const y = top + span * ((i + 0.5) / COILS);
        const amp = clamp01((coilI[i] - 12) / 16);
        const hot = sim.pulse > 0.15 && i === sim.hot;
        ctx.strokeStyle = hot ? "#ffb15a" : "rgba(230, 214, 255, 0.95)";
        ctx.lineWidth = 2.2 + amp * 2.4;
        ctx.beginPath();
        ctx.ellipse(cx, y, rx + 7, ry * 1.15, 0, 0.12 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,0.75)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(cx, y, rx + 7, ry * 1.15, 0, 0.42 * Math.PI, 0.58 * Math.PI);
        ctx.stroke();
        if (drawBusRail) {
          ctx.strokeStyle = hot ? "#ffb15a" : "rgba(186, 206, 222, 0.7)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx + rx + 6, y);
          ctx.lineTo(busX, y);
          ctx.stroke();
          ctx.fillStyle = hot ? "#ffb15a" : "#d5e4ee";
          ctx.fillRect(busX - 2, y - 2, 4, 4);
          if (Math.abs(y - mid) > 18 && busX + 16 < busLimit) {
            ctx.font = font(8, 700);
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillStyle = hot ? "#ffb15a" : "rgba(214, 206, 236, 0.88)";
            ctx.fillText("C" + (i + 1), busX + 6, y);
          }
        }
      }

      ctx.save();
      ctx.translate(cx, mid);
      ctx.scale(1, Math.max(0.22, (ry * 1.35) / rx));
      for (let i = 0; i < shocks.length; i++) {
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255, 226, 170, " + shocks[i].a * 0.75 + ")";
        ctx.lineWidth = 1.5;
        ctx.arc(0, 0, rx * shocks[i].r * 1.8, 0, Math.PI * 2);
        ctx.stroke();
      }
      const discR = rx * (0.62 + sim.pulse * 0.34);
      for (let i = 0; i < 18; i++) {
        const a = spin * 2.2 + i * (Math.PI * 2 / 18);
        ctx.beginPath();
        ctx.strokeStyle = i % 2 ? "rgba(126, 231, 255, 0.75)" : "rgba(230, 200, 255, 0.7)";
        ctx.lineWidth = 1.4;
        ctx.arc(0, 0, discR * 0.78, a, a + 0.42);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 236, 190, 0.8)";
      ctx.lineWidth = 1.2;
      ctx.arc(0, 0, discR * 0.46, spin * -1.4, spin * -1.4 + Math.PI * 1.4);
      ctx.stroke();
      const rg = ctx.createRadialGradient(0, 0, 1, 0, 0, discR);
      rg.addColorStop(0, "rgba(255, 252, 244, 1)");
      rg.addColorStop(0.18, "rgba(255, 220, 140, 0.95)");
      rg.addColorStop(0.45, "rgba(210, 160, 255, 0.45)");
      rg.addColorStop(1, "rgba(210, 160, 255, 0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(0, 0, discR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      function gyro(tilt, rad, rot, color, width) {
        ctx.save();
        ctx.translate(cx, mid);
        ctx.rotate(rot);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        const flat = Math.max(0.08, Math.cos(tilt));
        ctx.beginPath();
        ctx.ellipse(0, 0, rad, rad * flat, 0, 0, Math.PI * 2);
        ctx.stroke();
        const a = spin * 4 + rot;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad * flat, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      gyro(1.15, rx * 1.02, spin * 0.35, "rgba(126, 231, 255, 0.72)", 1.35);
      gyro(0.72, rx * 0.82, -spin * 0.55, "rgba(214, 176, 255, 0.7)", 1.25);
      gyro(0.28, rx * 0.58, spin, "rgba(255, 214, 140, 0.88)", 1.45);

      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        if (p.kind !== "s") continue;
        const x = cx + p.side * p.p * rx * 1.15;
        const y = mid + (p.lane - 0.5) * ry * 2.2;
        ctx.fillStyle = "rgba(255, 236, 190, " + (1 - p.p) * 0.9 + ")";
        ctx.fillRect(x, y, 2.2, 1.3);
      }

      ctx.strokeStyle = "rgba(236, 246, 255, 0.95)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(cx, top + ry, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx, bot - ry, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(186, 214, 230, 0.4)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, top + ry, rx * 0.55, ry * 0.55, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx, bot - ry, rx * 0.55, ry * 0.55, 0, 0, Math.PI * 2);
      ctx.stroke();
      const sweep = reduceMotion ? 0.42 : (sim.t * 0.00022) % 1;
      const sy = top + ry + sweep * (bot - top - ry * 2);
      ctx.strokeStyle = "rgba(236, 248, 255, 0.7)";
      ctx.lineWidth = 1.15;
      ctx.beginPath();
      ctx.ellipse(cx, sy, rx * 0.9, ry * 0.8, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(126, 231, 255, 0.25)";
      ctx.beginPath();
      ctx.ellipse(cx, sy, rx * 0.72, ry * 0.55, 0, 0, Math.PI * 2);
      ctx.stroke();

      function nozzle(y, dir, hue) {
        const o = dir < 0 ? -1 : 1;
        ctx.save();
        ctx.translate(cx, y);
        ctx.fillStyle = "rgba(10, 16, 26, 0.92)";
        ctx.strokeStyle = hue;
        ctx.lineWidth = 1.25;
        const collar = o < 0 ? -20 : 4;
        ctx.fillRect(-rx * 0.46, collar, rx * 0.92, 14);
        ctx.strokeRect(-rx * 0.46, collar, rx * 0.92, 14);
        ctx.beginPath();
        for (let i = -2; i <= 2; i++) {
          const vx = i * rx * 0.14;
          ctx.moveTo(vx, collar + 2);
          ctx.lineTo(vx, collar + 12);
        }
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-12, 0);
        ctx.lineTo(-5, -o * 10);
        ctx.lineTo(5, -o * 10);
        ctx.lineTo(12, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      const nyTop = top + ry * 0.2;
      const nyBot = bot - ry * 0.2;
      nozzle(nyTop, -1, "rgba(126, 231, 255, 0.9)");
      nozzle(nyBot, 1, "rgba(214, 180, 255, 0.9)");
      ctx.font = font(8, 700);
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillStyle = "rgba(176, 228, 246, 0.92)";
      ctx.fillText("A  MATTER", cx, nyTop - 26);
      ctx.textBaseline = "top";
      ctx.fillStyle = "rgba(220, 196, 250, 0.92)";
      ctx.fillText("B  ANTIMATTER", cx, nyBot + 26);

      const scan = (sim.t * 0.00012) % 2;
      const zProbe = scan < 1 ? scan * 2 - 1 : 1 - (scan - 1) * 2;
      const py = mid - zProbe * (half - ry * 2);
      ctx.strokeStyle = "#f0c86a";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(cx - rx + 2, py);
      ctx.lineTo(cx - jacket + 4, py);
      ctx.moveTo(cx - jacket + 4, py - 5);
      ctx.lineTo(cx - jacket + 4, py + 5);
      ctx.stroke();

      if (leftCol >= 108) {
        const plot = { x: inner.x, y: top - 4, w: leftCol - 12, h: Math.max(80, bot - top) };
        ctx.strokeStyle = "rgba(160, 190, 220, 0.34)";
        ctx.strokeRect(plot.x + 0.5, plot.y + 0.5, plot.w, plot.h);
        ctx.font = font(8, 700);
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "rgba(186, 214, 230, 0.84)";
        ctx.fillText("PROFILE  Z", plot.x + 6, plot.y + 4);
        ctx.textAlign = "right";
        ctx.fillStyle = "#f0c86a";
        ctx.fillText(signed(zProbe, 2), plot.x + plot.w - 6, plot.y + 4);
        const field = { x: plot.x + 16, y: plot.y + 18, w: Math.max(10, plot.w - 24), h: Math.max(20, plot.h - 78) };
        ctx.strokeStyle = "rgba(160, 190, 220, 0.24)";
        ctx.strokeRect(field.x + 0.5, field.y + 0.5, field.w, field.h);
        ctx.beginPath();
        ctx.strokeStyle = "rgba(160, 190, 220, 0.12)";
        for (let g = 1; g <= 3; g++) {
          const yy = field.y + field.h * (g / 4);
          ctx.moveTo(field.x, yy);
          ctx.lineTo(field.x + field.w, yy);
        }
        ctx.stroke();
        function profile(color, width, dash, fn) {
          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.setLineDash(dash);
          for (let i = 0; i <= 56; i++) {
            const z = 1 - 2 * (i / 56);
            const px = field.x + clamp01(fn(z)) * field.w;
            const yy = field.y + (i / 56) * field.h;
            if (i === 0) ctx.moveTo(px, yy);
            else ctx.lineTo(px, yy);
          }
          ctx.stroke();
          ctx.setLineDash([]);
        }
        const blo = show.bt * 0.58;
        const bhi = show.bt * 1.1;
        profile("rgba(126, 231, 255, 0.95)", 1.5, [], (z) => {
          const bt = show.bt * (1 - 0.28 * z * z) * (1 + sim.pulse * 0.08);
          return (bt - blo) / (bhi - blo);
        });
        profile("rgba(201, 166, 255, 0.8)", 1.15, [], (z) => {
          const ne = show.ne * (0.7 + 0.3 * (1 - z * z));
          return (ne - show.ne * 0.62) / (show.ne * 0.5);
        });
        profile("rgba(240, 200, 106, 0.9)", 1.15, [3, 3], (z) => {
          const q = show.q * (1 + 0.42 * z * z) * (1 + sim.pulse * 0.12);
          return (q - 1.2) / 1.8;
        });
        const probeBt = show.bt * (1 - 0.28 * zProbe * zProbe) * (1 + sim.pulse * 0.08);
        const probeX = field.x + clamp01((probeBt - blo) / (bhi - blo)) * field.w;
        const probeY = field.y + ((1 - zProbe) / 2) * field.h;
        ctx.fillStyle = "#f0c86a";
        ctx.beginPath();
        ctx.arc(probeX, probeY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(240, 200, 106, 0.45)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(field.x, probeY);
        ctx.lineTo(field.x + field.w, probeY);
        ctx.stroke();
        ctx.font = font(7, 600);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(180, 210, 230, 0.6)";
        for (let z = 1; z >= -1; z -= 1) {
          ctx.fillText(String(z), field.x - 3, field.y + ((1 - z) / 2) * field.h);
        }
        const probeNe = show.ne * (0.7 + 0.3 * (1 - zProbe * zProbe));
        const probeTi = show.ti * (0.82 + 0.18 * (1 - Math.abs(zProbe)));
        const lines = [
          ["Bt", fmt(probeBt, 2) + " T", "#9edfff"],
          ["ne", fmt(probeNe, 2), "#c9a6ff"],
          ["q", fmt(show.q * (1 + 0.42 * zProbe * zProbe), 2), "#f0c86a"],
          ["Ti", fmt(probeTi, 1) + " keV", "#e7f3ff"],
        ];
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = font(8, 650);
        for (let i = 0; i < lines.length; i++) {
          ctx.fillStyle = lines[i][2];
          ctx.fillText(lines[i][0] + "  " + lines[i][1], plot.x + 6, field.y + field.h + 6 + i * 12);
        }
      } else {
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.font = font(8, 600);
        for (let i = 0; i <= 8; i++) {
          const z = 1 - i / 4;
          if (z < -1) break;
          const y = mid - z * (half - ry);
          if (y < top + 8 || y > bot - 8) continue;
          ctx.strokeStyle = "rgba(180, 210, 230, 0.4)";
          ctx.beginPath();
          ctx.moveTo(cx - jacket - 8, y);
          ctx.lineTo(cx - jacket - 2, y);
          ctx.stroke();
          if (i % 2 === 0) {
            ctx.fillStyle = "rgba(180, 210, 230, 0.72)";
            ctx.fillText(z.toFixed(1), cx - jacket - 10, y);
          }
        }
      }

      if (rightCol >= 100) {
        const box = { x: inner.x + inner.w - rightCol + 4, y: top - 4, w: rightCol - 8 };
        const boreH = Math.min(box.w + 8, (bot - top) * 0.48);
        ctx.strokeStyle = "rgba(160, 190, 220, 0.34)";
        ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.w, boreH);
        ctx.font = font(8, 700);
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "rgba(186, 214, 230, 0.86)";
        ctx.fillText("LENS", box.x + 6, box.y + 4);
        ctx.textAlign = "right";
        ctx.fillStyle = sim.pulse > 0.4 ? "#ffb15a" : "rgba(201, 166, 255, 0.9)";
        ctx.fillText("m/n " + modeMN, box.x + box.w - 6, box.y + 4);
        const ox = box.x + box.w / 2;
        const oy = box.y + 16 + (boreH - 22) / 2;
        const R = Math.min(box.w, boreH - 24) * 0.36;
        ctx.strokeStyle = "rgba(186, 210, 226, 0.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ox, oy, R * 1.18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = "rgba(226, 240, 250, 0.7)";
        ctx.beginPath();
        ctx.arc(ox, oy, R, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = "rgba(201, 166, 255, 0.35)";
        ctx.beginPath();
        ctx.arc(ox, oy, R * 0.62, 0, Math.PI * 2);
        ctx.stroke();
        for (let i = 0; i < COILS; i++) {
          const ang = -Math.PI / 2 + i * (Math.PI * 2 / COILS);
          const amp = clamp01((coilI[i] - 12) / 16);
          const hot = sim.pulse > 0.15 && i === sim.hot;
          const px = ox + Math.cos(ang) * R * 1.18;
          const pyb = oy + Math.sin(ang) * R * 1.18;
          ctx.fillStyle = hot ? "#ffb15a" : "rgba(201, 166, 255, " + (0.45 + amp * 0.5) + ")";
          ctx.beginPath();
          ctx.arc(px, pyb, 2.2 + amp * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        function arm(dir, color) {
          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.6;
          const steps = 42;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const ang = dir * (spin * 2.4 + t * Math.PI * 2.2);
            const rad = R * (0.08 + t * 0.78);
            const x = ox + Math.cos(ang) * rad;
            const y = oy + Math.sin(ang) * rad;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        arm(1, "rgba(126, 231, 255, 0.9)");
        arm(-1, "rgba(214, 176, 255, 0.9)");
        ctx.strokeStyle = "rgba(255, 226, 180, 0.6)";
        ctx.lineWidth = 1.15;
        ctx.beginPath();
        ctx.arc(ox - R * 0.12, oy, R * 0.7, 0.35, 2.15);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ox + R * 0.16, oy, R * 0.48, Math.PI + 0.2, Math.PI + 2.3);
        ctx.stroke();
        ctx.save();
        ctx.translate(ox, oy);
        ctx.rotate(reduceMotion ? 0.4 : spin);
        ctx.strokeStyle = "rgba(186, 214, 230, 0.45)";
        ctx.beginPath();
        for (let i = 0; i < 28; i++) {
          const a = (i / 28) * Math.PI * 2;
          const innerR = R * (i % 7 === 0 ? 0.84 : 0.93);
          ctx.moveTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
          ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
        }
        ctx.stroke();
        ctx.restore();
        const coreR = R * (0.16 + sim.pulse * 0.12);
        const cg = ctx.createRadialGradient(ox, oy, 1, ox, oy, coreR * 3);
        cg.addColorStop(0, "rgba(255, 250, 236, 0.95)");
        cg.addColorStop(0.4, "rgba(255, 200, 110, 0.55)");
        cg.addColorStop(1, "rgba(255, 200, 110, 0)");
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(ox, oy, coreR * 3, 0, Math.PI * 2);
        ctx.fill();

        let yy = box.y + boreH + 6;
        const roseH = Math.min(box.w * 0.78, bot - yy - 54);
        if (roseH > 70) {
          ctx.strokeStyle = "rgba(160, 190, 220, 0.34)";
          ctx.lineWidth = 1;
          ctx.strokeRect(box.x + 0.5, yy + 0.5, box.w, roseH);
          ctx.font = font(8, 700);
          ctx.textAlign = "left";
          ctx.textBaseline = "top";
          ctx.fillStyle = "rgba(186, 214, 230, 0.84)";
          ctx.fillText("PHASOR", box.x + 6, yy + 4);
          const mx = box.x + box.w / 2;
          const my = yy + 14 + (roseH - 18) / 2;
          const rr = Math.min(box.w * 0.34, (roseH - 22) * 0.38);
          ctx.strokeStyle = "rgba(160, 190, 220, 0.32)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(mx, my, rr, 0, Math.PI * 2);
          ctx.moveTo(mx - rr, my);
          ctx.lineTo(mx + rr, my);
          ctx.moveTo(mx, my - rr);
          ctx.lineTo(mx, my + rr);
          ctx.stroke();
          ctx.beginPath();
          ctx.strokeStyle = "rgba(201, 166, 255, 0.85)";
          ctx.lineWidth = 1.2;
          for (let i = 0; i < COILS; i++) {
            const phase = reduceMotion ? i * 45 : (sim.t * 0.045 + i * 45) % 360;
            const ang = (phase - 90) * Math.PI / 180;
            const mag = rr * (0.28 + clamp01((coilI[i] - 14) / 14) * 0.7);
            const x = mx + Math.cos(ang) * mag;
            const y = my + Math.sin(ang) * mag;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.stroke();
          for (let i = 0; i < COILS; i++) {
            const phase = reduceMotion ? i * 45 : (sim.t * 0.045 + i * 45) % 360;
            const ang = (phase - 90) * Math.PI / 180;
            const mag = rr * (0.28 + clamp01((coilI[i] - 14) / 14) * 0.7);
            const hot = sim.pulse > 0.15 && i === sim.hot;
            ctx.fillStyle = hot ? "#ffb15a" : (i % 2 ? "#9edfff" : "#d2b0ff");
            ctx.beginPath();
            ctx.arc(mx + Math.cos(ang) * mag, my + Math.sin(ang) * mag, hot ? 3.2 : 2.2, 0, Math.PI * 2);
            ctx.fill();
          }
          yy += roseH + 6;
        }
        if (bot - yy > 48) {
          const waist = [
            ["ΔMIX", signed((show.ratio - 1) * 100, 2) + "%", Math.abs(show.ratio - 1) > 0.012],
            ["SHEAR", fmt(show.shear, 3), show.shear > 0.04],
            ["BRAID", fmt(show.braid, 1) + " MW", sim.pulse > 0.35],
            ["m/n", modeMN, sim.pulse > 0.4],
          ];
          ctx.font = font(8, 650);
          ctx.textBaseline = "top";
          for (let i = 0; i < waist.length; i++) {
            const wy = yy + i * 13;
            ctx.textAlign = "left";
            ctx.fillStyle = "rgba(168, 198, 216, 0.66)";
            ctx.fillText(waist[i][0], box.x + 2, wy);
            ctx.textAlign = "right";
            ctx.fillStyle = waist[i][2] ? "#ffb15a" : "#f4fbff";
            ctx.fillText(waist[i][1], box.x + box.w - 2, wy);
          }
        }
      }

      ctx.textBaseline = "bottom";
      ctx.font = font(8, 700);
      ctx.fillStyle = "rgba(186, 214, 230, 0.8)";
      ctx.textAlign = "left";
      ctx.fillText("PORT", pipeL, mid - 14);
      ctx.textAlign = "right";
      ctx.fillText("STBD", pipeR, mid - 14);
      ctx.textAlign = "center";
      ctx.fillStyle = sim.pulse > 0.35 ? "#ffb15a" : "rgba(214, 230, 242, 0.84)";
      const plane = sim.pulse > 0.35 ? "SHEAR" : "HORIZON";
      const ductW = cx - jacket - pipeL;
      if (ductW > ctx.measureText(plane).width + 56) ctx.fillText(plane, pipeL + ductW / 2, mid - 14);

      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.font = font(8, 650);
      ctx.fillStyle = "rgba(186, 214, 230, 0.62)";
      const plate = "PITCH 3   LATT " + fmt(show.lattice, 1) + "%";
      if (!rightCol && wingR > ctx.measureText(plate).width + 12) {
        ctx.fillText(plate, cx + jacket + 8, bot - ry);
      }
    });
  }

  function drawTrace(b, data, color) {
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const idx = (scopeHead + i) % data.length;
      const x = b.x + (i / (data.length - 1)) * b.w;
      const y = b.y + b.h - 3 - clamp01(data[idx]) * (b.h - 8);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.lineTo(b.x + b.w, b.y + b.h - 1);
    ctx.lineTo(b.x, b.y + b.h - 1);
    ctx.closePath();
    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function drawScopes(b) {
    if (b.h < 24 || b.w < 40) return;
    clipped(b, () => {
      const inner = panel(b, "FIELD RECORD");
      if (inner.w < 40 || inner.h < 20) return;
      const names = [
        ["SLIP", scopes.slip, "#9edfff", fmt(show.slip, 3), 0.42],
        ["SHEAR", scopes.shear, "#c9a6ff", fmt(show.shear, 3), 0.22],
        ["ΔMIX", scopes.mix, "#f0c86a", signed((show.ratio - 1) * 100, 2) + "%", 0.5],
        ["C" + (sim.hot + 1) + " kA", scopes.coil, "#8ef0c8", fmt(coilI[sim.hot], 1), 0.28],
      ];
      const gap = 8;
      const colW = (inner.w - gap * (names.length - 1)) / names.length;
      for (let i = 0; i < names.length; i++) {
        const x = inner.x + i * (colW + gap);
        ctx.font = font(8, 700);
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "rgba(186, 210, 226, 0.78)";
        ctx.fillText(names[i][0], x, inner.y);
        ctx.textAlign = "right";
        ctx.fillStyle = names[i][2];
        ctx.fillText(names[i][3], x + colW - 2, inner.y);
        const plot = { x: x, y: inner.y + 12, w: colW, h: inner.h - 14 };
        ctx.strokeStyle = "rgba(160, 190, 220, 0.25)";
        ctx.strokeRect(plot.x + 0.5, plot.y + 0.5, plot.w - 1, plot.h - 1);
        ctx.beginPath();
        ctx.strokeStyle = "rgba(160, 190, 220, 0.14)";
        for (let g = 1; g <= 3; g++) {
          const y = plot.y + plot.h * (g / 4);
          ctx.moveTo(plot.x, y);
          ctx.lineTo(plot.x + plot.w, y);
        }
        ctx.stroke();
        const nomY = plot.y + plot.h - 3 - names[i][4] * (plot.h - 8);
        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = "rgba(200, 220, 235, 0.28)";
        ctx.moveTo(plot.x, nomY);
        ctx.lineTo(plot.x + plot.w, nomY);
        ctx.stroke();
        ctx.setLineDash([]);
        drawTrace(plot, names[i][1], names[i][2]);
      }
    });
  }

  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function requestWake() {
    if (!wantWake || document.hidden) return;
    if (!("wakeLock" in navigator) || wakeBusy || wakeLock) return;
    wakeBusy = true;
    navigator.wakeLock.request("screen").then((lock) => {
      wakeDenied = false;
      wakeLock = lock;
      lock.addEventListener("release", () => {
        wakeLock = null;
        if (wantWake && !document.hidden) setTimeout(requestWake, 400);
        announce();
      });
      announce();
    }).catch(() => {
      wakeLock = null;
      wakeDenied = true;
      announce();
    }).finally(() => {
      wakeBusy = false;
    });
  }

  function releaseWake() {
    const lock = wakeLock;
    wakeLock = null;
    if (!lock) return;
    lock.release().catch(() => {});
  }

  function announce() {
    let text;
    if (!wantWake) text = "Windowed. Click to fill the screen and keep the machine awake.";
    else if (isFs() && wakeLock) text = "Fullscreen. The machine stays awake. Click to release.";
    else if (isFs()) text = "Fullscreen. Click to release.";
    else text = "Holding the machine awake. Click to release.";
    if (live.textContent !== text) live.textContent = text;
  }

  function engage() {
    wantWake = true;
    fsFailed = false;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) fsFailed = true;
    else req.call(el).catch(() => { fsFailed = true; });
    requestWake();
    announce();
  }

  function releaseAll() {
    wantWake = false;
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (isFs() && exit) exit.call(document).catch(() => {});
    releaseWake();
    announce();
  }

  let lastToggle = 0;
  function toggleFromUser() {
    const now = performance.now();
    if (now - lastToggle < 400) return;
    lastToggle = now;
    if (wantWake || isFs()) releaseAll();
    else engage();
  }

  function drawFooter(b) {
    const items = [
      ["MIX", Math.abs(show.ratio - 1) < 0.012, "#8ef0c8"],
      ["FIELD", sim.pulse < 0.25, sim.pulse < 0.25 ? "#8ef0c8" : "#ffb15a"],
      ["LATTICE", show.lattice > 97.4, show.lattice > 97.4 ? "#8ef0c8" : "#ffb15a"],
      ["Q", show.q > 1.62, show.q > 1.62 ? "#8ef0c8" : "#ffb15a"],
      ["COILS", sim.pulse < 0.45, "#9edfff"],
      ["HOLD", wantWake || isFs(), "#f0c86a"],
      ["WAKE", !!wakeLock, wakeDenied ? "#ffb15a" : "#8ef0c8"],
    ];
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = font(Math.max(8, 9 * U), 650);
    let phrase = wantWake || isFs() ? "CLICK RELEASE" : "CLICK ENGAGE";
    if (fsFailed && wantWake && !isFs()) phrase = "FS N/A";
    else if (wantWake && wakeDenied && !wakeLock) phrase = "WAKE N/A";
    const y = b.y + b.h / 2;
    const latest = logs.length ? logs[logs.length - 1] : null;
    let x = b.x;
    if (latest && b.w > 980) {
      ctx.fillStyle = latest.warn ? "#ffb15a" : "rgba(190, 210, 224, 0.72)";
      const note = latest.stamp + "  " + latest.text;
      ctx.fillText(note, x, y);
      x += Math.min(ctx.measureText(note).width + 18, b.w * 0.42);
    }
    const phraseW = ctx.measureText(phrase).width;
    const labelW = items.map((item) => ctx.measureText(item[0]).width);
    const fixed = items.length * 14 + labelW.reduce((sum, w) => sum + w, 0);
    const room = b.x + b.w - phraseW - 8 - x - fixed;
    const gap = Math.max(5, Math.min(14, room / items.length));
    for (let i = 0; i < items.length; i++) {
      if (x > b.x + b.w - phraseW - 20) break;
      ctx.beginPath();
      ctx.fillStyle = items[i][1] ? items[i][2] : "rgba(150, 170, 185, 0.28)";
      ctx.arc(x + 4, y, 3.1, 0, Math.PI * 2);
      ctx.fill();
      x += 11;
      ctx.fillStyle = "rgba(220, 232, 242, 0.84)";
      ctx.fillText(items[i][0], x, y);
      x += labelW[i] + gap;
    }
    ctx.textAlign = "right";
    ctx.fillStyle = wantWake ? "#f0c86a" : "rgba(220, 232, 242, 0.9)";
    ctx.fillText(phrase, b.x + b.w, y);
  }

  function drawFrame(w, h) {
    if (!(wantWake || isFs())) return;
    ctx.strokeStyle = "rgba(201, 166, 255, 0.78)";
    ctx.lineWidth = 2;
    ctx.strokeRect(1.5, 1.5, w - 3, h - 3);
  }

  function resize() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w < 2 || h < 2) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const bw = Math.round(w * dpr);
    const bh = Math.round(h * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    viewW = w;
    viewH = h;
    U = Math.max(0.86, Math.min(1.15, Math.min(w, h) / 900));
  }

  function draw() {
    const w = viewW;
    const h = viewH;
    if (w < 2 || h < 2) return;
    drawBackground(w, h);
    const boxes = layout(w, h);
    drawHeader(boxes.header);
    drawLeft(boxes.left);
    drawChamber(boxes.chamber);
    drawRight(boxes.right);
    drawScopes(boxes.scope);
    drawFooter(boxes.footer);
    drawFrame(w, h);
  }

  pushLog("CHAMBER ONLINE", false);
  pushLog("COIL BANK ARMED", false);
  pushLog("MIX LAW CLOSED", false);
  for (let i = 0; i < SCOPE_N; i++) step(34);

  document.addEventListener("fullscreenchange", () => {
    if (!isFs()) {
      wantWake = false;
      releaseWake();
    }
    announce();
  });
  document.addEventListener("webkitfullscreenchange", () => {
    if (!isFs()) {
      wantWake = false;
      releaseWake();
    }
    announce();
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && wantWake) requestWake();
  });

  let suppressClick = false;
  document.addEventListener("pointerup", (e) => {
    if (e.pointerType === "mouse") return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 700);
    toggleFromUser();
  });
  document.addEventListener("click", () => {
    if (suppressClick) return;
    toggleFromUser();
  });
  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.key === "f" || e.key === "F" || e.key === " ") {
      e.preventDefault();
      toggleFromUser();
    }
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  resize();
  draw();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(48, now - last || 16);
    last = now;
    if (!document.hidden) {
      step(reduceMotion ? Math.min(dt, 32) : dt);
      if (canvas.clientWidth !== viewW || canvas.clientHeight !== viewH) resize();
      draw();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
