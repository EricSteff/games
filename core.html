<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="theme-color" content="#05070c" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Slip Core — a live containment bay. Tap to fill the screen and keep it awake." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Slip Core" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Slip Core</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root {
      color-scheme: dark;
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      margin: 0;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070c;
      color: #d7e8f2;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #safe {
      position: fixed;
      left: var(--safe-l);
      top: var(--safe-t);
      right: var(--safe-r);
      bottom: var(--safe-b);
      pointer-events: none;
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="safe" aria-hidden="true"></div>
  <canvas id="view" aria-hidden="true"></canvas>
  <p class="sr" id="live">Slip Core is running. Tap to fill the screen and keep it awake. Tap again to release.</p>
  <script>
(() => {
  "use strict";

  const MONO = 'ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace';
  const BINS = 96;
  const WROWS = 72;
  const Rmaj = 1;
  const rTube = 0.34;

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d", { alpha: false });
  const safeEl = document.getElementById("safe");
  const live = document.getElementById("live");

  const reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  let reduceMotion = reduceQuery.matches;
  reduceQuery.addEventListener("change", () => {
    reduceMotion = reduceQuery.matches;
  });

  const wf = document.createElement("canvas");
  wf.width = BINS;
  wf.height = WROWS;
  const wfx = wf.getContext("2d", { alpha: false });

  const ramp = [];
  for (let i = 0; i < 64; i++) {
    const v = i / 63;
    let r;
    let g;
    let b;
    if (v < 0.18) {
      const k = v / 0.18;
      r = 3 + 6 * k;
      g = 8 + 28 * k;
      b = 14 + 36 * k;
    } else if (v < 0.5) {
      const k = (v - 0.18) / 0.32;
      r = 9 + 30 * k;
      g = 36 + 150 * k;
      b = 50 + 170 * k;
    } else if (v < 0.78) {
      const k = (v - 0.5) / 0.28;
      r = 39 + 190 * k;
      g = 186 + 36 * k;
      b = 220 - 130 * k;
    } else {
      const k = (v - 0.78) / 0.22;
      r = 229 + 26 * k;
      g = 222 + 28 * k;
      b = 90 + 150 * k;
    }
    ramp.push([r | 0, g | 0, b | 0]);
  }

  const peaks = [
    { c: 14, w: 1.6, f: 0.00009, a: 0.72 },
    { c: 27, w: 2.4, f: 0.00013, a: 0.95 },
    { c: 41, w: 1.3, f: 0.00019, a: 0.66 },
    { c: 58, w: 3.4, f: 0.00007, a: 0.5 },
    { c: 73, w: 1.15, f: 0.00016, a: 0.88 },
    { c: 86, w: 2.1, f: 0.00011, a: 0.42 },
  ];

  const sim = {
    t: 0,
    run: 0,
    cycle: 184420,
    beta: 1.037,
    b0: 5.412,
    ip: 1.86,
    ne: 8.42,
    ti: 14.6,
    te: 12.2,
    tau: 1.92,
    paux: 18.4,
    q: 1.08,
    vac: 4.2,
    lattice: 0.984,
    shear: 0.012,
    phase: 0.4,
    kappa: 28.4,
    inject: 4,
    nextShear: 14000,
    shearEnv: 0,
    pulse: 0,
    peakBin: 27,
  };

  const show = {};
  let nextShow = 0;
  let hexAcc = 0;
  let scopeAcc = 0;
  const hexLines = [];

  const SCOPE_N = 160;
  const scopes = [
    { name: "Bφ", color: "#9eebff", data: new Float32Array(SCOPE_N) },
    { name: "ne", color: "#f0c86a", data: new Float32Array(SCOPE_N) },
    { name: "Ψ", color: "#d7c6ff", data: new Float32Array(SCOPE_N) },
  ];
  let scopeHead = 0;

  let calCols = 14;
  let calRows = 8;
  let cells = new Float32Array(calCols * calRows);

  const parts = [];
  for (let i = 0; i < 170; i++) {
    const core = i < 56;
    parts.push({
      u: Math.random() * Math.PI * 2,
      v: Math.random() * Math.PI * 2,
      r: core ? Math.random() * 0.07 : 0.09 + Math.random() * 0.22,
      su: core ? 1.15 : 0.42 + Math.random() * 0.55,
      sv: core ? 0.35 : 1.5 + Math.random() * 2.3,
      core,
      color: core
        ? "rgba(255, 214, 150, 0.95)"
        : (i % 6 === 0 ? "rgba(214, 196, 255, 0.92)" : "rgba(168, 236, 255, 0.92)"),
      x: 0,
      y: 0,
      z: 0,
    });
  }

  function makeRing(mode, a, n) {
    return { mode, a, n, pts: new Float32Array(n * 3), mz: 0 };
  }

  const rings = [];
  for (let i = 0; i < 8; i++) rings.push(makeRing("pol", (i / 8) * Math.PI * 2, 42));
  for (let i = 0; i < 6; i++) rings.push(makeRing("tor", (i / 6) * Math.PI * 2, 64));
  for (let i = 0; i < 3; i++) rings.push(makeRing("hel", i / 3, 96));
  for (let i = 0; i < 4; i++) rings.push(makeRing("shell", (i / 4) * Math.PI * 2 + 0.2, 36));
  rings.push(makeRing("axis", 0, 72));

  const P = { x: 0, y: 0, z: 0 };
  const tilt = 0.78;

  function place(u, v, r) {
    const cr = Rmaj + r * Math.cos(v);
    const x = cr * Math.cos(u);
    const y = r * Math.sin(v);
    const z = cr * Math.sin(u);
    const c = Math.cos(tilt);
    const s = Math.sin(tilt);
    P.x = x;
    P.y = y * c - z * s;
    P.z = y * s + z * c;
  }

  let U = 1;
  function font(px, weight) {
    const s = Math.max(9, Math.round(px * U));
    return (weight || 560) + " " + s + "px " + MONO;
  }

  function pulseNow() {
    if (sim.shearEnv <= 0) return 0;
    return Math.sin((1 - sim.shearEnv) * Math.PI);
  }

  function stepSim(dt) {
    sim.t += dt;
    sim.run += dt;
    sim.cycle += dt * 0.041;
    const t = sim.t * 0.001;
    const pulse = pulseNow();
    sim.pulse = pulse;
    sim.beta = 1.034 + Math.sin(t * 0.37) * 0.012 + Math.sin(t * 1.7) * 0.004 - pulse * 0.045;
    sim.b0 = 5.408 + Math.sin(t * 0.23) * 0.016 - pulse * 0.08;
    sim.ip = 1.84 + Math.sin(t * 0.19) * 0.03 + pulse * 0.06;
    sim.ne = 8.4 + Math.sin(t * 0.41) * 0.18 + pulse * 0.35;
    sim.ti = 14.5 + Math.sin(t * 0.27) * 0.35 + pulse * 0.7;
    sim.te = 12.1 + Math.sin(t * 0.31 + 1) * 0.28 + pulse * 0.45;
    sim.tau = 1.9 + Math.sin(t * 0.17) * 0.06 - pulse * 0.22;
    sim.paux = 18.2 + Math.sin(t * 0.53) * 0.45 + pulse * 1.4;
    sim.q = 1.06 + Math.sin(t * 0.29) * 0.03 - pulse * 0.05;
    sim.vac = 4.1 + Math.sin(t * 0.47) * 0.22 + pulse * 2.4;
    sim.kappa = 27.8 + Math.sin(t * 0.21) * 0.7 + pulse * 1.6;
    sim.phase += dt * (reduceMotion ? 0 : 0.00085);
    sim.shear = 0.012 + pulse * 0.2 + Math.abs(Math.sin(t * 0.8)) * 0.006;
    sim.lattice = 0.984 - pulse * 0.27;
    sim.inject = pulse > 0.55 ? 5 : 4;

    if (sim.shearEnv <= 0 && sim.t > sim.nextShear && !reduceMotion) {
      sim.shearEnv = 1;
      sim.nextShear = sim.t + 18000 + Math.random() * 16000;
    }
    if (sim.shearEnv > 0) {
      sim.shearEnv -= dt / 5600;
      if (sim.shearEnv < 0) sim.shearEnv = 0;
    }
  }

  function refreshShow(now) {
    if (now < nextShow) return;
    nextShow = now + 180;
    show.beta = sim.beta.toFixed(3);
    show.b0 = sim.b0.toFixed(3);
    show.ip = sim.ip.toFixed(3);
    show.ne = sim.ne.toFixed(2);
    show.ti = sim.ti.toFixed(2);
    show.te = sim.te.toFixed(2);
    show.tau = sim.tau.toFixed(2);
    show.paux = sim.paux.toFixed(1);
    show.q = sim.q.toFixed(3);
    show.vac = sim.vac.toFixed(2);
    show.lattice = sim.lattice.toFixed(3);
    show.shear = sim.shear.toFixed(3);
    show.kappa = sim.kappa.toFixed(1);
    show.phase = (sim.phase % (Math.PI * 2)).toFixed(3);
    show.inject = sim.inject + "/6";
    show.q95 = (3.4 + Math.sin(sim.t * 0.00031) * 0.03).toFixed(2);
    const sec = Math.floor(sim.run / 1000);
    const hh = String(Math.floor(sec / 3600)).padStart(2, "0");
    const mm = String(Math.floor(sec / 60) % 60).padStart(2, "0");
    const ss = String(sec % 60).padStart(2, "0");
    show.run = hh + ":" + mm + ":" + ss;
    show.cycle = String(Math.floor(sim.cycle)).padStart(8, "0");
  }

  function hex4(n) {
    return (Math.round(Math.abs(n)) & 0xffff).toString(16).toUpperCase().padStart(4, "0");
  }

  function pushHex() {
    const cyc = Math.floor(sim.cycle) & 0xffff;
    hexLines.push([
      cyc.toString(16).toUpperCase().padStart(4, "0"),
      hex4(sim.b0 * 100),
      hex4(sim.lattice * 10000),
      hex4((sim.phase % (Math.PI * 2)) * 1000),
    ].join(" "));
    if (hexLines.length > 14) hexLines.shift();
  }

  function pushScopes() {
    const t = sim.t;
    const pulse = sim.pulse;
    const samples = [
      Math.sin(t * 0.0042) * 0.45 + Math.sin(t * 0.0011) * 0.22 + pulse * Math.sin(t * 0.02),
      Math.sin(t * 0.0027 + 1.2) * 0.5 + Math.sin(t * 0.007) * 0.18 + pulse * 0.35,
      Math.sin(t * 0.0033 + 2.1) * 0.36 + Math.sin(t * 0.0088) * 0.2 + (sim.shear - 0.012) * 3.2,
    ];
    for (let s = 0; s < 3; s++) {
      scopes[s].data[scopeHead] = Math.max(-1, Math.min(1, samples[s]));
    }
    scopeHead = (scopeHead + 1) % SCOPE_N;
  }

  function spectrum(i, t) {
    let v = 0.045;
    const pulse = sim.pulse;
    for (let k = 0; k < peaks.length; k++) {
      const p = peaks[k];
      const c = p.c + Math.sin(t * p.f) * 5;
      const x = i - c;
      v += p.a * Math.exp(-(x * x) / (2 * p.w * p.w));
    }
    if (pulse > 0.04) {
      v += pulse * 0.55 * Math.exp(-((i - 48) * (i - 48)) / 700);
    }
    if (v > 1) v = 1;
    return v;
  }

  function stepWaterfall() {
    const img = wfx.getImageData(0, 0, BINS, WROWS);
    const row = BINS * 4;
    img.data.copyWithin(row, 0, (WROWS - 1) * row);
    let peakV = 0;
    let peakI = 0;
    const t = sim.t;
    for (let i = 0; i < BINS; i++) {
      let v = spectrum(i, t);
      v = Math.min(1, v + Math.random() * 0.035);
      if (v > peakV) {
        peakV = v;
        peakI = i;
      }
      const c = ramp[Math.max(0, Math.min(63, (v * 63) | 0))];
      const o = i * 4;
      img.data[o] = c[0];
      img.data[o + 1] = c[1];
      img.data[o + 2] = c[2];
      img.data[o + 3] = 255;
    }
    wfx.putImageData(img, 0, 0);
    sim.peakBin = peakI;
  }

  function ensureCal(c, r) {
    if (c === calCols && r === calRows) return;
    calCols = c;
    calRows = r;
    cells = new Float32Array(c * r);
  }

  function stepCal(dt) {
    const decay = Math.exp(-dt * 0.0015);
    const tick = Math.floor(sim.t / 90);
    for (let i = 0; i < cells.length; i++) {
      cells[i] *= decay;
      if ((i + tick) % 11 === 0) cells[i] = Math.min(1, cells[i] + 0.07);
    }
    const cx = (calCols - 1) * (0.5 + 0.34 * Math.sin(sim.t * 0.00055));
    const cy = (calRows - 1) * (0.5 + 0.34 * Math.cos(sim.t * 0.00041));
    const hits = sim.pulse > 0.4 ? 16 : 7;
    const spread = sim.pulse > 0.4 ? 0.85 : 0.34;
    for (let k = 0; k < hits; k++) {
      const ix = Math.round(cx + (Math.random() - 0.5) * calCols * spread);
      const iy = Math.round(cy + (Math.random() - 0.5) * calRows * spread);
      if (ix < 0 || iy < 0 || ix >= calCols || iy >= calRows) continue;
      cells[iy * calCols + ix] = Math.min(1, cells[iy * calCols + ix] + 0.55);
    }
  }

  function motion() {
    return {
      spin: reduceMotion ? 0.7 : sim.t * 0.00032,
      wobble: (reduceMotion ? 0 : 0.012 * Math.sin(sim.t * 0.0014)) + sim.pulse * 0.16,
    };
  }

  function stepParts(dt, spin, wobble) {
    const k = dt * 0.001;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (!reduceMotion) {
        p.u += p.su * k;
        p.v += p.sv * k * (1 + sim.pulse * 0.8);
      }
      const rr = p.r * (1 + wobble * Math.sin(3 * p.u));
      place(p.u + spin, p.v, rr);
      p.x = P.x;
      p.y = P.y;
      p.z = P.z;
    }
  }

  function updateRings(spin, wobble) {
    for (let ri = 0; ri < rings.length; ri++) {
      const ring = rings[ri];
      const n = ring.n;
      const pts = ring.pts;
      let mz = 0;
      for (let i = 0; i < n; i++) {
        const f = i / n;
        let u;
        let v;
        let r;
        if (ring.mode === "pol" || ring.mode === "shell") {
          u = ring.a + spin;
          v = f * Math.PI * 2;
          r = ring.mode === "shell" ? 0.52 : rTube * (1 + wobble * Math.sin(3 * u));
        } else if (ring.mode === "tor") {
          u = f * Math.PI * 2 + spin;
          v = ring.a;
          r = rTube * (1 + wobble * Math.sin(3 * u + ring.a));
        } else if (ring.mode === "hel") {
          u = f * Math.PI * 2 + spin;
          v = f * Math.PI * 6 + ring.a * Math.PI * 2 + spin * 1.6;
          r = rTube * 0.78 * (1 + wobble * Math.sin(4 * u));
        } else {
          u = f * Math.PI * 2 + spin;
          v = 0;
          r = 0;
        }
        place(u, v, r);
        pts[i * 3] = P.x;
        pts[i * 3 + 1] = P.y;
        pts[i * 3 + 2] = P.z;
        mz += P.z;
      }
      ring.mz = mz / n;
    }
    rings.sort((a, b) => a.mz - b.mz);
  }

  function chamfer(x, y, w, h, c) {
    ctx.beginPath();
    ctx.moveTo(x + c, y);
    ctx.lineTo(x + w - c, y);
    ctx.lineTo(x + w, y + c);
    ctx.lineTo(x + w, y + h - c);
    ctx.lineTo(x + w - c, y + h);
    ctx.lineTo(x + c, y + h);
    ctx.lineTo(x, y + h - c);
    ctx.lineTo(x, y + c);
    ctx.closePath();
  }

  function panel(x, y, w, h, title) {
    x = Math.round(x);
    y = Math.round(y);
    w = Math.round(w);
    h = Math.round(h);
    const cut = Math.min(10, Math.max(6, h * 0.08));
    ctx.fillStyle = "rgba(7, 16, 26, 0.78)";
    ctx.strokeStyle = "rgba(150, 206, 226, 0.28)";
    ctx.lineWidth = 1;
    chamfer(x, y, w, h, cut);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "rgba(240, 200, 106, 0.45)";
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.moveTo(x + cut, y);
    ctx.lineTo(x + cut + Math.min(28, w * 0.18), y);
    ctx.moveTo(x, y + cut);
    ctx.lineTo(x, y + cut + Math.min(16, h * 0.2));
    ctx.stroke();
    const titleH = title ? Math.round(16 * U) : 4;
    if (title) {
      ctx.font = font(10, 650);
      ctx.fillStyle = "rgba(168, 226, 244, 0.78)";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(title, x + 12, y + titleH * 0.72);
    }
    return {
      x: x + 8,
      y: y + titleH + 4,
      w: Math.max(8, w - 16),
      h: Math.max(8, h - titleH - 12),
    };
  }

  function brackets(x, y, w, h) {
    const L = Math.max(12, Math.min(22, w * 0.035));
    ctx.strokeStyle = "rgba(240, 200, 106, 0.55)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x, y + L); ctx.lineTo(x, y); ctx.lineTo(x + L, y);
    ctx.moveTo(x + w - L, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + L);
    ctx.moveTo(x, y + h - L); ctx.lineTo(x, y + h); ctx.lineTo(x + L, y + h);
    ctx.moveTo(x + w - L, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - L);
    ctx.stroke();
  }

  function layout(w, h) {
    const rect = safeEl.getBoundingClientRect();
    const pad = 10;
    const x = Math.round(rect.left + pad);
    const y = Math.round(rect.top + pad);
    const W = Math.max(120, Math.round(rect.width - pad * 2));
    const H = Math.max(120, Math.round(rect.height - pad * 2));
    const gap = 6;
    const portrait = H > W * 0.92;
    const statusH = Math.round(Math.max(22, Math.min(30, H * 0.036)));
    const headerH = Math.round(Math.max(48, Math.min(78, H * (portrait ? 0.085 : 0.12))));
    if (portrait) {
      const inner = H - headerH - statusH - gap * 6;
      const hero = Math.round(inner * 0.34);
      const mid = Math.round(inner * 0.175);
      const fall = Math.round(inner * 0.15);
      const scopesH = Math.round(inner * 0.135);
      const telem = inner - hero - mid - fall - scopesH;
      let yy = y;
      const header = { x, y: yy, w: W, h: headerH };
      yy += headerH + gap;
      const heroB = { x, y: yy, w: W, h: hero };
      yy += hero + gap;
      const midB = { x, y: yy, w: W, h: mid };
      yy += mid + gap;
      const fallB = { x, y: yy, w: W, h: fall };
      yy += fall + gap;
      const scB = { x, y: yy, w: W, h: scopesH };
      yy += scopesH + gap;
      const teB = { x, y: yy, w: W, h: Math.max(48, telem) };
      yy += teB.h + gap;
      const stB = { x, y: yy, w: W, h: statusH };
      const mw = Math.round(midB.w * 0.5) - 3;
      return {
        portrait,
        header,
        hero: heroB,
        flux: { x: midB.x, y: midB.y, w: mw, h: midB.h },
        cal: { x: midB.x + mw + 6, y: midB.y, w: midB.w - mw - 6, h: midB.h },
        fall: fallB,
        scopes: scB,
        telem: teB,
        status: stB,
        frame: { x, y, w: W, h: H },
      };
    }
    const leftW = Math.round(W * 0.44);
    const rightX = x + leftW + gap;
    const rightW = W - leftW - gap;
    const colH = H - statusH - gap;
    const header = { x: rightX, y, w: rightW, h: headerH };
    const remain = colH - headerH - gap;
    const mid = Math.round(remain * 0.2);
    const fall = Math.round(remain * 0.16);
    const scopesH = Math.round(remain * 0.22);
    const telem = remain - mid - fall - scopesH - gap * 3;
    let yy = y + headerH + gap;
    const midB = { x: rightX, y: yy, w: rightW, h: mid };
    yy += mid + gap;
    const fallB = { x: rightX, y: yy, w: rightW, h: fall };
    yy += fall + gap;
    const scB = { x: rightX, y: yy, w: rightW, h: scopesH };
    yy += scopesH + gap;
    const teB = { x: rightX, y: yy, w: rightW, h: Math.max(40, telem) };
    const mw = Math.round(rightW * 0.5) - 3;
    return {
      portrait,
      header,
      hero: { x, y, w: leftW, h: colH },
      flux: { x: midB.x, y: midB.y, w: mw, h: midB.h },
      cal: { x: midB.x + mw + 6, y: midB.y, w: rightW - mw - 6, h: midB.h },
      fall: fallB,
      scopes: scB,
      telem: teB,
      status: { x, y: y + colH + gap, w: W, h: statusH },
      frame: { x, y, w: W, h: H },
    };
  }

  function drawHeader(b) {
    const alert = sim.pulse > 0.35;
    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.font = font(10, 650);
    ctx.fillStyle = "rgba(240, 200, 106, 0.9)";
    ctx.fillText("TIMINGSLIP", b.x, b.y);
    ctx.font = font(18, 700);
    ctx.fillStyle = "#e9f6ff";
    ctx.fillText("SLIP CORE", b.x, b.y + 14 * U);
    ctx.font = font(10, 600);
    ctx.fillStyle = "rgba(168, 220, 236, 0.7)";
    ctx.fillText("BAY 04  ·  CONTAINMENT", b.x, b.y + 36 * U);

    ctx.textAlign = "right";
    ctx.font = font(20, 700);
    ctx.fillStyle = alert ? "#ffb15a" : "#9eebff";
    ctx.fillText(alert ? "SHEAR" : "NOMINAL", b.x + b.w, b.y);
    ctx.font = font(11, 600);
    ctx.fillStyle = "rgba(214, 228, 236, 0.82)";
    ctx.fillText("CYC " + (show.cycle || "00000000"), b.x + b.w, b.y + 24 * U);
    ctx.fillStyle = "rgba(168, 206, 220, 0.7)";
    ctx.fillText("RUN " + (show.run || "00:00:00"), b.x + b.w, b.y + 40 * U);

    const ruleY = b.y + b.h - 2;
    ctx.strokeStyle = "rgba(120, 180, 200, 0.28)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.x, ruleY);
    ctx.lineTo(b.x + b.w, ruleY);
    ctx.stroke();
    if (!reduceMotion) {
      const seg = Math.max(36, b.w * 0.16);
      const t = (sim.t * 0.00018) % 1;
      const sx = b.x + (b.w + seg) * t - seg;
      ctx.strokeStyle = "rgba(240, 200, 106, 0.95)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(Math.max(b.x, sx), ruleY);
      ctx.lineTo(Math.min(b.x + b.w, sx + seg), ruleY);
      ctx.stroke();
    }
  }

  function drawCore(box) {
    const inner = panel(box.x, box.y, box.w, box.h, "TOROID  ·  TF LOCK");
    const readH = Math.min(34 * U, inner.h * 0.22);
    const stageH = inner.h - readH;
    const cx = inner.x + inner.w / 2;
    const cy = inner.y + stageH / 2;
    const fit = Math.min(inner.w, stageH);
    const scale = (fit * 0.5 - 8) / 1.72;
    const mot = motion();
    const spin = mot.spin;
    const wobble = mot.wobble;

    ctx.save();
    ctx.beginPath();
    ctx.rect(inner.x, inner.y, inner.w, stageH);
    ctx.clip();

    const glow = ctx.createRadialGradient(cx, cy, scale * 0.15, cx, cy, scale * 1.35);
    if (sim.pulse > 0.2) {
      glow.addColorStop(0, "rgba(255, 170, 80, " + (0.18 + sim.pulse * 0.28) + ")");
      glow.addColorStop(0.4, "rgba(90, 150, 210, 0.12)");
    } else {
      glow.addColorStop(0, "rgba(255, 214, 150, 0.2)");
      glow.addColorStop(0.42, "rgba(70, 160, 200, 0.1)");
    }
    glow.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(inner.x, inner.y, inner.w, stageH);

    updateRings(spin, wobble);

    function strokeRing(ring) {
      const front = ring.mz > -0.05;
      if (ring.mode === "axis") {
        ctx.strokeStyle = "rgba(240, 200, 106, 0.92)";
        ctx.lineWidth = 1.7;
      } else if (ring.mode === "hel") {
        ctx.strokeStyle = front ? "rgba(214, 196, 255, 0.88)" : "rgba(120, 100, 170, 0.25)";
        ctx.lineWidth = 1.15;
      } else if (ring.mode === "shell") {
        ctx.strokeStyle = front ? "rgba(130, 190, 210, 0.28)" : "rgba(80, 120, 140, 0.1)";
        ctx.lineWidth = 1;
      } else {
        ctx.strokeStyle = front ? "rgba(186, 236, 255, 0.88)" : "rgba(86, 140, 168, 0.2)";
        ctx.lineWidth = ring.mode === "pol" ? 1.25 : 1;
      }
      ctx.beginPath();
      const pts = ring.pts;
      for (let i = 0; i < ring.n; i++) {
        const sx = cx + pts[i * 3] * scale;
        const sy = cy - pts[i * 3 + 1] * scale;
        if (i === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      if (ring.mode !== "hel") ctx.closePath();
      ctx.stroke();
    }

    for (let i = 0; i < rings.length; i++) {
      if (rings[i].mz < 0) strokeRing(rings[i]);
    }
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.z >= 0) continue;
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(cx + p.x * scale, cy - p.y * scale, p.core ? 1.5 : 1.05, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < rings.length; i++) {
      if (rings[i].mz >= 0) strokeRing(rings[i]);
    }
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.z < 0) continue;
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(cx + p.x * scale, cy - p.y * scale, p.core ? 2.1 : 1.45, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const dial = scale * 1.62;
    ctx.strokeStyle = "rgba(158, 220, 236, 0.32)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, dial, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 48; i++) {
      const a = -Math.PI / 2 + (i / 48) * Math.PI * 2;
      const inner = i % 6 === 0 ? dial - 7 : dial - 3.5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
      ctx.lineTo(cx + Math.cos(a) * (dial + 1), cy + Math.sin(a) * (dial + 1));
      ctx.stroke();
    }
    const na = -Math.PI / 2 + (sim.phase % (Math.PI * 2));
    ctx.strokeStyle = "#ffb15a";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(cx, cy, dial, na - 0.09, na + 0.09);
    ctx.stroke();

    ctx.strokeStyle = "rgba(200, 236, 248, 0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy); ctx.lineTo(cx - 2.5, cy);
    ctx.moveTo(cx + 2.5, cy); ctx.lineTo(cx + 7, cy);
    ctx.moveTo(cx, cy - 7); ctx.lineTo(cx, cy - 2.5);
    ctx.moveTo(cx, cy + 2.5); ctx.lineTo(cx, cy + 7);
    ctx.stroke();
    ctx.restore();

    const labels = [
      ["βp", show.beta || "—", false],
      ["B0", (show.b0 || "—") + " T", false],
      ["Ψ", (show.phase || "—") + " rad", false],
      ["Λ", show.lattice || "—", sim.lattice < 0.9],
    ];
    const slot = inner.w / labels.length;
    const baseY = inner.y + stageH + readH * 0.55;
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.save();
    ctx.beginPath();
    ctx.rect(inner.x, inner.y + stageH, inner.w, readH + 4);
    ctx.clip();
    for (let i = 0; i < labels.length; i++) {
      const cx = inner.x + slot * (i + 0.5);
      ctx.font = font(11, 680);
      ctx.fillStyle = labels[i][2] ? "#ffb15a" : "#f2fbff";
      ctx.fillText(labels[i][0] + "  " + labels[i][1], cx, baseY);
    }
    ctx.restore();
  }

  function strokeD(cx, cy, rw, rh) {
    ctx.beginPath();
    ctx.moveTo(cx - rw * 0.02, cy - rh);
    ctx.bezierCurveTo(cx + rw * 0.92, cy - rh * 0.95, cx + rw * 1.02, cy + rh * 0.05, cx + rw * 0.22, cy + rh);
    ctx.bezierCurveTo(cx - rw * 0.28, cy + rh * 0.78, cx - rw * 0.55, cy - rh * 0.15, cx - rw * 0.02, cy - rh);
    ctx.stroke();
  }

  function drawFlux(box) {
    const inner = panel(box.x, box.y, box.w, box.h, "FLUX");
    const cx = inner.x + inner.w * 0.56;
    const cy = inner.y + inner.h * 0.5;
    const rw = inner.w * 0.34;
    const rh = inner.h * 0.38;
    for (let i = 5; i >= 0; i--) {
      const k = 0.28 + i * 0.12;
      ctx.strokeStyle = i === 0 ? "rgba(240, 200, 106, 0.8)" : "rgba(158, 220, 240, " + (0.25 + i * 0.08) + ")";
      ctx.lineWidth = i === 0 ? 1.4 : 1;
      strokeD(cx, cy, rw * k, rh * k);
    }
    if (inner.h > 36) {
      const a = reduceMotion ? 0.6 : sim.t * 0.0024;
      const ox = cx + Math.cos(a) * rw * 0.42;
      const oy = cy + Math.sin(a) * rh * 0.28;
      ctx.fillStyle = sim.pulse > 0.4 ? "#ffb15a" : "#f4fbff";
      ctx.beginPath();
      ctx.arc(ox, oy, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCal(box) {
    const inner = panel(box.x, box.y, box.w, box.h, "TILES");
    const cell = Math.max(6, Math.min(13, Math.floor(Math.min(inner.w / 10, inner.h / 6))));
    const cols = Math.max(6, Math.min(18, Math.floor((inner.w + 1) / (cell + 1))));
    const rows = Math.max(4, Math.min(12, Math.floor((inner.h + 1) / (cell + 1))));
    ensureCal(cols, rows);
    const gridW = cols * (cell + 1) - 1;
    const gridH = rows * (cell + 1) - 1;
    const ox = inner.x + (inner.w - gridW) / 2;
    const oy = inner.y + (inner.h - gridH) / 2;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const v = Math.max(0.06, cells[y * cols + x]);
        const c = ramp[Math.max(0, Math.min(63, (v * 63) | 0))];
        ctx.fillStyle = "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
        ctx.fillRect(ox + x * (cell + 1), oy + y * (cell + 1), cell, cell);
      }
    }
  }

  function drawFall(box) {
    const inner = panel(box.x, box.y, box.w, box.h, "HARMONIC  ψ");
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(wf, inner.x, inner.y, inner.w, inner.h);
    ctx.strokeStyle = "rgba(232, 246, 255, 0.16)";
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const x = inner.x + (inner.w * i) / 4;
      ctx.beginPath();
      ctx.moveTo(x, inner.y);
      ctx.lineTo(x, inner.y + inner.h);
      ctx.stroke();
    }
    const px = inner.x + ((sim.peakBin + 0.5) / BINS) * inner.w;
    ctx.strokeStyle = "rgba(240, 200, 106, 0.9)";
    ctx.beginPath();
    ctx.moveTo(px, inner.y);
    ctx.lineTo(px, inner.y + inner.h);
    ctx.stroke();
    ctx.font = font(9, 600);
    ctx.fillStyle = "rgba(240, 200, 106, 0.9)";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("PK " + sim.peakBin, inner.x + 2, inner.y + 2);
  }

  function drawScopes(box) {
    const inner = panel(box.x, box.y, box.w, box.h, "TRACES");
    const rowH = inner.h / 3;
    const gutter = Math.min(34, inner.w * 0.14);
    ctx.lineWidth = 1.25;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    for (let s = 0; s < 3; s++) {
      const y0 = inner.y + s * rowH;
      const mid = y0 + rowH * 0.5;
      const amp = rowH * 0.4;
      ctx.strokeStyle = "rgba(140, 190, 210, 0.16)";
      ctx.beginPath();
      ctx.moveTo(inner.x + gutter, mid);
      ctx.lineTo(inner.x + inner.w, mid);
      ctx.stroke();
      ctx.font = font(10, 650);
      ctx.fillStyle = scopes[s].color;
      ctx.fillText(scopes[s].name, inner.x, mid);
      ctx.beginPath();
      ctx.strokeStyle = scopes[s].color;
      const data = scopes[s].data;
      for (let i = 0; i < SCOPE_N; i++) {
        const idx = (scopeHead + i) % SCOPE_N;
        const x = inner.x + gutter + (i / (SCOPE_N - 1)) * (inner.w - gutter);
        const y = mid - data[idx] * amp;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawTelem(box) {
    const inner = panel(box.x, box.y, box.w, box.h, "BAY BUS  7A");
    const rows = [
      ["Ip", show.ip || "—", "MA", false],
      ["ne", show.ne || "—", "e19", false],
      ["Ti", show.ti || "—", "keV", sim.pulse > 0.5],
      ["Te", show.te || "—", "keV", false],
      ["τE", show.tau || "—", "s", sim.tau < 1.75],
      ["Paux", show.paux || "—", "MW", false],
      ["Q", show.q || "—", "", false],
      ["Vac", show.vac || "—", "µPa", sim.vac > 5.5],
      ["κ", show.kappa || "—", "K", false],
      ["σ", show.shear || "—", "", sim.shear > 0.08],
      ["Inj", show.inject || "—", "", false],
      ["q95", show.q95 || "—", "", false],
    ];
    const showHex = inner.w >= 430;
    const hexW = showHex ? 132 : 0;
    const gridW = inner.w - hexW - (showHex ? 10 : 0);
    const cols = gridW >= 230 ? 2 : 1;
    const colW = gridW / cols;
    const rowCount = Math.ceil(rows.length / cols);
    const rowH = Math.min(18 * U, inner.h / rowCount);
    const tight = rowH < 13;
    ctx.save();
    ctx.beginPath();
    ctx.rect(inner.x, inner.y, gridW, inner.h);
    ctx.clip();
    ctx.textBaseline = "middle";
    for (let i = 0; i < rows.length; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const item = rows[i];
      const x = inner.x + col * colW + 2;
      const y = inner.y + rowH * (row + 0.5);
      if (y > inner.y + inner.h) continue;
      ctx.textAlign = "left";
      ctx.font = font(tight ? 8 : 9, 600);
      ctx.fillStyle = "rgba(158, 210, 226, 0.62)";
      ctx.fillText(item[0], x, y);
      ctx.font = font(tight ? 10 : 12, 680);
      ctx.fillStyle = item[3] ? "#ffb15a" : "#f3fbff";
      const vx = x + (tight ? 28 : 34) * U;
      ctx.fillText(item[1], vx, y);
      if (item[2]) {
        const vw = ctx.measureText(item[1]).width;
        ctx.font = font(8, 500);
        ctx.fillStyle = "rgba(158, 210, 226, 0.5)";
        ctx.fillText(item[2], vx + vw + 4, y);
      }
    }
    ctx.restore();

    if (!showHex) return;
    const hx = inner.x + gridW + 8;
    ctx.save();
    ctx.beginPath();
    ctx.rect(hx, inner.y, hexW, inner.h);
    ctx.clip();
    ctx.font = font(9, 600);
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(158, 210, 226, 0.55)";
    ctx.fillText("FRAME", hx, inner.y);
    ctx.font = font(9, 500);
    const lineH = Math.max(11, 12 * U);
    const maxLines = Math.max(1, Math.floor((inner.h - 14) / lineH));
    const start = Math.max(0, hexLines.length - maxLines);
    for (let i = start; i < hexLines.length; i++) {
      const newest = i === hexLines.length - 1;
      ctx.fillStyle = newest ? "rgba(240, 214, 160, 0.92)" : "rgba(140, 196, 214, 0.55)";
      ctx.fillText(hexLines[i], hx, inner.y + 14 + (i - start) * lineH);
    }
    ctx.restore();
  }

  let wantWake = false;
  let wakeLock = null;
  let wakeBusy = false;
  let wakeDenied = false;
  let fsFailed = false;

  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function requestWake() {
    if (!wantWake || document.hidden) return;
    if (!("wakeLock" in navigator) || wakeBusy || wakeLock) return;
    wakeBusy = true;
    navigator.wakeLock.request("screen").then((lock) => {
      wakeDenied = false;
      wakeLock = lock;
      lock.addEventListener("release", () => {
        wakeLock = null;
        if (wantWake && !document.hidden) {
          setTimeout(requestWake, 500);
        }
        announce();
      });
      announce();
    }).catch(() => {
      wakeLock = null;
      wakeDenied = true;
      announce();
    }).finally(() => {
      wakeBusy = false;
    });
  }

  function releaseWake() {
    const lock = wakeLock;
    wakeLock = null;
    if (!lock) return;
    lock.release().catch(() => {});
  }

  function announce() {
    let text;
    if (!wantWake) text = "Windowed. Tap to fill the screen and keep it awake.";
    else if (isFs() && wakeLock) text = "Fullscreen. The screen stays awake. Tap to release.";
    else if (isFs()) text = "Fullscreen. Tap to release.";
    else text = "Holding the screen on. Tap to release.";
    if (live.textContent !== text) live.textContent = text;
  }

  function engage() {
    wantWake = true;
    fsFailed = false;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) fsFailed = true;
    else req.call(el).catch(() => { fsFailed = true; });
    requestWake();
    announce();
  }

  function releaseAll() {
    wantWake = false;
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (isFs() && exit) exit.call(document).catch(() => {});
    releaseWake();
    announce();
  }

  let lastToggle = 0;
  function toggleFromUser() {
    const now = performance.now();
    if (now - lastToggle < 400) return;
    lastToggle = now;
    if (wantWake || isFs()) releaseAll();
    else engage();
  }

  document.addEventListener("fullscreenchange", () => {
    if (!isFs()) {
      wantWake = false;
      releaseWake();
    }
    announce();
  });
  document.addEventListener("webkitfullscreenchange", () => {
    if (!isFs()) {
      wantWake = false;
      releaseWake();
    }
    announce();
  });

  let suppressClick = false;
  document.addEventListener("pointerup", (e) => {
    if (e.pointerType === "mouse") return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 700);
    toggleFromUser();
  });
  document.addEventListener("click", () => {
    if (suppressClick) return;
    toggleFromUser();
  });
  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.key === "f" || e.key === "F" || e.key === " ") {
      e.preventDefault();
      toggleFromUser();
    }
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  function drawStatus(b) {
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = font(9, 650);
    const items = [
      ["FIELD", sim.pulse < 0.55, sim.pulse < 0.55 ? "#8ef0ff" : "#ffb15a"],
      ["VAC", sim.vac < 5.6, sim.vac < 5.6 ? "#8ef0ff" : "#ffb15a"],
      ["LATTICE", sim.lattice > 0.9, sim.lattice > 0.9 ? "#8ef0ff" : "#ffb15a"],
      ["HOLD", wantWake || isFs(), "#f0c86a"],
      ["WAKE", !!wakeLock, wakeDenied ? "#ffb15a" : "#8ef0ff"],
    ];
    const y = b.y + b.h / 2;
    let phrase = wantWake || isFs() ? "TAP RELEASE" : "TAP ENGAGE";
    if (fsFailed && wantWake && !isFs()) phrase = "FS N/A";
    if (wantWake && wakeDenied && !wakeLock) phrase = "WAKE N/A";
    const phraseW = ctx.measureText(phrase).width;
    const labelW = items.map((item) => ctx.measureText(item[0]).width);
    const fixed = items.length * 12 + labelW.reduce((sum, w) => sum + w, 0);
    const room = b.w - phraseW - 16 - fixed;
    const gap = Math.max(6, Math.min(12, room / items.length));
    let x = b.x;
    for (let i = 0; i < items.length; i++) {
      ctx.beginPath();
      ctx.fillStyle = items[i][1] ? items[i][2] : "rgba(150, 170, 180, 0.28)";
      ctx.arc(x + 4, y, 3.3, 0, Math.PI * 2);
      ctx.fill();
      if (items[i][1]) {
        ctx.beginPath();
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.arc(x + 3.1, y - 1, 1, 0, Math.PI * 2);
        ctx.fill();
      }
      x += 12;
      ctx.fillStyle = "rgba(214, 230, 238, 0.78)";
      ctx.fillText(items[i][0], x, y);
      x += labelW[i] + gap;
    }
    ctx.textAlign = "right";
    ctx.fillStyle = wantWake ? "#f0c86a" : "rgba(214, 230, 238, 0.78)";
    ctx.fillText(phrase, b.x + b.w, y);
  }

  let viewW = 0;
  let viewH = 0;

  function resize() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w < 2 || h < 2) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const bw = Math.round(w * dpr);
    const bh = Math.round(h * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    viewW = w;
    viewH = h;
    U = Math.max(0.86, Math.min(1.28, Math.min(w, h) / 820));
  }

  function drawBackground(w, h) {
    ctx.fillStyle = "#05070c";
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w * 0.5, h * 0.42, Math.min(w, h) * 0.1, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
    g.addColorStop(0, "rgba(16, 40, 58, 0.35)");
    g.addColorStop(1, "rgba(0, 0, 0, 0.35)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(120, 180, 200, 0.035)";
    ctx.lineWidth = 1;
    const step = 32;
    ctx.beginPath();
    for (let x = 0; x <= w; x += step) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
    }
    for (let y = 0; y <= h; y += step) {
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
    }
    ctx.stroke();
  }

  function draw() {
    resize();
    const w = viewW;
    const h = viewH;
    if (w < 2 || h < 2) return;
    drawBackground(w, h);
    const L = layout(w, h);
    brackets(L.frame.x, L.frame.y, L.frame.w, L.frame.h);
    drawHeader(L.header);
    drawCore(L.hero);
    drawFlux(L.flux);
    drawCal(L.cal);
    drawFall(L.fall);
    drawScopes(L.scopes);
    drawTelem(L.telem);
    drawStatus(L.status);
  }

  function paintError(err) {
    const msg = String(err && (err.stack || err.message) || err);
    document.title = "Slip Core error";
    resize();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#14080a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffd0c8";
    ctx.font = "14px monospace";
    ctx.textBaseline = "top";
    const lines = msg.split("\n").slice(0, 12);
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 12, 16 + i * 18);
  }

  let raf = 0;
  let last = performance.now();
  let lastDraw = 0;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(48, now - last);
    last = now;
    try {
      stepSim(dt);
      refreshShow(now);
      hexAcc += dt;
      if (hexAcc > 110) {
        hexAcc = 0;
        pushHex();
      }
      scopeAcc += dt;
      const scopeStep = reduceMotion ? 250 : 32;
      if (scopeAcc > scopeStep) {
        scopeAcc = 0;
        pushScopes();
      }
      if (!reduceMotion) stepWaterfall();
      else if (sim.t < 40) stepWaterfall();
      stepCal(dt);
      const mot = motion();
      stepParts(reduceMotion ? 0 : dt, mot.spin, mot.wobble);
      if (reduceMotion && now - lastDraw < 250) return;
      lastDraw = now;
      draw();
    } catch (err) {
      paintError(err);
      cancelAnimationFrame(raf);
      raf = 0;
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    } else {
      last = performance.now();
      if (!raf) raf = requestAnimationFrame(frame);
      if (wantWake) requestWake();
    }
  });

  window.addEventListener("resize", () => { resize(); draw(); });
  window.addEventListener("orientationchange", () => {
    setTimeout(() => { resize(); draw(); }, 60);
    setTimeout(() => { resize(); draw(); }, 280);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => { resize(); draw(); });
  }

  sim.t = 0;
  sim.run = 0;
  sim.phase = 0.4;
  sim.cycle = 0;
  for (let i = 0; i < WROWS; i++) {
    stepWaterfall();
    if (i % 6 === 0) pushHex();
    sim.t += 48;
    sim.cycle += 4;
    sim.phase += 0.03;
  }
  for (let i = 0; i < SCOPE_N; i++) {
    pushScopes();
    if (i % 8 === 0) pushHex();
    sim.t += 32;
    sim.cycle += 1.4;
    sim.phase += 0.015;
  }
  sim.run = 0;
  for (let i = 0; i < cells.length; i++) cells[i] = ((i * 17) % 10) / 28;
  refreshShow(0);
  stepParts(16, 0.7, 0);
  resize();
  raf = requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
