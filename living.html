<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="description" content="TimingSlip" />
  <meta name="theme-color" content="#03070d" />
  <title>TimingSlip</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root {
      --bg: #03070d;
      --text: #e8f0fa;
      --muted: #8aa3bb;
      --accent: #f0c86a;
      --hub: 158px;
      --sat: 74px;
      --r: min(clamp(148px, 28vmin, 270px), calc(50vw - var(--sat) / 2 - 168px), calc(50vh - var(--sat) / 2 - 120px));
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      color-scheme: dark;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      opacity: 0.28;
      filter: saturate(0.7) contrast(1.05);
    }

    .bg-wash {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 48%, rgba(18, 42, 58, 0.15), transparent 58%),
        radial-gradient(circle at 50% 50%, transparent 18%, rgba(3, 7, 13, 0.55) 72%, rgba(3, 7, 13, 0.88) 100%),
        linear-gradient(180deg, rgba(3, 7, 13, 0.35), rgba(3, 7, 13, 0.62));
    }

    .bg-wash::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(90, 160, 190, 0.018) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 5px, rgba(90, 160, 190, 0.012) 5px 6px);
      mask-image: radial-gradient(circle at 50% 50%, #000 10%, transparent 72%);
    }

    #spores,
    #nervous,
    #probe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #spores { z-index: 2; }
    #nervous { z-index: 3; }
    #probe { z-index: 7; }

    .stage {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100dvh;
      min-height: 100svh;
    }

    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      z-index: 7;
    }

    .hub-orb {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--hub);
      height: var(--hub);
      transform: translate(-50%, -50%) scale(0.72);
      opacity: 0;
      transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    }

    a.hub-orb {
      display: block;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    a.hub-orb:visited,
    a.hub-orb:hover,
    a.hub-orb:active {
      color: inherit;
      text-decoration: none;
    }

    a.hub-orb:focus {
      outline: none;
    }

    a.hub-orb:focus-visible {
      outline: 2px solid rgba(240, 200, 106, 0.75);
      outline-offset: 6px;
    }

    body.is-ready .hub-orb,
    .stage.is-ready .hub-orb {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .hub-corona {
      position: absolute;
      inset: -38%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(240, 200, 106, 0.28) 0%, rgba(70, 180, 190, 0.12) 36%, transparent 68%);
      animation: corona 6.4s ease-in-out infinite;
      pointer-events: none;
    }

    .hub-ring,
    .hub-ring-2 {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      border: 1px solid transparent;
    }

    .hub-ring {
      inset: -14px;
      background:
        conic-gradient(from 0deg,
          transparent 0 8%,
          rgba(126, 230, 214, 0.7) 12%,
          transparent 18% 42%,
          rgba(240, 200, 106, 0.75) 48%,
          transparent 54% 78%,
          rgba(110, 180, 255, 0.55) 84%,
          transparent 90%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 100%);
              mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 100%);
      animation: spin 22s linear infinite;
    }

    .hub-ring-2 {
      inset: -26px;
      background:
        conic-gradient(from 140deg,
          transparent 0 20%,
          rgba(240, 200, 106, 0.35) 24%,
          transparent 30% 68%,
          rgba(90, 210, 200, 0.4) 74%,
          transparent 80%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 100%);
              mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 100%);
      animation: spin 38s linear infinite reverse;
      opacity: 0.8;
    }

    .hub-body {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(circle at 34% 30%, rgba(255, 246, 220, 0.7) 0 2%, transparent 14%),
        radial-gradient(circle at 50% 46%, #f4d48a 0%, #d4923a 26%, #24505a 52%, #0a1820 74%, #05090e 100%);
      box-shadow:
        0 0 18px 3px rgba(240, 200, 106, 0.4),
        0 0 64px 16px rgba(64, 170, 180, 0.2),
        0 0 120px 36px rgba(240, 200, 106, 0.08),
        inset 0 -18px 28px rgba(0, 8, 14, 0.45),
        inset 0 10px 18px rgba(255, 236, 190, 0.12);
    }

    .hub-body::after {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px solid rgba(240, 200, 106, 0.18);
      box-shadow: inset 0 0 22px rgba(40, 200, 190, 0.12);
    }

    .hub-core {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 28%;
      height: 28%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 35%, #fff6d6, #f0c86a 38%, #8a4a18 80%);
      box-shadow:
        0 0 16px 4px rgba(240, 200, 106, 0.7),
        0 0 40px 10px rgba(240, 180, 80, 0.25);
      animation: pulse var(--beat, 3.6s) ease-in-out infinite;
    }

    .hub-speck {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(180, 255, 240, 0.55);
      box-shadow: 0 0 5px rgba(140, 240, 220, 0.45);
      animation: orbit 11s linear infinite;
    }

    .hub-speck:nth-child(2) { animation-duration: 17s; animation-delay: -4s; width: 3px; height: 3px; }
    .hub-speck:nth-child(3) { animation-duration: 13s; animation-delay: -8s; }

    .brand {
      position: absolute;
      left: 50%;
      top: calc(1.15rem + var(--safe-t));
      transform: translateX(-50%);
      text-align: center;
      width: max-content;
      z-index: 7;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.9s ease 0.35s;
    }

    body.is-ready .brand,
    .stage.is-ready .brand { opacity: 1; }

    .brand h1 {
      margin: 0;
      font-size: clamp(0.86rem, 2.1vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
    }

    .brand h1 span {
      color: var(--accent);
      text-shadow: 0 0 16px rgba(240, 200, 106, 0.45);
    }

    .constellation {
      position: absolute;
      inset: 0;
    }

    .constellation,
    .sat,
    .sat-branch {
      pointer-events: none;
    }

    .sat {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--sat);
      height: var(--sat);
      color: inherit;
      text-decoration: none;
      transform: translate(-50%, -50%) rotate(var(--a)) translateY(calc(-1 * var(--r) * var(--rm, 1))) rotate(calc(var(--a) * -1));
      z-index: 6;
    }

    .orb {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transform: scale(0.35);
      opacity: 0;
      color: var(--c);
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.55), transparent 22%),
        radial-gradient(circle at 50% 54%, color-mix(in srgb, var(--c) 55%, #0a1218) 0%, #0a1218 72%);
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 0 16px color-mix(in srgb, var(--c) 35%, transparent),
        0 0 36px color-mix(in srgb, var(--c) 14%, transparent),
        inset 0 -10px 16px rgba(0, 0, 0, 0.35);
      transition:
        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.55s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
      transition-delay: var(--d, 0s);
    }

    .orb svg {
      width: 44%;
      height: 44%;
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 55%, transparent));
    }

    body.is-ready .orb,
    .stage.is-ready .orb {
      transform: scale(1);
      opacity: 1;
    }

    .sat:hover > .orb,
    .sat:focus-visible > .orb,
    .sat-branch:hover .orb,
    .sat-branch:focus-visible .orb {
      transform: scale(1.12);
      border-color: color-mix(in srgb, var(--c) 90%, white);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 0 22px color-mix(in srgb, var(--c) 60%, transparent),
        0 0 54px color-mix(in srgb, var(--c) 28%, transparent),
        inset 0 -10px 16px rgba(0, 0, 0, 0.3);
      outline: none;
    }

    .sat:focus-visible > .orb,
    .sat-branch:focus-visible .orb {
      outline: 2px solid var(--c);
      outline-offset: 5px;
    }

    .sat:focus,
    .sat-branch:focus {
      outline: none;
    }

    .sat--fork {
      cursor: default;
    }

    .sat--fork:hover,
    .sat--fork:focus-within,
    body[data-focus="tetris"] .sat--fork {
      z-index: 7;
    }

    .sat-branch {
      position: absolute;
      width: calc(var(--sat) * 0.72);
      height: calc(var(--sat) * 0.72);
      color: inherit;
      text-decoration: none;
      z-index: 7;
    }

    .sat-branch[data-fork="gb"] {
      left: calc(50% + var(--sat) * -1.08);
      top: calc(50% + var(--sat) * 1);
    }

    .sat-branch[data-fork="nes"] {
      left: calc(50% + var(--sat) * 1.08);
      top: calc(50% + var(--sat) * 1);
    }

    .sat-branch-label { display: none; }

    .brand h1 .ch {
      display: inline-block;
      color: inherit;
      text-shadow: inherit;
    }

    .brand h1 .ch.accent {
      color: var(--accent);
      text-shadow: 0 0 16px rgba(240, 200, 106, 0.45);
    }

    .brand.is-slipping {
      transition: none;
    }

    .brand.is-slipping .ch {
      animation: letter-slip 1.85s cubic-bezier(0.22, 0.08, 0.25, 1) forwards;
      animation-delay: var(--ld, 0s);
    }

    .brand.is-gone,
    .footer.is-gone {
      opacity: 0 !important;
      visibility: hidden;
    }

    .orb.is-pop {
      animation: orb-pop 0.62s cubic-bezier(0.2, 0.7, 0.25, 1) forwards;
      transition: none;
    }

    .vein.is-retracting .growing {
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 0.72s cubic-bezier(0.4, 0, 1, 1);
    }

    body.is-grown .vein.is-retracting .growing {
      stroke-dashoffset: 1;
    }

    .vein.is-retracting .vein-flow,
    .vein.is-retracting .node {
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .vein.is-retracting {
      opacity: 0;
      transition: opacity 0.35s ease 0.4s;
    }

    .vein.life .growing {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .vein.life.is-open .growing {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset var(--gd, 0.95s) cubic-bezier(0.4, 0, 0.2, 1);
    }

    .vein.life.is-open .node {
      opacity: 1;
      transition: opacity 0.4s ease;
      transition-delay: calc(var(--gd, 0.95s) * 0.72);
    }

    .vein.life.is-retracting .growing {
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 0.7s cubic-bezier(0.4, 0, 1, 1);
    }

    .vein.life.is-retracting .node,
    .vein.life.is-retracting .vein-flow {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #life {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }

    .life-orb {
      position: absolute;
      width: var(--s, 28px);
      height: var(--s, 28px);
      margin: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0;
      color: var(--c);
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.55), transparent 22%),
        radial-gradient(circle at 50% 54%, color-mix(in srgb, var(--c) 55%, #0a1218) 0%, #0a1218 72%);
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 0 14px color-mix(in srgb, var(--c) 35%, transparent),
        0 0 28px color-mix(in srgb, var(--c) 14%, transparent),
        inset 0 -8px 12px rgba(0, 0, 0, 0.35);
    }

    .life-orb.is-in {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      transition:
        transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.4s ease;
    }

    .life-orb {
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .life-core {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 34%;
      height: 34%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 40% 35%, #fff8e8, var(--c) 46%, transparent 76%);
      box-shadow: 0 0 8px color-mix(in srgb, var(--c) 75%, transparent);
      opacity: 0.8;
      pointer-events: none;
    }

    .life-orb.is-in .life-core {
      animation: life-breathe 4.8s ease-in-out infinite;
      animation-delay: var(--bd, 0s);
    }

    .life-orb.is-pop .life-core { animation: none; }

    .life-orb.is-in::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--c) 75%, white);
      opacity: 0;
      pointer-events: none;
      animation: birth-ring 0.9s ease-out;
    }

    .life-orb.is-hot {
      z-index: 2;
      border-color: color-mix(in srgb, var(--c) 90%, white);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 0 22px color-mix(in srgb, var(--c) 70%, transparent),
        0 0 48px color-mix(in srgb, var(--c) 30%, transparent),
        inset 0 -8px 12px rgba(0, 0, 0, 0.28);
    }

    .life-orb.is-pulse:not(.is-pop) {
      animation: life-pulse 0.6s ease-out;
    }

    .life-orb.is-pop {
      animation: life-pop 0.58s cubic-bezier(0.2, 0.7, 0.25, 1) forwards;
    }

    body[data-focus="colony"] .life-orb { opacity: 0.42; }
    body[data-focus="colony"] .life-orb.is-hot,
    body[data-focus="colony"] .life-orb.is-near { opacity: 1; }

    .tech {
      --c: var(--accent);
      position: fixed;
      z-index: 8;
      width: min(228px, calc(100vw - 28px));
      padding: 0.62rem 0.78rem 0.7rem;
      pointer-events: auto;
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
      background:
        linear-gradient(180deg, rgba(12, 22, 34, 0.55), transparent 40%),
        rgba(5, 10, 16, 0.86);
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.45),
        0 14px 40px rgba(0, 0, 0, 0.5),
        0 0 28px color-mix(in srgb, var(--c) 20%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(8px);
      clip-path: inset(0 100% 0 0);
      transition:
        opacity 0.22s ease,
        transform 0.28s ease,
        clip-path 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tech.is-open {
      opacity: 1;
      transform: none;
      clip-path: inset(0 0 0 0);
    }

    .tech.is-out {
      opacity: 0;
      transform: translateY(-6px);
      clip-path: inset(0 0 0 100%);
      transition:
        opacity 0.45s ease,
        transform 0.45s ease,
        clip-path 0.5s ease;
    }

    .tech-k {
      display: block;
      margin-bottom: 0.18rem;
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c);
    }

    .tech-title {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .tech-body {
      margin: 0.32rem 0 0;
      font-size: 0.72rem;
      line-height: 1.45;
      color: var(--muted);
      white-space: pre-line;
    }

    .tech::before,
    .tech::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      pointer-events: none;
    }

    .tech::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--c);
      border-left: 2px solid var(--c);
      box-shadow: 0 0 8px color-mix(in srgb, var(--c) 45%, transparent);
    }

    .tech::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid var(--c);
      border-bottom: 2px solid var(--c);
      box-shadow: 0 0 8px color-mix(in srgb, var(--c) 45%, transparent);
    }

    #readout {
      --c: var(--accent);
      position: fixed;
      z-index: 8;
      width: min(272px, calc(100vw - 28px));
      padding: 0.78rem 0.95rem 0.88rem;
      pointer-events: none;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(12, 22, 34, 0.55), transparent 40%),
        rgba(5, 10, 16, 0.86);
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.45),
        0 14px 40px rgba(0, 0, 0, 0.5),
        0 0 28px color-mix(in srgb, var(--c) 20%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      clip-path: inset(0 100% 0 0);
    }

    #readout.is-open {
      opacity: 1;
      visibility: visible;
      transform: none;
      clip-path: inset(0 0 0 0);
      transition:
        opacity 0.22s ease,
        transform 0.28s ease,
        clip-path 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #readout::before,
    #readout::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      pointer-events: none;
    }

    #readout::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--c);
      border-left: 2px solid var(--c);
      box-shadow: 0 0 8px color-mix(in srgb, var(--c) 45%, transparent);
    }

    #readout::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid var(--c);
      border-bottom: 2px solid var(--c);
      box-shadow: 0 0 8px color-mix(in srgb, var(--c) 45%, transparent);
    }

    .readout-kind {
      display: block;
      margin-bottom: 0.22rem;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c);
    }

    .readout-title {
      display: block;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .readout-desc {
      margin: 0.38rem 0 0;
      font-size: 0.84rem;
      line-height: 1.4;
      color: var(--muted);
      min-height: 3.6em;
    }

    #readout.is-title-only {
      padding-bottom: 0.72rem;
    }

    #readout.is-title-only .readout-kind,
    #readout.is-title-only .readout-desc {
      display: none;
      margin: 0;
      min-height: 0;
    }

    .readout-desc.is-typing::after {
      content: "▋";
      margin-left: 1px;
      color: var(--c);
      animation: blink 0.8s step-end infinite;
    }

    .probe-glow,
    .probe-body,
    .probe-core {
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .probe-glow { opacity: 0.55; }
    .probe-line {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }
    .probe-line.is-on {

    /* Veins live in #nervous (sibling of .stage), so state lives on body */
    .vein { opacity: 0.96; transition: opacity 0.35s ease, filter 0.35s ease; }
    body[data-focus] .vein {

    }

    body.is-grown .vein.life .growing {
      stroke-dashoffset: 1;
      transition: none;
    }

    body.is-grown .vein.life.is-open .growing {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset var(--gd, 0.95s) cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-grown .vein.life .node {
      opacity: 0;
      transition: none;
    }

    body.is-grown .vein.life.is-open .node {
      opacity: 1;
      transition: opacity 0.4s ease;
      transition-delay: calc(var(--gd, 0.95s) * 0.7);
    }

    body.is-grown .vein.life.is-retracting .growing {
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 0.7s cubic-bezier(0.4, 0, 1, 1);
    }

      opacity: 0;

  <script>
    (function () {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const root = document.body;
      const stage = document.getElementById("stage");
      const svg = document.getElementById("nervous");
      const canvas = document.getElementById("spores");
      const sats = Array.from(document.querySelectorAll(".sat"));
      const hubEl = document.querySelector(".hub-body");
      const brand = document.querySelector(".brand");
      const footer = document.querySelector(".footer");
      const lifeLayer = document.getElementById("life");
      const techRoot = document.getElementById("tech-root");
      const probe = document.getElementById("probe");
      const finePointer = window.matchMedia("(pointer: fine)").matches;
      const coarse = window.matchMedia("(pointer: coarse)").matches;
      const NS = "http://www.w3.org/2000/svg";
      const PALETTE = ["#f0c86a", "#5ec8e8", "#7dff6a", "#d4e8ff", "#8ee08a", "#ffd93b", "#e85a2a", "#c9a6ff", "#7ee6d6", "#ff9b6a"];

      let grownOnce = false;
      let resizeTimer = 0;
      let phase = "intro";
      let lifeTimer = 0;
      let seq = 1;
      let hubNode = null;
      let focused = null;
      let driftOn = false;
      let flareTimer = 0;
      let burst = function () {};
      const nodes = [];
      const edges = [];

      function wait(ms) {
        return new Promise(function (resolve) { window.setTimeout(resolve, ms); });
      }

      function hashStr(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function rng(seed) {
        let a = seed || 1;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function cssColor(el) {
        return getComputedStyle(el).getPropertyValue("--c").trim() || "#9ad";
      }

      function centerOf(el) {
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: Math.min(r.width, r.height) / 2 };
      }

      function tendril(id, x1, y1, x2, y2, hub) {
        const r = rng(hashStr(id + ":v3"));
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const tx = dx / len;
        const ty = dy / len;
        const nx = -ty;
        const ny = tx;
        const keepOut = hub.r + 18;
        const maxSpread = Math.min(14 + r() * 42, len * 0.2);

        function away(x, y) {
          const ox = x - hub.x;
          const oy = y - hub.y;
          const d = Math.hypot(ox, oy) || 1;
          if (d >= keepOut) return { x: x, y: y };
          return { x: hub.x + (ox / d) * keepOut, y: hub.y + (oy / d) * keepOut };
        }

        const waves = len < 150 ? 1 : 2 + Math.floor(r() * 2);
        const points = [{ x: x1, y: y1 }];
        for (let i = 1; i <= waves; i++) {
          const t = i / (waves + 1);
          const side = (i % 2 === 0 ? 1 : -1) * (0.65 + r() * 0.5);
          let x = x1 + dx * t + nx * side * maxSpread;
          let y = y1 + dy * t + ny * side * maxSpread;
          if (r() > 0.42) {
            const g = 9;
            if (r() > 0.5) x = Math.round(x / g) * g;
            else y = Math.round(y / g) * g;
          }
          points.push(away(x, y));
        }
        points.push({ x: x2, y: y2 });

        let d = "M " + points[0].x.toFixed(1) + " " + points[0].y.toFixed(1);
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const allowJog = len > 190 && i < points.length - 1 && r() > 0.7;
          if (allowJog) {
            const horizFirst = r() > 0.5;
            const mid = away(horizFirst ? p1.x : p0.x, horizFirst ? p0.y : p1.y);
            d += " L " + mid.x.toFixed(1) + " " + mid.y.toFixed(1) + " L " + p1.x.toFixed(1) + " " + p1.y.toFixed(1);
          } else {
            const cdx = p1.x - p0.x;
            const cdy = p1.y - p0.y;
            const cl = Math.hypot(cdx, cdy) || 1;
            const ox = (-cdy / cl) * (r() - 0.5) * Math.min(36, len * 0.12);
            const oy = (cdx / cl) * (r() - 0.5) * Math.min(36, len * 0.12);
            const c = away((p0.x + p1.x) / 2 + ox, (p0.y + p1.y) / 2 + oy);
            d += " Q " + c.x.toFixed(1) + " " + c.y.toFixed(1) + " " + p1.x.toFixed(1) + " " + p1.y.toFixed(1);
          }
        }

        const branches = [];
        const nB = len < 150 ? 1 + Math.floor(r() * 2) : len < 230 ? 2 + Math.floor(r() * 2) : 3 + Math.floor(r() * 2);
        const maxBlen = Math.min(14 + r() * 34, len * 0.24);
        for (let i = 0; i < nB; i++) {
          const t = 0.28 + r() * 0.46;
          const bx = x1 + dx * t + nx * (r() - 0.5) * 18;
          const by = y1 + dy * t + ny * (r() - 0.5) * 18;
          const side = r() < 0.5 ? -1 : 1;
          const ex = bx + nx * side * maxBlen + tx * (r() - 0.2) * maxBlen;
          const ey = by + ny * side * maxBlen + ty * (r() - 0.2) * maxBlen;
          const cx = (bx + ex) / 2 + tx * 8 * (r() - 0.5);
          const cy = (by + ey) / 2 + ty * 8 * (r() - 0.5);
          branches.push({
            d: "M " + bx.toFixed(1) + " " + by.toFixed(1) + " Q " + cx.toFixed(1) + " " + cy.toFixed(1) + " " + ex.toFixed(1) + " " + ey.toFixed(1),
            tip: { x: ex, y: ey }
          });
        }

        return { d: d, branches: branches, points: points };
      }

      function el(name, attrs) {
        const node = document.createElementNS(NS, name);
        for (const k in attrs) node.setAttribute(k, attrs[k]);
        return node;
      }

      function sizeSvg() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        svg.setAttribute("viewBox", "0 0 " + w + " " + h);
        svg.setAttribute("width", w);
        svg.setAttribute("height", h);
      }

      function ensureDefs() {
        if (svg.querySelector("#vein-soft")) return;
        const defs = el("defs", {});
        const blur = el("filter", { id: "vein-soft", x: "-20%", y: "-20%", width: "140%", height: "140%" });
        blur.appendChild(el("feGaussianBlur", { in: "SourceGraphic", stdDeviation: "3.6" }));
        defs.appendChild(blur);
        svg.insertBefore(defs, svg.firstChild);
      }

      function draw() {
        sizeSvg();
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        ensureDefs();

        const hub = centerOf(hubEl);
        const delayStep = 0.11;

        sats.forEach(function (sat, i) {
          const id = sat.dataset.id;
          const color = cssColor(sat);
          const orb = sat.querySelector(":scope > .orb") || sat.querySelector(".orb");
          const dest = centerOf(orb);
          const vx = dest.x - hub.x;
          const vy = dest.y - hub.y;
          const dist = Math.hypot(vx, vy) || 1;
          const ux = vx / dist;
          const uy = vy / dist;
          const x1 = hub.x + ux * (hub.r - 2);
          const y1 = hub.y + uy * (hub.r - 2);
          const x2 = dest.x - ux * (dest.r - 1);
          const y2 = dest.y - uy * (dest.r - 1);
          const spec = tendril(id, x1, y1, x2, y2, hub);
          const gd = (0.18 + i * delayStep).toFixed(2) + "s";
          paintVein(id, "", spec, color, gd, x2, y2, 18, 2.6, 1.05, 3.2);

          if (sat.classList.contains("sat--fork")) {
            sat.querySelectorAll(".sat-branch").forEach(function (br, bi) {
              const colorB = cssColor(br);
              const destB = centerOf(br.querySelector(".orb"));
              const vxB = destB.x - dest.x;
              const vyB = destB.y - dest.y;
              const distB = Math.hypot(vxB, vyB) || 1;
              const uxB = vxB / distB;
              const uyB = vyB / distB;
              const x1b = dest.x + uxB * (dest.r - 1);
              const y1b = dest.y + uyB * (dest.r - 1);
              const x2b = destB.x - uxB * (destB.r - 1);
              const y2b = destB.y - uyB * (destB.r - 1);
              const specB = tendril(id + ":" + (br.dataset.fork || bi), x1b, y1b, x2b, y2b, dest);
              const gdB = (0.18 + i * delayStep + 0.32 + bi * 0.08).toFixed(2) + "s";
              paintVein(id, br.dataset.fork || "", specB, colorB, gdB, x2b, y2b, 12, 2.1, 0.9, 2.6);
            });
          }
        });

        if (grownOnce || reduce) {
          root.classList.add("is-grown");
          stage.classList.add("is-grown");
          if (!reduce) {
            root.classList.add("is-flowing");
            stage.classList.add("is-flowing");
          }
        }
      }

      function paintVein(id, fork, spec, color, gd, x2, y2, glowW, bodyW, coreW, tipR) {
        const g = el("g", { class: "vein", "data-id": id, style: "--gd:" + gd });
        if (fork) g.setAttribute("data-fork", fork);
        g.appendChild(el("path", {
          class: "vein-glow growing",
          "data-part": "main",
          d: spec.d,
          stroke: color,
          "stroke-width": String(glowW),
          filter: "url(#vein-soft)",
          pathLength: "1"
        }));
        g.appendChild(el("path", {
          class: "vein-body growing",
          "data-part": "main",
          d: spec.d,
          stroke: color,
          "stroke-width": String(bodyW),
          "stroke-opacity": "0.92",
          pathLength: "1"
        }));
        g.appendChild(el("path", {
          class: "vein-core growing",
          "data-part": "main",
          d: spec.d,
          stroke: "#f6fbff",
          "stroke-width": String(coreW),
          "stroke-opacity": "0.72",
          pathLength: "1"
        }));
        g.appendChild(el("path", {
          class: "vein-flow",
          "data-part": "main",
          d: spec.d,
          stroke: color,
          "stroke-width": String(bodyW)
        }));
        spec.branches.forEach(function (br) {
          g.appendChild(el("path", {
            class: "capillary growing",
            "data-part": "cap",
            d: br.d,
            stroke: color,
            "stroke-width": "1.35",
            "stroke-opacity": "0.75",
            pathLength: "1"
          }));
          g.appendChild(el("circle", {
            class: "node",
            "data-part": "capnode",
            cx: br.tip.x.toFixed(1),
            cy: br.tip.y.toFixed(1),
            r: "2.4",
            fill: color,
            "fill-opacity": "0.95"
          }));
        });
        spec.points.slice(1, -1).forEach(function (p, pi) {
          const diamond = el("rect", {
            class: "node",
            "data-part": "joint",
            x: (p.x - 2.4).toFixed(1),
            y: (p.y - 2.4).toFixed(1),
            width: "4.8",
            height: "4.8",
            rx: pi % 2 === 0 ? "0.4" : "2.4",
            fill: "#071018",
            stroke: color,
            "stroke-width": "1"
          });
          diamond.setAttribute("transform", "rotate(45 " + p.x.toFixed(1) + " " + p.y.toFixed(1) + ")");
          g.appendChild(diamond);
        });
        g.appendChild(el("circle", {
          class: "node",
          "data-part": "tip",
          cx: x2.toFixed(1),
          cy: y2.toFixed(1),
          r: String(tipR),
          fill: "none",
          stroke: color,
          "stroke-width": "1.2"
        }));
        svg.appendChild(g);
        return g;
      }

      function slipBrand() {
        const h1 = brand.querySelector("h1");
        if (!h1 || brand.classList.contains("is-slipping")) return;
        function addChars(word, accent, base) {
          word.split("").forEach(function (ch, i) {
            const s = document.createElement("span");
            s.className = accent ? "ch accent" : "ch";
            s.textContent = ch;
            const dx = (Math.random() - 0.5) * 96;
            const dy = -14 - Math.random() * 72;
            const rot = (Math.random() - 0.5) * 40;
            s.style.setProperty("--ld", (base + i * 0.075) + "s");
            s.style.setProperty("--sx", (dx * 0.32) + "px");
            s.style.setProperty("--sy", (dy * 0.22) + "px");
            s.style.setProperty("--sr", (rot * 0.28) + "deg");
            s.style.setProperty("--ex", dx + "px");
            s.style.setProperty("--ey", dy + "px");
            s.style.setProperty("--er", rot + "deg");
            h1.appendChild(s);
          });
        }
        h1.textContent = "";
        addChars("Timing", false, 0);
        addChars("Slip", true, 0.42);
        brand.classList.add("is-slipping");
        if (footer) footer.classList.add("is-gone");
        window.setTimeout(function () {
          brand.classList.add("is-gone");
        }, reduce ? 180 : 2300);
      }

      function dismantleOrder() {
        const groups = sats.map(function (sat) {
          const items = [];
          sat.querySelectorAll(".sat-branch").forEach(function (br) {
            items.push({ el: br, id: sat.dataset.id, fork: br.dataset.fork });
          });
          items.push({ el: sat, id: sat.dataset.id, fork: null });
          return items;
        });
        const start = Math.floor(Math.random() * groups.length);
        return groups.slice(start).concat(groups.slice(0, start)).reduce(function (a, b) {
          return a.concat(b);
        }, []);
      }

      async function dismantle() {
        phase = "dismantle";
        const order = dismantleOrder();
        for (let i = 0; i < order.length; i++) {
          const item = order[i];
          const sel = item.fork
            ? '.vein[data-id="' + item.id + '"][data-fork="' + item.fork + '"]'
            : '.vein[data-id="' + item.id + '"]:not([data-fork])';
          svg.querySelectorAll(sel).forEach(function (v) {
            v.classList.add("is-retracting");
          });
          await wait(reduce ? 70 : 300);
          const orb = item.el.querySelector(":scope > .orb") || item.el.querySelector(".orb");
          if (orb) orb.classList.add("is-pop");
          await wait(reduce ? 110 : 500);
          item.el.style.visibility = "hidden";
        }
        svg.querySelectorAll(".vein:not(.life)").forEach(function (v) {
          if (v.parentNode) v.parentNode.removeChild(v);
        });
        const constellation = document.querySelector(".constellation");
        if (constellation) constellation.style.display = "none";
      }

      function syncHub() {
        const c = centerOf(hubEl);
        if (!hubNode) {
          hubNode = { id: "hub", x: c.x, y: c.y, r: c.r, color: "#f0c86a", el: null, isHub: true, alive: true, parent: null };
          nodes.push(hubNode);
        } else {
          hubNode.x = c.x;
          hubNode.y = c.y;
          hubNode.r = c.r;
        }
      }

      function bounds() {
        return {
          x0: 36,
          y0: 36,
          x1: window.innerWidth - 36,
          y1: window.innerHeight - 36
        };
      }

      function pos(n) {
        return {
          x: n.x + (n.ox || 0),
          y: n.y + (n.oy || 0),
          r: n.r,
          isHub: !!n.isHub,
          id: n.id
        };
      }

      function hexToRgb(hex) {
        const n = parseInt(String(hex).replace("#", ""), 16);
        if (!isFinite(n)) return "200, 210, 180";
        return ((n >> 16) & 255) + ", " + ((n >> 8) & 255) + ", " + (n & 255);
      }

      function hexToHsl(hex) {
        const n = parseInt(String(hex).replace("#", ""), 16);
        const r = ((n >> 16) & 255) / 255;
        const g = ((n >> 8) & 255) / 255;
        const b = (n & 255) / 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h = 0;
        const l = (max + min) / 2;
        const d = max - min;
        let s = 0;
        if (d) {
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
          else if (max === g) h = (b - r) / d + 2;
          else h = (r - g) / d + 4;
          h /= 6;
        }
        return { h: h * 360, s: s, l: l };
      }

      function hslToHex(h, s, l) {
        h = ((h % 360) + 360) % 360;
        const a = s * Math.min(l, 1 - l);
        function f(n) {
          const k = (n + h / 30) % 12;
          const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
          return Math.round(255 * Math.max(0, Math.min(1, c))).toString(16).padStart(2, "0");
        }
        return "#" + f(0) + f(8) + f(4);
      }

      function childColor(parent) {
        if (!parent || Math.random() < 0.18) return PALETTE[Math.floor(Math.random() * PALETTE.length)];
        const hsl = hexToHsl(parent.color || "#f0c86a");
        return hslToHex(
          hsl.h + (Math.random() * 32 - 16),
          Math.min(0.72, Math.max(0.42, hsl.s)),
          Math.min(0.66, Math.max(0.5, hsl.l))
        );
      }

      function aliveCount() {
        let n = 0;
        for (let i = 0; i < nodes.length; i++) {
          if (nodes[i].alive && !nodes[i].isHub) n += 1;
        }
        return n;
      }

      function maxOrbs() {
        const short = Math.min(window.innerWidth, window.innerHeight);
        const byArea = Math.round((window.innerWidth * window.innerHeight) / 78000);
        if (short < 520) return Math.min(8, Math.max(6, byArea));
        return Math.max(9, Math.min(18, byArea));
      }

      function degree(node) {
        let n = 0;
        for (let i = 0; i < edges.length; i++) {
          const e = edges[i];
          if (e.alive && (e.a === node || e.b === node)) n += 1;
        }
        return n;
      }

      function linked(a, b) {
        for (let i = 0; i < edges.length; i++) {
          const e = edges[i];
          if (!e.alive) continue;
          if ((e.a === a && e.b === b) || (e.a === b && e.b === a)) return true;
        }
        return false;
      }

      function generation(node) {
        let g = 0;
        let p = node;
        while (p && p.parent && g < 12) {
          g += 1;
          p = p.parent;
        }
        return g;
      }

      function nodeById(id) {
        for (let i = 0; i < nodes.length; i++) {
          if (nodes[i].id === id) return nodes[i];
        }
        return null;
      }

      function pointOnEllipse(angle, reach) {
        const p = pos(hubNode);
        const b = bounds();
        const roomX = Math.max(48, Math.min(p.x - b.x0, b.x1 - p.x) - 26);
        const roomY = Math.max(48, Math.min(p.y - b.y0, b.y1 - p.y) - 26);
        return {
          x: p.x + Math.cos(angle) * roomX * reach,
          y: p.y + Math.sin(angle) * roomY * reach
        };
      }

      function sectorOf(x, y) {
        const p = pos(hubNode);
        let a = Math.atan2(y - p.y, x - p.x);
        if (a < 0) a += Math.PI * 2;
        return Math.min(7, Math.floor((a / (Math.PI * 2)) * 8));
      }

      function sectorCounts() {
        const c = [0, 0, 0, 0, 0, 0, 0, 0];
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (!n.alive || n.isHub) continue;
          c[sectorOf(n.x, n.y)] += 1;
        }
        return c;
      }

      function emptiestSector() {
        const c = sectorCounts();
        let best = c[0];
        const opts = [0];
        for (let i = 1; i < 8; i++) {
          if (c[i] < best) {
            best = c[i];
            opts.length = 0;
            opts.push(i);
          } else if (c[i] === best) opts.push(i);
        }
        return opts[Math.floor(Math.random() * opts.length)];
      }

      function occupied(x, y, r, ignore) {
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (!n.alive || n === ignore) continue;
          const q = pos(n);
          const gap = n.isHub ? 22 : 16;
          if (Math.hypot(x - q.x, y - q.y) < r + q.r + gap) return true;
        }
        return false;
      }

      function clampRadius(r) {
        return Math.max(coarse ? 15 : 12, Math.min(coarse ? 23 : 27, r));
      }

      function geometry(from, to) {
        const a = pos(from);
        const b = pos(to);
        const vx = b.x - a.x;
        const vy = b.y - a.y;
        const dist = Math.hypot(vx, vy) || 1;
        const ux = vx / dist;
        const uy = vy / dist;
        return {
          x1: a.x + ux * (a.r - 1),
          y1: a.y + uy * (a.r - 1),
          x2: b.x - ux * (b.r - 1),
          y2: b.y - uy * (b.r - 1)
        };
      }

      function indexVein(g) {
        return {
          mains: Array.from(g.querySelectorAll("[data-part='main']")),
          caps: Array.from(g.querySelectorAll("[data-part='cap']")),
          capnodes: Array.from(g.querySelectorAll("[data-part='capnode']")),
          joints: Array.from(g.querySelectorAll("[data-part='joint']")),
          tip: g.querySelector("[data-part='tip']")
        };
      }

      function makeLifeVein(from, to, color, gdSec, instant, key) {
        const geo = geometry(from, to);
        const spec = tendril(key, geo.x1, geo.y1, geo.x2, geo.y2, pos(hubNode));
        const gd = (instant ? 0.01 : gdSec).toFixed(2) + "s";
        const glowW = from.isHub || to.isHub ? 14 : 10;
        const g = paintVein("life", "", spec, color, gd, geo.x2, geo.y2, glowW, 2.2, 0.95, 2.4);
        g.classList.add("life");
        g.removeAttribute("data-id");
        g.dataset.a = from.id;
        g.dataset.b = to.id;
        if (instant || reduce) g.classList.add("is-open");
        else {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { g.classList.add("is-open"); });
          });
        }
        return g;
      }

      function refreshEdge(e) {
        if (!e.alive || !e.g || !e.g.parentNode) return;
        const geo = geometry(e.a, e.b);
        const last = e.drawn;
        if (last && Math.hypot(geo.x1 - last.x1, geo.y1 - last.y1) < 0.45 && Math.hypot(geo.x2 - last.x2, geo.y2 - last.y2) < 0.45) return;
        const spec = tendril(e.key, geo.x1, geo.y1, geo.x2, geo.y2, pos(hubNode));
        const parts = e.parts || (e.parts = indexVein(e.g));
        const jointsNeeded = Math.max(0, spec.points.length - 2);
        if (parts.mains.length !== 4 || parts.caps.length !== spec.branches.length || parts.joints.length !== jointsNeeded || !parts.tip) {
          if (e.g.parentNode) e.g.parentNode.removeChild(e.g);
          e.g = makeLifeVein(e.a, e.b, e.color || e.b.color, 0.01, true, e.key);
          e.parts = indexVein(e.g);
          e.drawn = geo;
          return;
        }
        parts.mains.forEach(function (p) { p.setAttribute("d", spec.d); });
        spec.branches.forEach(function (br, i) {
          parts.caps[i].setAttribute("d", br.d);
          parts.capnodes[i].setAttribute("cx", br.tip.x.toFixed(1));
          parts.capnodes[i].setAttribute("cy", br.tip.y.toFixed(1));
        });
        spec.points.slice(1, -1).forEach(function (p, i) {
          parts.joints[i].setAttribute("x", (p.x - 2.4).toFixed(1));
          parts.joints[i].setAttribute("y", (p.y - 2.4).toFixed(1));
          parts.joints[i].setAttribute("transform", "rotate(45 " + p.x.toFixed(1) + " " + p.y.toFixed(1) + ")");
        });
        parts.tip.setAttribute("cx", geo.x2.toFixed(1));
        parts.tip.setAttribute("cy", geo.y2.toFixed(1));
        e.drawn = geo;
      }

      function linkEdge(from, to, color, gd, instant) {
        const key = "k" + seq++;
        const g = makeLifeVein(from, to, color, gd, instant, key);
        if (!instant && !reduce) g.classList.add("is-surge");
        const edge = {
          id: key,
          key: key,
          a: from,
          b: to,
          g: g,
          parts: indexVein(g),
          alive: true,
          color: color,
          drawn: null
        };
        edges.push(edge);
        if (!instant && !reduce) {
          window.setTimeout(function () { g.classList.remove("is-surge"); }, 1400);
        }
        return edge;
      }

      function makeLifeOrb(node) {
        const d = document.createElement("div");
        d.className = "life-orb";
        d.style.setProperty("--c", node.color);
        d.style.setProperty("--s", (node.r * 2) + "px");
        d.style.setProperty("--bd", ((-node.ph) || 0).toFixed(2) + "s");
        const core = document.createElement("span");
        core.className = "life-core";
        d.appendChild(core);
        const p = pos(node);
        d.style.left = p.x + "px";
        d.style.top = p.y + "px";
        lifeLayer.appendChild(d);
        if (reduce) d.classList.add("is-in");
        else {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { d.classList.add("is-in"); });
          });
        }
        return d;
      }

      function spawnNode(parent, x, y, r, color) {
        if (!parent || !parent.alive || !hubNode) return null;
        r = clampRadius(r);
        const b = bounds();
        for (let attempt = 0; attempt < 7; attempt++) {
          const rr = clampRadius(r * (1 - attempt * 0.06));
          const j = attempt ? attempt * 16 : 0;
          const ang = Math.random() * Math.PI * 2;
          const px = Math.max(b.x0 + rr, Math.min(b.x1 - rr, x + Math.cos(ang) * j));
          const py = Math.max(b.y0 + rr, Math.min(b.y1 - rr, y + Math.sin(ang) * j));
          const hub = pos(hubNode);
          if (Math.hypot(px - hub.x, py - hub.y) < hub.r + rr + 18) continue;
          if (occupied(px, py, rr, parent)) continue;
          const node = {
            id: "n" + seq++,
            x: px,
            y: py,
            r: rr,
            color: color,
            ox: 0,
            oy: 0,
            el: null,
            parent: parent,
            isHub: false,
            alive: true,
            born: performance.now(),
            ph: Math.random() * Math.PI * 2,
            f1: 0.28 + Math.random() * 0.22,
            f2: 0.22 + Math.random() * 0.18,
            amp: reduce ? 0 : 4 + Math.random() * 6
          };
          nodes.push(node);
          const gd = reduce ? 0.1 : 0.48 + Math.random() * 0.38;
          linkEdge(parent, node, color, gd, false);
          window.setTimeout(function () {
            if (!node.alive) return;
            node.el = makeLifeOrb(node);
            bindOrb(node);
            burst(node.x, node.y, color, 7);
          }, reduce ? 30 : gd * 560);
          return node;
        }
        return null;
      }

      function missesHub(a, b) {
        const h = pos(hubNode);
        const abx = b.x - a.x;
        const aby = b.y - a.y;
        const den = abx * abx + aby * aby || 1;
        const t = Math.max(0, Math.min(1, ((h.x - a.x) * abx + (h.y - a.y) * aby) / den));
        return Math.hypot(a.x + abx * t - h.x, a.y + aby * t - h.y) > h.r + 26;
      }

      function tryBridge() {
        const alive = nodes.filter(function (n) { return n.alive && !n.isHub; });
        if (alive.length < 3) return false;
        for (let t = 0; t < 16; t++) {
          const a = alive[Math.floor(Math.random() * alive.length)];
          const b = alive[Math.floor(Math.random() * alive.length)];
          if (a === b || linked(a, b)) continue;
          if (a.parent === b || b.parent === a) continue;
          let da = Math.abs(Math.atan2(a.y - hubNode.y, a.x - hubNode.x) - Math.atan2(b.y - hubNode.y, b.x - hubNode.x));
          if (da > Math.PI) da = Math.PI * 2 - da;
          if (da < 0.28 || da > 1.2) continue;
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 64 || d > 440) continue;
          if (!missesHub(a, b)) continue;
          const color = Math.random() > 0.5 ? a.color : b.color;
          linkEdge(a, b, color, reduce ? 0.1 : 0.55 + Math.random() * 0.35, false);
          return true;
        }
        return false;
      }

      function collectDescendants(node) {
        const out = [];
        const stack = [node];
        while (stack.length) {
          const cur = stack.pop();
          for (let i = 0; i < nodes.length; i++) {
            const n = nodes[i];
            if (!n.alive || n.parent !== cur) continue;
            if (out.indexOf(n) < 0) {
              out.push(n);
              stack.push(n);
            }
          }
        }
        return out;
      }

      function retractEdge(e) {
        if (!e.alive) return;
        e.alive = false;
        if (!e.g) return;
        e.g.classList.remove("is-open", "is-surge");
        e.g.classList.add("is-retracting");
        const g = e.g;
        window.setTimeout(function () {
          if (g.parentNode) g.parentNode.removeChild(g);
        }, reduce ? 80 : 780);
      }

      function killNode(node) {
        if (!node || node.isHub || !node.alive) return;
        const doomed = [node].concat(collectDescendants(node));
        if (focused && doomed.indexOf(focused) >= 0) clearFocus();
        doomed.forEach(function (n) {
          n.alive = false;
          dismissCardsFor(n.id);
          const p = pos(n);
          burst(p.x, p.y, n.color, 16);
          edges.forEach(function (e) {
            if (e.alive && (e.a === n || e.b === n)) retractEdge(e);
          });
          if (n.el) {
            n.el.classList.remove("is-in", "is-hot", "is-near");
            n.el.classList.add("is-pop");
            const eln = n.el;
            window.setTimeout(function () {
              if (eln.parentNode) eln.parentNode.removeChild(eln);
              if (n.el === eln) n.el = null;
            }, reduce ? 80 : 620);
          }
        });
      }

      function pickParentNear(spot) {
        let best = null;
        let bestD = Infinity;
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (!n.alive) continue;
          if (!n.isHub && degree(n) >= 4) continue;
          const q = pos(n);
          const d = Math.hypot(q.x - spot.x, q.y - spot.y);
          const limit = n.isHub ? 560 : 300;
          if (d < limit && d < bestD) {
            bestD = d;
            best = n;
          }
        }
        return best;
      }

      function growIntoSector(sector) {
        if (aliveCount() >= maxOrbs()) return null;
        const ang = (sector + 0.28 + Math.random() * 0.44) * (Math.PI * 2 / 8);
        const counts = sectorCounts();
        const reach = counts[sector] === 0 ? 0.74 + Math.random() * 0.16 : 0.4 + Math.random() * 0.48;
        const spot = pointOnEllipse(ang, reach);
        const parent = pickParentNear(spot) || hubNode;
        const color = parent.isHub ? PALETTE[Math.floor(Math.random() * PALETTE.length)] : childColor(parent);
        const r = parent.isHub ? (coarse ? 16 : 15) + Math.random() * 8 : parent.r * (0.68 + Math.random() * 0.22);
        return spawnNode(parent, spot.x, spot.y, r, color);
      }

      function growToward(x, y) {
        if (aliveCount() >= maxOrbs() + 2) return null;
        const parent = pickParentNear({ x: x, y: y }) || hubNode;
        const color = parent.isHub ? PALETTE[Math.floor(Math.random() * PALETTE.length)] : childColor(parent);
        const r = parent.isHub ? (coarse ? 16 : 14) + Math.random() * 7 : Math.max(12, parent.r * 0.72);
        return spawnNode(parent, x, y, r, color);
      }

      function killInSector(sector) {
        const leaves = [];
        const any = [];
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (!n.alive || n.isHub) continue;
          if (sectorOf(n.x, n.y) !== sector) continue;
          any.push(n);
          if (degree(n) <= 1) leaves.push(n);
        }
        const pool = leaves.length ? leaves : any;
        if (!pool.length) return;
        if (pool.length < 2 && aliveCount() < maxOrbs()) return;
        killNode(pool[Math.floor(Math.random() * pool.length)]);
      }

      function prune() {
        for (let i = edges.length - 1; i >= 0; i--) {
          const e = edges[i];
          if (!e.alive && (!e.g || !e.g.parentNode)) edges.splice(i, 1);
        }
        for (let i = nodes.length - 1; i >= 0; i--) {
          const n = nodes[i];
          if (!n.alive && !n.isHub && !n.el) nodes.splice(i, 1);
        }
      }

      function tagOf(id) {
        return (hashStr(String(id)) >>> 0).toString(16).toUpperCase().padStart(4, "0").slice(0, 4);
      }

      function techKind(node) {
        for (let i = 0; i < edges.length; i++) {
          const e = edges[i];
          if (!e.alive) continue;
          if (e.a !== node && e.b !== node) continue;
          const other = e.a === node ? e.b : e.a;
          if (other !== node.parent && node !== other.parent) return "BRIDGE";
        }
        if (node.parent && node.parent.isHub) return "SPOKE";
        return "BRANCH";
      }

      function techTitle(node) {
        if (performance.now() - node.born < 2200) return "BIRTH";
        const d = degree(node);
        if (d >= 3) return "LATTICE";
        if (d <= 1) return "DRIFT";
        if (generation(node) >= 3) return "DEEP";
        return "PHASE";
      }

      function techLines(node) {
        const p = pos(node);
        const hub = pos(hubNode);
        const range = Math.hypot(p.x - hub.x, p.y - hub.y);
        const age = (performance.now() - node.born) / 1000;
        const slip = Math.hypot(node.ox || 0, node.oy || 0);
        return [
          "gen " + generation(node) + "   links " + degree(node),
          "age " + age.toFixed(1) + " s",
          "range " + range.toFixed(0),
          "slip " + slip.toFixed(2)
        ].join("\n");
      }

      function cardFor(id) {
        const boxes = techRoot.children;
        for (let i = 0; i < boxes.length; i++) {
          if (boxes[i].dataset.node === id && !boxes[i].classList.contains("is-out")) return boxes[i];
        }
        return null;
      }

      function dismissCard(box) {
        if (!box || box.classList.contains("is-out")) return;
        window.clearTimeout(box._die);
        box.classList.remove("is-open", "is-pinned");
        box.classList.add("is-out");
        window.setTimeout(function () {
          if (box.parentNode) box.parentNode.removeChild(box);
        }, reduce ? 40 : 520);
      }

      function dismissCardsFor(id) {
        const boxes = Array.from(techRoot.querySelectorAll('.tech[data-node="' + id + '"]'));
        boxes.forEach(dismissCard);
      }

      function armDismiss(box) {
        window.clearTimeout(box._die);
        box._die = window.setTimeout(function () {
          dismissCard(box);
        }, 2400 + Math.random() * 1400);
      }

      function trimCards() {
        const limit = window.innerWidth < 720 ? 1 : 2;
        const boxes = Array.from(techRoot.querySelectorAll(".tech:not(.is-out)"));
        while (boxes.length >= limit) {
          let idx = -1;
          for (let i = 0; i < boxes.length; i++) {
            if (!boxes[i].classList.contains("is-pinned")) { idx = i; break; }
          }
          if (idx < 0) idx = 0;
          dismissCard(boxes[idx]);
          boxes.splice(idx, 1);
        }
      }

      function placeTech(box, node) {
        const p = pos(node);
        const hub = pos(hubNode);
        const w = box.offsetWidth || 200;
        const h = box.offsetHeight || 108;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const pad = 12;
        let left;
        let top;
        if (vw < 720) {
          left = Math.max(pad, (vw - w) / 2);
          top = vh - h - pad - 16;
        } else {
          const vx = p.x - hub.x;
          const vy = p.y - hub.y;
          const dist = Math.hypot(vx, vy) || 1;
          const ux = vx / dist;
          const uy = vy / dist;
          const ax = p.x + ux * (p.r + 30);
          const ay = p.y + uy * (p.r + 12);
          left = ux >= 0 ? ax : ax - w;
          top = ay - h * 0.4;
        }
        const closestX = Math.max(left, Math.min(p.x, left + w));
        const closestY = Math.max(top, Math.min(p.y, top + h));
        const dx = p.x - closestX;
        const dy = p.y - closestY;
        const pd = Math.hypot(dx, dy);
        const need = p.r + 18;
        if (vw >= 720 && pd < need && pd > 0.5) {
          left -= (dx / pd) * (need - pd);
          top -= (dy / pd) * (need - pd);
        }
        left = Math.max(pad, Math.min(left, vw - w - pad));
        top = Math.max(pad, Math.min(top, vh - h - pad));
        box.style.left = left + "px";
        box.style.top = top + "px";
      }

      function digitalPath(x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        if (Math.abs(dx) >= Math.abs(dy)) {
          const mid = x1 + dx * 0.52;
          return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
            " L " + mid.toFixed(1) + " " + y1.toFixed(1) +
            " L " + mid.toFixed(1) + " " + y2.toFixed(1) +
            " L " + x2.toFixed(1) + " " + y2.toFixed(1);
        }
        const mid = y1 + dy * 0.52;
        return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
          " L " + x1.toFixed(1) + " " + mid.toFixed(1) +
          " L " + x2.toFixed(1) + " " + mid.toFixed(1) +
          " L " + x2.toFixed(1) + " " + y2.toFixed(1);
      }

      function attachPoint(box, from) {
        const sides = [
          { x: box.left, y: box.top + box.h / 2 },
          { x: box.left + box.w, y: box.top + box.h / 2 },
          { x: box.left + box.w / 2, y: box.top },
          { x: box.left + box.w / 2, y: box.top + box.h }
        ];
        let best = sides[0];
        let bestD = Infinity;
        for (let i = 0; i < sides.length; i++) {
          const d = Math.hypot(sides[i].x - from.x, sides[i].y - from.y);
          if (d < bestD) {
            bestD = d;
            best = sides[i];
          }
        }
        return best;
      }

      function drawProbes() {
        if (!probe) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        probe.setAttribute("viewBox", "0 0 " + w + " " + h);
        probe.setAttribute("width", String(w));
        probe.setAttribute("height", String(h));
        while (probe.firstChild) probe.removeChild(probe.firstChild);
        const boxes = techRoot.querySelectorAll(".tech.is-open");
        boxes.forEach(function (box) {
          const node = nodeById(box.dataset.node);
          if (!node || !node.alive) return;
          const p = pos(node);
          const rect = box.getBoundingClientRect();
          const dest = attachPoint({ left: rect.left, top: rect.top, w: rect.width, h: rect.height }, p);
          const vx = dest.x - p.x;
          const vy = dest.y - p.y;
          const dist = Math.hypot(vx, vy) || 1;
          const x1 = p.x + (vx / dist) * (p.r - 1);
          const y1 = p.y + (vy / dist) * (p.r - 1);
          const d = digitalPath(x1, y1, dest.x, dest.y);
          const g = el("g", {});
          g.appendChild(el("path", {
            class: "probe-glow probe-line is-on",
            d: d,
            stroke: node.color,
            "stroke-width": "10",
            pathLength: "1"
          }));
          g.appendChild(el("path", {
            class: "probe-body probe-line is-on",
            d: d,
            stroke: node.color,
            "stroke-width": "1.8",
            pathLength: "1"
          }));
          g.appendChild(el("path", {
            class: "probe-core probe-line is-on",
            d: d,
            stroke: "#f6fbff",
            "stroke-width": "0.7",
            "stroke-opacity": "0.75",
            pathLength: "1"
          }));
          g.appendChild(el("circle", {
            cx: dest.x.toFixed(1),
            cy: dest.y.toFixed(1),
            r: "2.6",
            fill: node.color
          }));
          probe.appendChild(g);
        });
      }

      function openTech(node, pinned) {
        if (!node || !node.alive) return;
        let box = cardFor(node.id);
        if (!box) {
          trimCards();
          box = document.createElement("aside");
          box.className = "tech";
          box.dataset.node = node.id;
          box.style.setProperty("--c", node.color);
          const k = document.createElement("span");
          k.className = "tech-k";
          k.textContent = techKind(node) + "  " + tagOf(node.id);
          const title = document.createElement("strong");
          title.className = "tech-title";
          title.textContent = techTitle(node);
          const body = document.createElement("p");
          body.className = "tech-body";
          body.textContent = techLines(node);
          box.appendChild(k);
          box.appendChild(title);
          box.appendChild(body);
          techRoot.appendChild(box);
          placeTech(box, node);
          if (reduce) box.classList.add("is-open");
          else requestAnimationFrame(function () { box.classList.add("is-open"); });
        } else {
          box.style.setProperty("--c", node.color);
          placeTech(box, node);
        }
        if (pinned) {
          box.classList.add("is-pinned");
          window.clearTimeout(box._die);
        } else if (!box.classList.contains("is-pinned")) {
          armDismiss(box);
        }
      }

      function spawnTech() {
        const limit = window.innerWidth < 720 ? 1 : 2;
        if (techRoot.querySelectorAll(".tech:not(.is-out)").length >= limit) return;
        const orbs = nodes.filter(function (n) { return n.alive && n.el && !cardFor(n.id); });
        if (!orbs.length) return;
        openTech(orbs[Math.floor(Math.random() * orbs.length)], false);
      }

      function setHot(node, on) {
        if (on) root.dataset.focus = "colony";
        else if (root.dataset.focus === "colony") delete root.dataset.focus;
        const near = {};
        if (on && node) {
          near[node.id] = true;
          if (node.parent) near[node.parent.id] = true;
          for (let i = 0; i < nodes.length; i++) {
            if (nodes[i].alive && nodes[i].parent === node) near[nodes[i].id] = true;
          }
        }
        svg.querySelectorAll(".vein.life").forEach(function (v) {
          v.classList.toggle("is-hot", !!(on && node && (v.dataset.a === node.id || v.dataset.b === node.id)));
        });
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (!n.el) continue;
          n.el.classList.toggle("is-hot", !!(on && n === node));
          n.el.classList.toggle("is-near", !!(on && n !== node && near[n.id]));
        }
      }

      function focusNode(node) {
        if (!node || !node.alive) return;
        focused = node;
        setHot(node, true);
        openTech(node, finePointer);
      }

      function clearFocus() {
        const node = focused;
        focused = null;
        setHot(null, false);
        if (!node) return;
        const box = cardFor(node.id);
        if (box && box.classList.contains("is-pinned")) {
          box.classList.remove("is-pinned");
          armDismiss(box);
        }
      }

      function bindOrb(node) {
        node.el.addEventListener("pointerenter", function () {
          if (phase !== "living" || !node.alive) return;
          focusNode(node);
        });
        node.el.addEventListener("pointerleave", function () {
          if (focused === node) clearFocus();
        });
        node.el.addEventListener("click", function (ev) {
          ev.stopPropagation();
          if (phase !== "living" || !node.alive) return;
          bud(node);
        });
      }

      function bud(node) {
        if (node.el) {
          node.el.classList.remove("is-pulse");
          void node.el.offsetWidth;
          node.el.classList.add("is-pulse");
        }
        focusNode(node);
        if (aliveCount() >= maxOrbs() + 2) return;
        const ang = Math.atan2(node.y - hubNode.y, node.x - hubNode.x);
        const spot = Math.random() > 0.35
          ? pointOnEllipse(ang + (Math.random() - 0.5) * 0.7, 0.86 + Math.random() * 0.1)
          : {
              x: node.x + Math.cos(ang + 0.9) * (node.r + 52 + Math.random() * 34),
              y: node.y + Math.sin(ang + 0.9) * (node.r + 52 + Math.random() * 34)
            };
        if (spawnNode(node, spot.x, spot.y, node.r * 0.74, childColor(node))) flareHub();
      }

      function flareHub() {
        const orb = document.querySelector(".hub-orb");
        if (!orb) return;
        orb.classList.remove("is-flare");
        void orb.offsetWidth;
        orb.classList.add("is-flare");
        window.clearTimeout(flareTimer);
        flareTimer = window.setTimeout(function () { orb.classList.remove("is-flare"); }, 760);
      }

      function syncBeat() {
        const sec = Math.max(1.7, 4.15 - aliveCount() * 0.1);
        root.style.setProperty("--beat", sec.toFixed(2) + "s");
      }

      function followCards(now) {
        const boxes = Array.from(techRoot.querySelectorAll(".tech.is-open"));
        boxes.forEach(function (box) {
          const node = nodeById(box.dataset.node);
          if (!node || !node.alive) {
            dismissCard(box);
            return;
          }
          placeTech(box, node);
          if (!box._wrote || now - box._wrote > 380) {
            const body = box.querySelector(".tech-body");
            if (body) body.textContent = techLines(node);
            box._wrote = now;
          }
        });
        drawProbes();
      }

      function applyDrift(now) {
        const t = now * 0.001;
        const breath = Math.sin(t * 0.65) * 4;
        const b = bounds();
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (!n.alive || n.isHub) continue;
          const ang = Math.atan2(n.y - hubNode.y, n.x - hubNode.x);
          n.ox = Math.sin(t * n.f1 + n.ph) * n.amp + Math.cos(ang) * breath;
          n.oy = Math.cos(t * n.f2 + n.ph * 1.3) * n.amp * 0.7 + Math.sin(ang) * breath;
        }
        for (let i = 0; i < nodes.length; i++) {
          const a = nodes[i];
          if (!a.alive || a.isHub) continue;
          for (let j = i + 1; j < nodes.length; j++) {
            const c = nodes[j];
            if (!c.alive || c.isHub) continue;
            const dx = (c.x + c.ox) - (a.x + a.ox);
            const dy = (c.y + c.oy) - (a.y + a.oy);
            const d = Math.hypot(dx, dy) || 1;
            const min = a.r + c.r + 12;
            if (d < min) {
              const push = (min - d) * 0.18;
              a.ox -= (dx / d) * push;
              a.oy -= (dy / d) * push;
              c.ox += (dx / d) * push;
              c.oy += (dy / d) * push;
            }
          }
          const hub = hubNode;
          const hx = a.x + a.ox - hub.x;
          const hy = a.y + a.oy - hub.y;
          const hd = Math.hypot(hx, hy) || 1;
          const keep = hub.r + a.r + 16;
          if (hd < keep) {
            a.ox += (hx / hd) * (keep - hd);
            a.oy += (hy / hd) * (keep - hd);
          }
          const x = a.x + a.ox;
          const y = a.y + a.oy;
          if (x < b.x0 + a.r) a.ox += (b.x0 + a.r) - x;
          if (x > b.x1 - a.r) a.ox -= x - (b.x1 - a.r);
          if (y < b.y0 + a.r) a.oy += (b.y0 + a.r) - y;
          if (y > b.y1 - a.r) a.oy -= y - (b.y1 - a.r);
          if (a.el) {
            a.el.style.left = (a.x + a.ox) + "px";
            a.el.style.top = (a.y + a.oy) + "px";
          }
        }
        for (let i = 0; i < edges.length; i++) {
          if (edges[i].alive) refreshEdge(edges[i]);
        }
      }

      function startDrift() {
        if (driftOn) return;
        driftOn = true;
        function frame(now) {
          if (!driftOn) return;
          requestAnimationFrame(frame);
          if (document.hidden || phase !== "living") return;
          if (!reduce) applyDrift(now);
          followCards(now);
        }
        requestAnimationFrame(frame);
      }

      function stepLife() {
        prune();
        const n = aliveCount();
        const max = maxOrbs();
        const counts = sectorCounts();
        const empty = emptiestSector();
        let crowd = 0;
        for (let i = 1; i < 8; i++) if (counts[i] > counts[crowd]) crowd = i;
        if (counts[empty] === 0) growIntoSector(empty);
        else if (n < Math.floor(max * 0.85) && Math.random() < 0.45) growIntoSector(empty);
        else if (n > 6 && Math.random() < 0.28) killInSector(crowd);
        else if (Math.random() < 0.5) tryBridge();
        else if (n < max) growIntoSector(empty);
        syncBeat();
        if (Math.random() < 0.16) spawnTech();
      }

      function scheduleLife() {
        const delay = reduce ? 420 : 1100 + Math.random() * 1600;
        lifeTimer = window.setTimeout(function () {
          if (phase !== "living") return;
          if (!document.hidden) stepLife();
          scheduleLife();
        }, delay);
      }

      function rebuildLifeVeins() {
        sizeSvg();
        ensureDefs();
        edges.forEach(function (e) {
          if (!e.alive) return;
          if (e.g && e.g.parentNode) e.g.parentNode.removeChild(e.g);
          e.g = makeLifeVein(e.a, e.b, e.color || e.a.color, 0.01, true, e.key);
          e.parts = indexVein(e.g);
          e.drawn = null;
        });
      }

      function relayoutLife() {
        if (!hubNode) return;
        const prevX = hubNode.x;
        const prevY = hubNode.y;
        syncHub();
        const dx = hubNode.x - prevX;
        const dy = hubNode.y - prevY;
        if (dx || dy) {
          nodes.forEach(function (n) {
            if (n.isHub) return;
            n.x += dx;
            n.y += dy;
            if (n.el) {
              n.el.style.left = (n.x + (n.ox || 0)) + "px";
              n.el.style.top = (n.y + (n.oy || 0)) + "px";
            }
          });
        }
        rebuildLifeVeins();
      }

      async function seedLife() {
        phase = "living";
        syncHub();
        flareHub();
        const count = Math.max(5, Math.min(8, Math.round(Math.min(window.innerWidth, window.innerHeight) / 120)));
        let first = null;
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI / 2 + (i + 0.5) * (Math.PI * 2 / count) + (Math.random() - 0.5) * 0.16;
          const spot = pointOnEllipse(ang, 0.72 + Math.random() * 0.14);
          const node = spawnNode(hubNode, spot.x, spot.y, (coarse ? 16 : 16) + Math.random() * (coarse ? 6 : 9), PALETTE[i % PALETTE.length]);
          if (node && !first) first = node;
          await wait(reduce ? 70 : 240 + Math.random() * 150);
        }
        const spokes = nodes.filter(function (n) { return n.alive && !n.isHub; });
        const narrow = Math.min(window.innerWidth, window.innerHeight) < 520;
        const extras = Math.min(narrow ? 1 : 3, spokes.length);
        for (let i = 0; i < extras; i++) {
          const parent = spokes[(i * 2) % spokes.length];
          const ang = Math.atan2(parent.y - hubNode.y, parent.x - hubNode.x);
          const spot = pointOnEllipse(ang + (Math.random() - 0.5) * 0.45, Math.random() > 0.4 ? 0.46 : 0.9);
          spawnNode(parent, spot.x, spot.y, parent.r * 0.7, childColor(parent));
          await wait(reduce ? 40 : 260);
        }
        tryBridge();
        tryBridge();
        syncBeat();
        if (first) {
          window.setTimeout(function () {
            if (first.alive && phase === "living") openTech(first, false);
          }, reduce ? 60 : 680);
        }
        scheduleLife();
        startDrift();
      }

      function onStageClick(ev) {
        if (phase !== "living") return;
        if (ev.target.closest && ev.target.closest(".life-orb")) return;
        if (ev.target.closest && ev.target.closest(".hub")) return;
        if (growToward(ev.clientX, ev.clientY)) flareHub();
      }

      async function runSequence() {
        slipBrand();
        await wait(reduce ? 180 : 2500);
        await dismantle();
        await wait(reduce ? 120 : 640);
        await seedLife();
      }

      function spores() {
        if (reduce) return;
        const ctx = canvas.getContext("2d");
        const parts = [];
        const n = 88;

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(window.innerWidth * dpr);
          canvas.height = Math.floor(window.innerHeight * dpr);
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function spawn(force) {
          return {
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            vx: (Math.random() - 0.5) * 0.18,
            vy: (Math.random() - 0.55) * 0.22,
            r: force ? 0.6 + Math.random() * 1.4 : 0.4 + Math.random() * 1.2,
            a: 0.08 + Math.random() * 0.22,
            hue: Math.random() > 0.55 ? "200, 210, 170" : "140, 210, 210"
          };
        }

        burst = function (x, y, color, count) {
          const hue = hexToRgb(color);
          for (let i = 0; i < count; i++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 0.35 + Math.random() * 1.55;
            parts.push({
              x: x,
              y: y,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 0.12,
              r: 0.7 + Math.random() * 1.5,
              a: 0.5,
              hue: hue,
              life: 1
            });
          }
          if (parts.length > 180) parts.splice(0, parts.length - 180);
        };

        resize();
        for (let i = 0; i < n; i++) parts.push(spawn(true));

        let last = 0;
        function tick(now) {
          if (document.hidden) {
            requestAnimationFrame(tick);
            return;
          }
          const dt = Math.min(40, now - last || 16);
          last = now;
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          for (let i = 0; i < parts.length; i++) {
            const p = parts[i];
            if (p.life != null) {
              p.life -= dt / 780;
              const damp = Math.pow(0.986, dt / 16);
              p.vx *= damp;
              p.vy *= damp;
              p.a = Math.max(0, p.life) * 0.55;
              if (p.life <= 0) {
                parts.splice(i, 1);
                i -= 1;
                continue;
              }
            }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (p.life == null) {
              if (p.x < -8) p.x = window.innerWidth + 8;
              if (p.x > window.innerWidth + 8) p.x = -8;
              if (p.y < -8) p.y = window.innerHeight + 8;
              if (p.y > window.innerHeight + 8) p.y = -8;
            }
            ctx.beginPath();
            ctx.fillStyle = "rgba(" + p.hue + "," + p.a + ")";
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          requestAnimationFrame(tick);
        }

        window.addEventListener("resize", resize);
        requestAnimationFrame(tick);
      }

      function onResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          if (phase === "intro") draw();
          else if (phase === "living") relayoutLife();
        }, 80);
      }

      draw();
      spores();

      requestAnimationFrame(function () {
        root.classList.add("is-ready");
        stage.classList.add("is-ready");
        if (reduce) {
          root.classList.add("is-grown");
          stage.classList.add("is-grown");
          window.setTimeout(runSequence, 400);
          return;
        }
        requestAnimationFrame(function () {
          root.classList.add("is-grown");
          stage.classList.add("is-grown");
          grownOnce = true;
          window.setTimeout(function () {
            root.classList.add("is-flowing");
            stage.classList.add("is-flowing");
          }, 1600);
          window.setTimeout(runSequence, 2400);
        });
      });

      stage.addEventListener("click", onStageClick);
      window.addEventListener("resize", onResize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", onResize);
      }

      document.addEventListener("visibilitychange", function () {
        const video = document.querySelector(".bg-video");
        if (!video) return;
        if (document.hidden) video.pause();
        else video.play().catch(function () {});
      });
    })();
  </script>
</body>
</html>
