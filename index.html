<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="description" content="TimingSlip — arcade games and time-bending experiments." />
  <meta name="theme-color" content="#03070d" />
  <title>GamesTIMINGSLIP</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root {
      --bg: #03070d;
      --text: #e8f0fa;
      --muted: #8aa3bb;
      --accent: #f0c86a;
      --hub: 158px;
      --sat: 74px;
      --r: min(clamp(148px, 28vmin, 270px), calc(50vw - var(--sat) / 2 - 168px), calc(50vh - var(--sat) / 2 - 120px));
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      color-scheme: dark;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      opacity: 0.28;
      filter: saturate(0.7) contrast(1.05);
    }

    .bg-wash {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 48%, rgba(18, 42, 58, 0.15), transparent 58%),
        radial-gradient(circle at 50% 50%, transparent 18%, rgba(3, 7, 13, 0.55) 72%, rgba(3, 7, 13, 0.88) 100%),
        linear-gradient(180deg, rgba(3, 7, 13, 0.35), rgba(3, 7, 13, 0.62));
    }

    .bg-wash::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(90, 160, 190, 0.018) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 5px, rgba(90, 160, 190, 0.012) 5px 6px);
      mask-image: radial-gradient(circle at 50% 50%, #000 10%, transparent 72%);
    }

    #spores,
    #nervous,
    #probe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #spores { z-index: 2; }
    #nervous { z-index: 3; }
    #probe { z-index: 7; }

    .stage {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100dvh;
      min-height: 100svh;
    }

    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      z-index: 5;
    }

    .hub-orb {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--hub);
      height: var(--hub);
      transform: translate(-50%, -50%) scale(0.72);
      opacity: 0;
      transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    }

    a.hub-orb {
      display: block;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    a.hub-orb:visited,
    a.hub-orb:hover,
    a.hub-orb:active {
      color: inherit;
      text-decoration: none;
    }

    a.hub-orb:focus {
      outline: none;
    }

    a.hub-orb:focus-visible {
      outline: 2px solid rgba(240, 200, 106, 0.75);
      outline-offset: 6px;
    }

    body.is-ready .hub-orb,
    .stage.is-ready .hub-orb {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .hub-corona {
      position: absolute;
      inset: -38%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(240, 200, 106, 0.28) 0%, rgba(70, 180, 190, 0.12) 36%, transparent 68%);
      animation: corona 6.4s ease-in-out infinite;
      pointer-events: none;
    }

    .hub-ring,
    .hub-ring-2 {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      border: 1px solid transparent;
    }

    .hub-ring {
      inset: -14px;
      background:
        conic-gradient(from 0deg,
          transparent 0 8%,
          rgba(126, 230, 214, 0.7) 12%,
          transparent 18% 42%,
          rgba(240, 200, 106, 0.75) 48%,
          transparent 54% 78%,
          rgba(110, 180, 255, 0.55) 84%,
          transparent 90%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 100%);
              mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 100%);
      animation: spin 22s linear infinite;
    }

    .hub-ring-2 {
      inset: -26px;
      background:
        conic-gradient(from 140deg,
          transparent 0 20%,
          rgba(240, 200, 106, 0.35) 24%,
          transparent 30% 68%,
          rgba(90, 210, 200, 0.4) 74%,
          transparent 80%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 100%);
              mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 100%);
      animation: spin 38s linear infinite reverse;
      opacity: 0.8;
    }

    .hub-body {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(circle at 34% 30%, rgba(255, 246, 220, 0.7) 0 2%, transparent 14%),
        radial-gradient(circle at 50% 46%, #f4d48a 0%, #d4923a 26%, #24505a 52%, #0a1820 74%, #05090e 100%);
      box-shadow:
        0 0 18px 3px rgba(240, 200, 106, 0.4),
        0 0 64px 16px rgba(64, 170, 180, 0.2),
        0 0 120px 36px rgba(240, 200, 106, 0.08),
        inset 0 -18px 28px rgba(0, 8, 14, 0.45),
        inset 0 10px 18px rgba(255, 236, 190, 0.12);
    }

    .hub-body::after {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px solid rgba(240, 200, 106, 0.18);
      box-shadow: inset 0 0 22px rgba(40, 200, 190, 0.12);
    }

    .hub-core {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 28%;
      height: 28%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 35%, #fff6d6, #f0c86a 38%, #8a4a18 80%);
      box-shadow:
        0 0 16px 4px rgba(240, 200, 106, 0.7),
        0 0 40px 10px rgba(240, 180, 80, 0.25);
      animation: pulse 3.6s ease-in-out infinite;
    }

    .hub-speck {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(180, 255, 240, 0.55);
      box-shadow: 0 0 5px rgba(140, 240, 220, 0.45);
      animation: orbit 11s linear infinite;
    }

    .hub-speck:nth-child(2) { animation-duration: 17s; animation-delay: -4s; width: 3px; height: 3px; }
    .hub-speck:nth-child(3) { animation-duration: 13s; animation-delay: -8s; }

    .brand {
      position: absolute;
      left: 50%;
      top: calc(1.15rem + var(--safe-t));
      transform: translateX(-50%);
      text-align: center;
      width: max-content;
      z-index: 7;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.9s ease 0.35s;
    }

    body.is-ready .brand,
    .stage.is-ready .brand { opacity: 1; }

    .brand h1 {
      margin: 0;
      font-size: clamp(0.86rem, 2.1vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.32em;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
    }

    .brand h1 span {
      color: var(--accent);
      text-shadow: 0 0 16px rgba(240, 200, 106, 0.45);
    }

    .constellation {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sat {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--sat);
      height: var(--sat);
      color: inherit;
      text-decoration: none;
      transform: translate(-50%, -50%) rotate(var(--a)) translateY(calc(-1 * var(--r) * var(--rm, 1))) rotate(calc(var(--a) * -1));
      z-index: 6;
      pointer-events: auto;
    }

    .orb {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transform: scale(0.35);
      opacity: 0;
      color: var(--c);
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.55), transparent 22%),
        radial-gradient(circle at 50% 54%, color-mix(in srgb, var(--c) 55%, #0a1218) 0%, #0a1218 72%);
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 0 16px color-mix(in srgb, var(--c) 35%, transparent),
        0 0 36px color-mix(in srgb, var(--c) 14%, transparent),
        inset 0 -10px 16px rgba(0, 0, 0, 0.35);
      transition:
        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.55s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
      transition-delay: var(--d, 0s);
    }

    .orb svg {
      width: 44%;
      height: 44%;
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 55%, transparent));
    }

    body.is-ready .orb,
    .stage.is-ready .orb {
      transform: scale(1);
      opacity: 1;
    }

    .sat:hover > .orb,
    .sat:focus-visible > .orb,
    .sat-face:hover > .orb,
    .sat-face:focus-visible > .orb,
    .sat-branch:hover .orb,
    .sat-branch:focus-visible .orb {
      transform: scale(1.12);
      border-color: color-mix(in srgb, var(--c) 90%, white);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 0 22px color-mix(in srgb, var(--c) 60%, transparent),
        0 0 54px color-mix(in srgb, var(--c) 28%, transparent),
        inset 0 -10px 16px rgba(0, 0, 0, 0.3);
      outline: none;
    }

    .sat:focus-visible > .orb,
    .sat-face:focus-visible > .orb,
    .sat-branch:focus-visible .orb {
      outline: 2px solid var(--c);
      outline-offset: 5px;
    }

    .sat:focus,
    .sat-face:focus,
    .sat-branch:focus {
      outline: none;
    }

    .sat--fork {
      cursor: default;
    }

    .sat--fork:hover,
    .sat--fork:focus-within,
    body[data-focus="tetris"] .sat[data-id="tetris"] {
      z-index: 7;
    }

    .sat-face {
      position: absolute;
      inset: 0;
      display: block;
      color: inherit;
      text-decoration: none;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1;
    }

    .sat-branch {
      position: absolute;
      width: calc(var(--sat) * 0.72);
      height: calc(var(--sat) * 0.72);
      color: inherit;
      text-decoration: none;
      z-index: 7;
      pointer-events: auto;
    }

    .sat-branch[data-fork="gb"] {
      left: calc(50% + var(--sat) * -1.08);
      top: calc(50% + var(--sat) * 1);
    }

    .sat-branch[data-fork="nes"] {
      left: calc(50% + var(--sat) * 1.08);
      top: calc(50% + var(--sat) * 1);
    }

    .sat-branch-label {
      position: absolute;
      left: 50%;
      top: calc(100% + 5px);
      transform: translateX(-50%);
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c);
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
      opacity: 0.92;
    }

    #readout {
      --c: var(--accent);
      position: fixed;
      z-index: 8;
      width: min(272px, calc(100vw - 28px));
      padding: 0.78rem 0.95rem 0.88rem;
      pointer-events: none;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(12, 22, 34, 0.55), transparent 40%),
        rgba(5, 10, 16, 0.86);
      border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.45),
        0 14px 40px rgba(0, 0, 0, 0.5),
        0 0 28px color-mix(in srgb, var(--c) 20%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      clip-path: inset(0 100% 0 0);
    }

    #readout.is-open {
      opacity: 1;
      visibility: visible;
      transform: none;
      clip-path: inset(0 0 0 0);
      transition:
        opacity 0.22s ease,
        transform 0.28s ease,
        clip-path 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #readout::before,
    #readout::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      pointer-events: none;
    }

    #readout::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--c);
      border-left: 2px solid var(--c);
      box-shadow: 0 0 8px color-mix(in srgb, var(--c) 45%, transparent);
    }

    #readout::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid var(--c);
      border-bottom: 2px solid var(--c);
      box-shadow: 0 0 8px color-mix(in srgb, var(--c) 45%, transparent);
    }

    .readout-kind {
      display: block;
      margin-bottom: 0.22rem;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c);
    }

    .readout-title {
      display: block;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .readout-desc {
      margin: 0.38rem 0 0;
      font-size: 0.84rem;
      line-height: 1.4;
      color: var(--muted);
      min-height: 3.6em;
    }

    #readout.is-title-only {
      padding-bottom: 0.72rem;
    }

    #readout.is-title-only .readout-kind,
    #readout.is-title-only .readout-desc {
      display: none;
      margin: 0;
      min-height: 0;
    }

    .readout-desc.is-typing::after {
      content: "▋";
      margin-left: 1px;
      color: var(--c);
      animation: blink 0.8s step-end infinite;
    }

    .probe-glow,
    .probe-body,
    .probe-core {
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .probe-glow { opacity: 0.55; }
    .probe-line {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }
    .probe-line.is-on {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(0.7rem + var(--safe-b));
      z-index: 4;
      margin: 0;
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(154, 176, 200, 0.42);
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    body[data-focus] .footer { opacity: 0; }

    .noscript {
      position: relative;
      z-index: 8;
      max-width: 28rem;
      margin: 2rem auto;
      padding: 1rem;
      color: var(--text);
    }

    .noscript a { color: var(--accent); }

    /* Veins live in #nervous (sibling of .stage), so state lives on body */
    .vein { opacity: 0.96; transition: opacity 0.35s ease, filter 0.35s ease; }
    body[data-focus] .vein {
      opacity: 0.18;
      filter: saturate(0.45);
    }
    body[data-focus] .vein.is-hot {
      opacity: 1;
      filter: none;
    }

    .vein-glow {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.7;
    }

    .vein-body,
    .vein-core,
    .capillary {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .vein-flow {
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 7 26;
      opacity: 0;
    }

    body.is-flowing .vein-flow {
      opacity: 0.95;
      animation: flow 3.8s linear infinite;
    }

    body[data-focus] .vein.is-hot .vein-flow {
      animation-duration: 1.8s;
      opacity: 1;
    }

    .growing {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    body.is-grown .growing {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1.35s cubic-bezier(0.4, 0, 0.2, 1);
      transition-delay: var(--gd, 0s);
    }

    .node {
      opacity: 0;
    }

    body.is-grown .node {
      opacity: 1;
      transition: opacity 0.5s ease;
      transition-delay: calc(var(--gd, 0s) + 0.8s);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.14); opacity: 0.88; }
    }

    @keyframes corona {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes orbit {
      from { transform: rotate(0deg) translateX(42px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(42px) rotate(-360deg); }
    }

    @keyframes flow { to { stroke-dashoffset: -132; } }
    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 720px) {
      :root {
        --hub: 104px;
        --sat: 56px;
        --r: min(clamp(136px, 21vh, 228px), calc(50vw - var(--sat) / 2 - 36px), calc(50vh - var(--sat) / 2 - 110px));
      }
      .sat[data-id="doom"],
      .sat[data-id="pacman"],
      .sat[data-id="invaders"] { --rm: 0.9; }
      .sat-branch[data-fork="gb"] {
        left: calc(50% + var(--sat) * -1);
        top: calc(50% + var(--sat) * 0.92);
      }
      .sat-branch[data-fork="nes"] {
        left: calc(50% + var(--sat) * 1);
        top: calc(50% + var(--sat) * 0.92);
      }
      #readout { width: min(320px, calc(100vw - 28px)); }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(30px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
      }
    }

    @media (max-width: 420px) {
      :root {
        --hub: 88px;
        --sat: 50px;
        --r: min(clamp(120px, 20vh, 196px), calc(50vw - var(--sat) / 2 - 36px), calc(50vh - var(--sat) / 2 - 130px));
      }
    }

    @media (max-height: 620px) and (max-width: 720px) {
      :root {
        --hub: 86px;
        --sat: 48px;
        --r: min(clamp(108px, 28vmin, 150px), calc(50vw - var(--sat) / 2 - 36px), calc(50vh - var(--sat) / 2 - 96px));
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      :root {
        --hub: 72px;
        --sat: 42px;
        --r: min(clamp(90px, 13vw, 136px), calc(50vh - var(--sat) / 2 - 24px));
      }
      .brand { display: none; }
      .footer { display: none; }
      .sat-branch[data-fork="gb"] {
        left: calc(50% + var(--sat) * -1.28);
        top: calc(50% + var(--sat) * 0.22);
      }
      .sat-branch[data-fork="nes"] {
        left: calc(50% + var(--sat) * 1.28);
        top: calc(50% + var(--sat) * 0.22);
      }
      .sat-branch-label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
      .hub-orb {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      body.is-ready .orb,
      .stage.is-ready .orb {
        transform: scale(1);
        opacity: 1;
      }
      .growing { stroke-dashoffset: 0; }
      .node, .brand { opacity: 1; }
      .vein-flow { opacity: 0 !important; }
      #readout.is-open {
        clip-path: none;
        transform: none;
      }
      .probe-line { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="background.mp4" type="video/mp4" />
  </video>
  <div class="bg-wash" aria-hidden="true"></div>
  <canvas id="spores" aria-hidden="true"></canvas>
  <svg id="nervous" aria-hidden="true"></svg>
  <svg id="probe" aria-hidden="true"></svg>

  <main class="stage" id="stage">
    <header class="brand">
      <h1>GamesTIMING<span>SLIP</span></h1>
    </header>

    <div class="hub">
      <a class="hub-orb" href="living.html" rel="nofollow" aria-label="Enter">
        <div class="hub-corona"></div>
        <div class="hub-ring"></div>
        <div class="hub-ring-2"></div>
        <div class="hub-body">
          <div class="hub-speck"></div>
          <div class="hub-speck"></div>
          <div class="hub-speck"></div>
          <div class="hub-core"></div>
        </div>
      </a>
    </div>

    <nav class="constellation" aria-label="Site destinations">
      <a class="sat" data-id="invaders" href="Space%20Invaders.html" rel="nofollow"

  <script>
    (function () {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const root = document.body;
      const stage = document.getElementById("stage");
      const svg = document.getElementById("nervous");
      const probe = document.getElementById("probe");
      const readout = document.getElementById("readout");
      const canvas = document.getElementById("spores");
      const sats = Array.from(document.querySelectorAll(".sat"));
      const hubEl = document.querySelector(".hub-body");
      const coarse = window.matchMedia("(pointer: coarse)").matches;
      let typeTimer = 0;
      let showTimer = 0;
      let activeId = null;
      let activeFork = null;
      let armedId = null;

      const NS = "http://www.w3.org/2000/svg";
      let grownOnce = false;
      let resizeTimer = 0;

      function hashStr(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function rng(seed) {
        let a = seed || 1;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function cssColor(el) {
        return getComputedStyle(el).getPropertyValue("--c").trim() || "#9ad";
      }

      function centerOf(el) {
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: Math.min(r.width, r.height) / 2 };
      }

      function tendril(id, x1, y1, x2, y2, hub) {
        const r = rng(hashStr(id + ":v3"));
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const tx = dx / len;
        const ty = dy / len;
        const nx = -ty;
        const ny = tx;
        const keepOut = hub.r + 18;
        const maxSpread = Math.min(14 + r() * 42, len * 0.2);

        function away(x, y) {
          const ox = x - hub.x;
          const oy = y - hub.y;
          const d = Math.hypot(ox, oy) || 1;
          if (d >= keepOut) return { x: x, y: y };
          return { x: hub.x + (ox / d) * keepOut, y: hub.y + (oy / d) * keepOut };
        }

        const waves = len < 150 ? 1 : 2 + Math.floor(r() * 2);
        const points = [{ x: x1, y: y1 }];
        for (let i = 1; i <= waves; i++) {
          const t = i / (waves + 1);
          const side = (i % 2 === 0 ? 1 : -1) * (0.65 + r() * 0.5);
          let x = x1 + dx * t + nx * side * maxSpread;
          let y = y1 + dy * t + ny * side * maxSpread;
          if (r() > 0.42) {
            const g = 9;
            if (r() > 0.5) x = Math.round(x / g) * g;
            else y = Math.round(y / g) * g;
          }
          const p = away(x, y);
          points.push(p);
        }
        points.push({ x: x2, y: y2 });

        let d = "M " + points[0].x.toFixed(1) + " " + points[0].y.toFixed(1);
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const allowJog = len > 190 && i < points.length - 1 && r() > 0.7;
          if (allowJog) {
            const horizFirst = r() > 0.5;
            const mid = away(horizFirst ? p1.x : p0.x, horizFirst ? p0.y : p1.y);
            d += " L " + mid.x.toFixed(1) + " " + mid.y.toFixed(1) + " L " + p1.x.toFixed(1) + " " + p1.y.toFixed(1);
          } else {
            const cdx = p1.x - p0.x;
            const cdy = p1.y - p0.y;
            const cl = Math.hypot(cdx, cdy) || 1;
            const ox = (-cdy / cl) * (r() - 0.5) * Math.min(36, len * 0.12);
            const oy = (cdx / cl) * (r() - 0.5) * Math.min(36, len * 0.12);
            const c = away((p0.x + p1.x) / 2 + ox, (p0.y + p1.y) / 2 + oy);
            d += " Q " + c.x.toFixed(1) + " " + c.y.toFixed(1) + " " + p1.x.toFixed(1) + " " + p1.y.toFixed(1);
          }
        }

        const branches = [];
        const nB = len < 150 ? 1 + Math.floor(r() * 2) : len < 230 ? 2 + Math.floor(r() * 2) : 3 + Math.floor(r() * 2);
        const maxBlen = Math.min(14 + r() * 34, len * 0.24);
        for (let i = 0; i < nB; i++) {
          const t = 0.28 + r() * 0.46;
          const bx = x1 + dx * t + nx * (r() - 0.5) * 18;
          const by = y1 + dy * t + ny * (r() - 0.5) * 18;
          const side = r() < 0.5 ? -1 : 1;
          const ex = bx + nx * side * maxBlen + tx * (r() - 0.2) * maxBlen;
          const ey = by + ny * side * maxBlen + ty * (r() - 0.2) * maxBlen;
          const cx = (bx + ex) / 2 + tx * 8 * (r() - 0.5);
          const cy = (by + ey) / 2 + ty * 8 * (r() - 0.5);
          branches.push({
            d: "M " + bx.toFixed(1) + " " + by.toFixed(1) + " Q " + cx.toFixed(1) + " " + cy.toFixed(1) + " " + ex.toFixed(1) + " " + ey.toFixed(1),
            tip: { x: ex, y: ey },
            root: { x: bx, y: by }
          });
        }

        return { d: d, branches: branches, points: points };
      }

      function el(name, attrs) {
        const node = document.createElementNS(NS, name);
        for (const k in attrs) node.setAttribute(k, attrs[k]);
        return node;
      }

      function draw() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        svg.setAttribute("viewBox", "0 0 " + w + " " + h);
        svg.setAttribute("width", w);
        svg.setAttribute("height", h);
        while (svg.firstChild) svg.removeChild(svg.firstChild);

        const defs = el("defs", {});
        const blur = el("filter", { id: "vein-soft", x: "-20%", y: "-20%", width: "140%", height: "140%" });
        blur.appendChild(el("feGaussianBlur", { in: "SourceGraphic", stdDeviation: "3.6" }));
        defs.appendChild(blur);
        svg.appendChild(defs);

        const hub = centerOf(hubEl);
        const delayStep = 0.11;

        sats.forEach(function (sat, i) {
          const id = sat.dataset.id;
          const color = cssColor(sat);
          const orb = sat.querySelector(".orb");
          const dest = centerOf(orb);
          const vx = dest.x - hub.x;
          const vy = dest.y - hub.y;
          const dist = Math.hypot(vx, vy) || 1;
          const ux = vx / dist;
          const uy = vy / dist;
          const x1 = hub.x + ux * (hub.r - 2);
          const y1 = hub.y + uy * (hub.r - 2);
          const x2 = dest.x - ux * (dest.r - 1);
          const y2 = dest.y - uy * (dest.r - 1);
          const spec = tendril(id, x1, y1, x2, y2, hub);
          const gd = (0.18 + i * delayStep).toFixed(2) + "s";

          const g = el("g", { class: "vein", "data-id": id, style: "--gd:" + gd });

          const glow = el("path", {
            class: "vein-glow growing",
            d: spec.d,
            stroke: color,
            "stroke-width": "18",
            filter: "url(#vein-soft)",
            pathLength: "1"
          });
          const body = el("path", {
            class: "vein-body growing",
            d: spec.d,
            stroke: color,
            "stroke-width": "2.6",
            "stroke-opacity": "0.92",
            pathLength: "1"
          });
          const core = el("path", {
            class: "vein-core growing",
            d: spec.d,
            stroke: "#f6fbff",
            "stroke-width": "1.05",
            "stroke-opacity": "0.72",
            pathLength: "1"
          });
          const flow = el("path", {
            class: "vein-flow",
            d: spec.d,
            stroke: color,
            "stroke-width": "2.6"
          });

          g.appendChild(glow);
          g.appendChild(body);
          g.appendChild(core);
          g.appendChild(flow);

          spec.branches.forEach(function (br) {
            g.appendChild(el("path", {
              class: "capillary growing",
              d: br.d,
              stroke: color,
              "stroke-width": "1.35",
              "stroke-opacity": "0.75",
              pathLength: "1"
            }));
            g.appendChild(el("circle", {
              class: "node",
              cx: br.tip.x.toFixed(1),
              cy: br.tip.y.toFixed(1),
              r: "2.4",
              fill: color,
              "fill-opacity": "0.95"
            }));
          });

          spec.points.slice(1, -1).forEach(function (p, pi) {
            const diamond = el("rect", {
              class: "node",
              x: (p.x - 2.4).toFixed(1),
              y: (p.y - 2.4).toFixed(1),
              width: "4.8",
              height: "4.8",
              rx: pi % 2 === 0 ? "0.4" : "2.4",
              fill: "#071018",
              stroke: color,
              "stroke-width": "1"
            });
            diamond.setAttribute("transform", "rotate(45 " + p.x.toFixed(1) + " " + p.y.toFixed(1) + ")");
            g.appendChild(diamond);
          });

          g.appendChild(el("circle", {
            class: "node",
            cx: x2.toFixed(1),
            cy: y2.toFixed(1),
            r: "3.2",
            fill: "none",
            stroke: color,
            "stroke-width": "1.2"
          }));

          svg.appendChild(g);

          if (sat.classList.contains("sat--fork")) {
            sat.querySelectorAll(".sat-branch").forEach(function (br, bi) {
              const colorB = cssColor(br);
              const destB = centerOf(br.querySelector(".orb"));
              const vxB = destB.x - dest.x;
              const vyB = destB.y - dest.y;
              const distB = Math.hypot(vxB, vyB) || 1;
              const uxB = vxB / distB;
              const uyB = vyB / distB;
              const x1b = dest.x + uxB * (dest.r - 1);
              const y1b = dest.y + uyB * (dest.r - 1);
              const x2b = destB.x - uxB * (destB.r - 1);
              const y2b = destB.y - uyB * (destB.r - 1);
              const specB = tendril(id + ":" + (br.dataset.fork || bi), x1b, y1b, x2b, y2b, dest);
              const gdB = (0.18 + i * delayStep + 0.32 + bi * 0.08).toFixed(2) + "s";
              const gb = el("g", {
                class: "vein",
                "data-id": id,
                "data-fork": br.dataset.fork || "",
                style: "--gd:" + gdB
              });
              gb.appendChild(el("path", {
                class: "vein-glow growing",
                d: specB.d,
                stroke: colorB,
                "stroke-width": "12",
                filter: "url(#vein-soft)",
                pathLength: "1"
              }));
              gb.appendChild(el("path", {
                class: "vein-body growing",
                d: specB.d,
                stroke: colorB,
                "stroke-width": "2.1",
                "stroke-opacity": "0.92",
                pathLength: "1"
              }));
              gb.appendChild(el("path", {
                class: "vein-core growing",
                d: specB.d,
                stroke: "#f6fbff",
                "stroke-width": "0.9",
                "stroke-opacity": "0.72",
                pathLength: "1"
              }));
              gb.appendChild(el("path", {
                class: "vein-flow",
                d: specB.d,
                stroke: colorB,
                "stroke-width": "2.1"
              }));
              gb.appendChild(el("circle", {
                class: "node",
                cx: x2b.toFixed(1),
                cy: y2b.toFixed(1),
                r: "2.6",
                fill: "none",
                stroke: colorB,
                "stroke-width": "1.1"
              }));
              svg.appendChild(gb);
            });
          }
        });

        if (grownOnce || reduce) {
          root.classList.add("is-grown");
          stage.classList.add("is-grown");
          if (!reduce) {
            root.classList.add("is-flowing");
            stage.classList.add("is-flowing");
          }
        }
      }

      function clearProbe() {
        while (probe.firstChild) probe.removeChild(probe.firstChild);
      }

      function digitalPath(x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        if (Math.abs(dx) >= Math.abs(dy)) {
          const mid = x1 + dx * 0.52;
          return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
            " L " + mid.toFixed(1) + " " + y1.toFixed(1) +
            " L " + mid.toFixed(1) + " " + y2.toFixed(1) +
            " L " + x2.toFixed(1) + " " + y2.toFixed(1);
        }
        const mid = y1 + dy * 0.52;
        return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
          " L " + x1.toFixed(1) + " " + mid.toFixed(1) +
          " L " + x2.toFixed(1) + " " + mid.toFixed(1) +
          " L " + x2.toFixed(1) + " " + y2.toFixed(1);
      }

      function attachPoint(box, from) {
        const sides = [
          { x: box.left, y: box.top + box.h / 2 },
          { x: box.left + box.w, y: box.top + box.h / 2 },
          { x: box.left + box.w / 2, y: box.top },
          { x: box.left + box.w / 2, y: box.top + box.h }
        ];
        let best = sides[0];
        let bestD = Infinity;
        for (let i = 0; i < sides.length; i++) {
          const d = Math.hypot(sides[i].x - from.x, sides[i].y - from.y);
          if (d < bestD) {
            bestD = d;
            best = sides[i];
          }
        }
        return best;
      }

      function placeReadout(sat) {
        const orb = centerOf(sat.querySelector(".orb"));
        const hub = centerOf(hubEl);
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const pad = 16;
        const dock = vw < 720 || vh < 520;
        const wasOpen = readout.classList.contains("is-open");
        readout.classList.add("is-open");
        const w = readout.offsetWidth || Math.min(272, vw - 28);
        const h = readout.offsetHeight || 118;
        if (!wasOpen) readout.classList.remove("is-open");
        const vx = orb.x - hub.x;
        const vy = orb.y - hub.y;
        const dist = Math.hypot(vx, vy) || 1;
        const ux = vx / dist;
        const uy = vy / dist;
        let left;
        let top;
        if (dock) {
          left = Math.max(pad, (vw - w) / 2);
          top = vh - h - pad - 48;
        } else {
          const reach = orb.r + 36;
          const ax = orb.x + ux * reach;
          const ay = orb.y + uy * reach;
          left = ux >= 0 ? ax : ax - w;
          top = ay - h * 0.45;
          left = Math.max(pad, Math.min(left, vw - w - pad));
          top = Math.max(pad + 36, Math.min(top, vh - h - pad - 28));
        }
        const margin = 20;
        const closestX = Math.max(left, Math.min(orb.x, left + w));
        const closestY = Math.max(top, Math.min(orb.y, top + h));
        const pdx = orb.x - closestX;
        const pdy = orb.y - closestY;
        const pd = Math.hypot(pdx, pdy);
        const need = orb.r + margin;
        if (!dock && pd < need) {
          if (pd < 0.5) {
            left += ux >= 0 ? need : -need;
          } else {
            left -= (pdx / pd) * (need - pd);
            top -= (pdy / pd) * (need - pd);
          }
        }
        left = Math.max(pad, Math.min(left, vw - w - pad));
        top = Math.max(pad + 36, Math.min(top, vh - h - pad - 28));
        readout.style.left = left + "px";
        readout.style.top = top + "px";
        return { left: left, top: top, w: w, h: h, orb: orb };
      }

      function drawProbe(orb, box, color, instant) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        probe.setAttribute("viewBox", "0 0 " + w + " " + h);
        probe.setAttribute("width", w);
        probe.setAttribute("height", h);
        clearProbe();
        const dest = attachPoint(box, orb);
        const vx = dest.x - orb.x;
        const vy = dest.y - orb.y;
        const dist = Math.hypot(vx, vy) || 1;
        const x1 = orb.x + (vx / dist) * (orb.r - 1);
        const y1 = orb.y + (vy / dist) * (orb.r - 1);
        const d = digitalPath(x1, y1, dest.x, dest.y);
        const g = el("g", {});
        g.appendChild(el("path", {
          class: "probe-glow probe-line" + (instant ? " is-on" : ""),
          d: d,
          stroke: color,
          "stroke-width": "10",
          pathLength: "1"
        }));
        g.appendChild(el("path", {
          class: "probe-body probe-line" + (instant ? " is-on" : ""),
          d: d,
          stroke: color,
          "stroke-width": "1.8",
          pathLength: "1"
        }));
        g.appendChild(el("path", {
          class: "probe-core probe-line" + (instant ? " is-on" : ""),
          d: d,
          stroke: "#f6fbff",
          "stroke-width": "0.7",
          "stroke-opacity": "0.75",
          pathLength: "1"
        }));
        g.appendChild(el("circle", {
          cx: dest.x.toFixed(1),
          cy: dest.y.toFixed(1),
          r: "2.6",
          fill: color
        }));
        probe.appendChild(g);
        if (!instant) {
          requestAnimationFrame(function () {
            probe.querySelectorAll(".probe-line").forEach(function (p) {
              p.classList.add("is-on");
            });
          });
        }
      }

      function typeDesc(text) {
        const elDesc = readout.querySelector(".readout-desc");
        clearInterval(typeTimer);
        elDesc.classList.remove("is-typing");
        if (!text) {
          elDesc.textContent = "";
          return;
        }
        if (reduce) {
          elDesc.textContent = text;
          return;
        }
        elDesc.textContent = "";
        elDesc.classList.add("is-typing");
        let i = 0;
        typeTimer = window.setInterval(function () {
          i = Math.min(text.length, i + 2);
          elDesc.textContent = text.slice(0, i);
          if (i >= text.length) {
            clearInterval(typeTimer);
            elDesc.classList.remove("is-typing");
          }
        }, 12);
      }

      function hideReadout() {
        clearInterval(typeTimer);
        clearTimeout(showTimer);
        activeId = null;
        activeFork = null;
        readout.classList.remove("is-open", "is-title-only");
        readout.setAttribute("aria-hidden", "true");
        readout.querySelector(".readout-desc").textContent = "";
        readout.querySelector(".readout-desc").classList.remove("is-typing");
        clearProbe();
      }

      function showReadout(sat, instant, source) {
        const src = source || sat;
        const id = sat.dataset.id;
        const fork = src.dataset.fork || null;
        const color = cssColor(src);
        const same = activeId === id && activeFork === fork && readout.classList.contains("is-open");
        activeId = id;
        activeFork = fork;
        readout.style.setProperty("--c", color);
        const desc = src.dataset.desc || "";
        const kind = src.dataset.kind || "";
        readout.classList.toggle("is-title-only", !kind && !desc);
        readout.querySelector(".readout-kind").textContent = kind;
        readout.querySelector(".readout-title").textContent = src.dataset.title || "";
        readout.querySelector(".readout-desc").textContent = desc;
        readout.setAttribute("aria-hidden", "false");
        const box = placeReadout(src);
        if (!same && !instant && !reduce) {
          readout.classList.remove("is-open");
          readout.querySelector(".readout-desc").textContent = "";
          drawProbe(box.orb, box, color, false);
          showTimer = window.setTimeout(function () {
            readout.classList.add("is-open");
            typeDesc(desc);
          }, 180);
        } else {
          readout.classList.add("is-open");
          drawProbe(box.orb, box, color, true);
          if (same && instant) {
            readout.querySelector(".readout-desc").textContent = src.dataset.desc || "";
          } else {
            typeDesc(src.dataset.desc || "");
          }
        }
      }

      function setVeinFocus(id, on) {
        if (on) {
          root.dataset.focus = id;
          stage.dataset.focus = id;
        } else {
          if (root.dataset.focus === id) delete root.dataset.focus;
          if (stage.dataset.focus === id) delete stage.dataset.focus;
        }
        svg.querySelectorAll(".vein").forEach(function (v) {
          v.classList.toggle("is-hot", on && v.getAttribute("data-id") === id);
        });
      }

      function bindFocus() {
        sats.forEach(function (sat) {
          const id = sat.dataset.id;
          const branches = Array.from(sat.querySelectorAll(".sat-branch"));
          function branchFromEvent(ev) {
            if (!branches.length || !ev) return null;
            if (ev.target && ev.target.closest) {
              const direct = ev.target.closest(".sat-branch");
              if (direct && sat.contains(direct)) return direct;
            }
            if (typeof ev.clientX === "number") {
              const over = document.elementFromPoint(ev.clientX, ev.clientY);
              if (over && over.closest) {
                const br = over.closest(".sat-branch");
                if (br && sat.contains(br)) return br;
              }
            }
            return null;
          }
          function on(ev) {
            setVeinFocus(id, true);
            showReadout(sat, false, branchFromEvent(ev) || undefined);
          }
          function off() {
            if (coarse && armedId === id) return;
            setVeinFocus(id, false);
            if (activeId === id) hideReadout();
          }
          sat.addEventListener("pointerenter", on);
          sat.addEventListener("pointerleave", off);
          sat.addEventListener("focus", function (ev) {
            if (ev.target !== sat) return;
            on();
          });
          sat.addEventListener("blur", function (ev) {
            if (sat.contains(ev.relatedTarget)) return;
            off();
          });
          const face = sat.querySelector(".sat-face");
          if (face) {
            face.addEventListener("focus", function () {
              setVeinFocus(id, true);
              showReadout(sat, false);
            });
            face.addEventListener("blur", function (ev) {
              if (sat.contains(ev.relatedTarget)) return;
              off();
            });
          }
          sat.addEventListener("click", function (ev) {
            if (!coarse) return;
            if (ev.target.closest(".sat-branch")) return;
            if (armedId !== id) {
              ev.preventDefault();
              armedId = id;
              on();
            }
          });
          branches.forEach(function (br) {
            br.addEventListener("pointerenter", function () {
              setVeinFocus(id, true);
              showReadout(sat, false, br);
            });
            br.addEventListener("focus", function () {
              setVeinFocus(id, true);
              showReadout(sat, false, br);
            });
            br.addEventListener("pointerleave", function (ev) {
              if (coarse && armedId === id) {
                showReadout(sat, true);
                return;
              }
              const next = ev.relatedTarget;
              if (next && next.closest && next.closest(".sat-branch")) return;
              if (sat.contains(next)) showReadout(sat, true);
            });
          });
        });
        document.addEventListener("pointerdown", function (ev) {
          if (!ev.target.closest(".sat")) {
            armedId = null;
            if (activeId) {
              setVeinFocus(activeId, false);
              hideReadout();
            }
          }
        });
      }

      function spores() {
        if (reduce) return;
        const ctx = canvas.getContext("2d");
        const parts = [];
        const n = 88;

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(window.innerWidth * dpr);
          canvas.height = Math.floor(window.innerHeight * dpr);
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function spawn(force) {
          return {
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            vx: (Math.random() - 0.5) * 0.18,
            vy: (Math.random() - 0.55) * 0.22,
            r: force ? 0.6 + Math.random() * 1.4 : 0.4 + Math.random() * 1.2,
            a: 0.08 + Math.random() * 0.22,
            hue: Math.random() > 0.55 ? "200, 210, 170" : "140, 210, 210"
          };
        }

        resize();
        for (let i = 0; i < n; i++) parts.push(spawn(true));

        let last = 0;
        function tick(now) {
          if (document.hidden) {
            requestAnimationFrame(tick);
            return;
          }
          const dt = Math.min(40, now - last || 16);
          last = now;
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          for (let i = 0; i < parts.length; i++) {
            const p = parts[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (p.x < -8) p.x = window.innerWidth + 8;
            if (p.x > window.innerWidth + 8) p.x = -8;
            if (p.y < -8) p.y = window.innerHeight + 8;
            if (p.y > window.innerHeight + 8) p.y = -8;
            ctx.beginPath();
            ctx.fillStyle = "rgba(" + p.hue + "," + p.a + ")";
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          requestAnimationFrame(tick);
        }

        window.addEventListener("resize", resize);
        requestAnimationFrame(tick);
      }

      function onResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          draw();
          if (activeId) {
            const sat = sats.find(function (s) { return s.dataset.id === activeId; });
            if (sat) {
              const br = activeFork
                ? sat.querySelector('.sat-branch[data-fork="' + activeFork + '"]')
                : null;
              showReadout(sat, true, br || undefined);
            }
          }
        }, 80);
      }

      bindFocus();
      draw();
      spores();

      requestAnimationFrame(function () {
        root.classList.add("is-ready");
        stage.classList.add("is-ready");
        if (reduce) {
          root.classList.add("is-grown");
          stage.classList.add("is-grown");
          return;
        }
        requestAnimationFrame(function () {
          root.classList.add("is-grown");
          stage.classList.add("is-grown");
          grownOnce = true;
          window.setTimeout(function () {
            root.classList.add("is-flowing");
            stage.classList.add("is-flowing");
          }, 1600);
        });
      });

      window.addEventListener("resize", onResize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", onResize);
      }

      document.addEventListener("visibilitychange", function () {
        const video = document.querySelector(".bg-video");
        if (!video) return;
        if (document.hidden) video.pause();
        else video.play().catch(function () {});
      });
    })();
  </script>
</body>
